services:
  postgres:
    image: postgres:15-alpine
    container_name: sawmill_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Zombi2010
      POSTGRES_DB: telegram-mini-app_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_v1_init_schema.up.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telegram-mini-app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: sawmill_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:Zombi2010@postgres:5432/telegram-mini-app_db?sslmode=disable
      JWT_SECRET: sawmill_super_secret_jwt_key_2026_x98z
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: