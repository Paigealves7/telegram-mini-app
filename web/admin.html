<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141619">
<title>Панель управления платформой · Лесопилка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#111315;--surface:#191c1f;--panel:#25292c;--line:#34393c;--text:#f5efe6;--muted:#a5acb1;--accent:#f5efe6;--accent-ink:#202223;--good:#3ecf8e;--warn:#dcba84;--danger:#f19c99;--logs:#73b1cd;--boards:#6fbc9d;--raw:#c9ae86;--ready:#9c99cb;--shadow:0 20px 55px #0005;--ease:cubic-bezier(.22,1,.36,1)}
:root[data-theme=light]{color-scheme:light;--bg:#f5f5f2;--surface:#fff;--panel:#efefec;--line:#d8dbd8;--text:#242725;--muted:#596360;--accent:#303732;--accent-ink:#fff;--good:#18744e;--warn:#815c23;--danger:#a33835;--logs:#538aa3;--boards:#428b70;--raw:#a18456;--ready:#847eac;--shadow:0 20px 55px #28302a20}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Onest,system-ui,sans-serif;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
button:active:not(:disabled),.button:active{transform:scale(.97)}
button,.button{transition:transform 100ms var(--ease)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--good)}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(26px,4vw,42px);line-height:1.12;letter-spacing:-.045em}
h2{font-size:20px;letter-spacing:-.025em}
h3{font-size:16px}
small,.muted{color:var(--muted)}
.unit{white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:16px}
.row>*,.stack>*,.metrics>*,.org-grid>*{min-width:0}
.card{padding:clamp(14px,2vw,24px);border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:var(--panel);font-size:12px;font-weight:700;color:var(--muted)}
.good{color:var(--good)}
.warn{color:var(--warn)}
.error,.danger{color:var(--danger)}
.error:empty,.status:empty{display:none}
.button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none;font-weight:600;text-align:center}
.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.button.danger{color:var(--danger)}
.icon{min-width:44px;padding:8px;font-size:22px;line-height:1}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:-.025em}
.mark{display:grid;place-items:center;width:34px;height:34px;flex:none;background:var(--accent);border-radius:10px;color:var(--accent-ink)}
.mark svg{width:22px;height:22px}
.logo-text small{display:block;font-size:12px;font-weight:500;letter-spacing:0}
.shell{min-height:100dvh}
.sidebar{position:fixed;inset:auto 0 0;z-index:2;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.sidebar .brand{display:none}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
nav button{display:grid;justify-items:center;align-content:center;gap:3px;min-height:52px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:4px}
nav button[aria-current=page]{color:var(--text)}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1300px;margin-inline:auto;padding:calc(22px + max(env(safe-area-inset-top),var(--tg-top,0px))) max(12px,env(safe-area-inset-right)) calc(86px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top .button{flex:none}
.org-grid,.kpis,.charts{display:grid;gap:12px;min-width:0}
.org-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.kpis,.segments,.sheet-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.metric{display:flex;flex-direction:column;align-items:start;gap:6px;min-width:0;padding:clamp(9px,1.6vw,22px)}
.metric b{font-size:clamp(24px,3.4vw,42px);letter-spacing:-.055em;line-height:1.12}
.metric b .unit{font-size:.88em}.metric small,.metric>span{font-size:clamp(11px,1.1vw,14px);color:var(--muted)}
.health{display:flex;align-items:center;gap:5px;border-block:1px solid var(--line);color:var(--muted);font-size:12px}
.health-line{display:flex;align-items:center;gap:.7em;overflow:auto;white-space:nowrap;scrollbar-width:none;flex:1}
.health-line span+span:before{content:'·';margin-right:.7em}
.health button,.quiet{background:none;border:0;color:var(--text);min-height:42px;padding:4px 7px}
.health button{font-size:20px;min-width:36px}.online:before,.pill:before,.legend-dot{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dot,var(--good));margin-right:5px}
.online:before{animation:blink 2s ease-in-out infinite}@keyframes blink{50%{opacity:.5}}
.charts{align-items:start}.chart{min-width:0;display:grid;gap:17px}.chart h2{font-size:18px}.chart-total{font-size:28px;letter-spacing:-.045em}
.track{display:block;width:100%;height:8px;border-radius:6px;overflow:hidden;background:var(--panel)}
.legend,.ranking{display:grid}.legend-row,.rank{display:grid;align-items:center;gap:8px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.legend-row{grid-template-columns:minmax(0,1fr) auto 48px;font-size:13px}.legend-row small{text-align:right}.legend-name{display:grid;gap:5px}.legend-name .track{height:3px;max-width:112px}.rank>b{text-align:right}.rank{grid-template-columns:minmax(0,1fr) 112px!important}
@media(max-width:540px){.health{font-size:11px;gap:2px}.health-line{gap:3px}.health-line span+span:before{margin-right:3px}.health button{min-width:30px;padding-inline:4px}}
.rank{grid-template-columns:minmax(0,1fr) auto}.rank strong{font-weight:600}.rank small{text-align:right}
.rank .track{height:5px}.chart .track{align-self:center}.org{display:grid;align-content:start;gap:13px}.org h2{font-size:18px}.org-head,.org-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.org-head>div{min-width:0}.org-head button,.org-foot button{flex:none}.org-foot{border-top:1px solid var(--line);padding-top:6px}
.badges,.summary,.legend-mini{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}.badges{margin-top:5px}.pill{align-items:center;font-size:11px;padding:2px 7px;font-weight:500}.pill:before{width:5px;height:5px}
.summary{justify-content:space-between;gap:4px;font-size:12px}.summary b{display:block;font-size:18px;color:var(--text)}.summary>span{color:var(--muted)}
.legend-mini{font-size:12px;color:var(--muted)}.company{white-space:pre-wrap}
.search{position:relative}.search svg{position:absolute;left:13px;top:13px;width:18px;fill:none;stroke:var(--muted);stroke-width:1.7}.search input[type=search]{padding-left:40px;background:var(--surface)}
.filters{display:flex;flex-wrap:wrap;gap:5px}.filters .button{min-height:36px;border-radius:100px;font-size:12px;padding-inline:10px;background:none}.filters .button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.settings-list{padding-block:2px}.settings-list>*{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:55px;background:none;border:0;text-align:left;text-decoration:none;color:inherit;font-weight:500;padding:5px 0}.settings-list>*+*{border-top:1px solid var(--line)}.settings-list .danger{color:var(--danger)}
.sheet-tabs,.segments{border-radius:12px;padding:4px;background:var(--bg);gap:2px}.sheet-tabs button,.segments label{display:grid;place-items:center;text-align:center;position:relative;border:0;border-radius:9px;color:var(--muted);background:none;font-size:13px;min-height:42px;padding:4px}.sheet-tabs [aria-pressed=true],.segments label:has(:checked){background:var(--panel);color:var(--text)}.segments input{position:absolute;opacity:0;width:1px;height:1px}.segments label:focus-within{outline:2px solid var(--accent)}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.roles button{font-size:13px;padding:5px}.divider{border-top:1px solid var(--line);padding-top:12px}
nav button{position:relative}nav [aria-current=page]:before{content:'';position:absolute;top:-8px;width:23px;height:2px;background:var(--text);border-radius:2px}
@media(min-width:960px){.charts{grid-template-columns:1fr 1.2fr}nav [aria-current=page]:before{left:0;top:13px;width:2px;height:20px}}
html.lite *,html.lite *:before{animation:none!important;transition:none!important}
label{display:grid;gap:6px;font-weight:600}
input:not([type=checkbox]),textarea,select{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--panel)}
textarea{resize:vertical}
::placeholder{color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.toggle input{appearance:none;width:42px;height:25px;border:1px solid var(--line);border-radius:99px;background:var(--panel);display:grid;align-items:center;padding:3px;margin:0;flex:none;cursor:pointer}
.toggle input::before{content:"";width:17px;height:17px;border-radius:50%;background:var(--muted);transition:transform 170ms var(--ease)}
.toggle input:checked{background:var(--accent);border-color:var(--accent)}
.toggle input:checked::before{transform:translateX(16px);background:var(--accent-ink)}
.gate{display:grid;align-content:center;min-height:100dvh;width:min(100%,440px);margin:auto;padding:20px}
.gate h1{font-size:28px}
dialog{position:fixed;inset:auto 0 0;width:100%;max-width:100%;max-height:min(86dvh,calc(100dvh - 50px - var(--tg-top,0px)));margin:0;padding:0;border:1px solid var(--line);border-radius:24px 24px 0 0;background:var(--surface);color:var(--text);box-shadow:var(--shadow);overscroll-behavior:contain}
dialog[open]{animation:enter 220ms var(--ease)}
dialog::backdrop{background:#0d1012aa;backdrop-filter:blur(4px)}
body:has(dialog[open]){overflow:hidden}
.dialog-head{position:sticky;top:0;z-index:1;flex-wrap:nowrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.dialog-head button{flex:none}
.dialog-content{padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.dialog-content .card{background:var(--bg)}
.invite{display:grid;gap:8px;min-width:0;border-top:1px solid var(--line);padding:12px 0}
.password-field{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px}
.credentials,.member{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;min-width:0}
.credentials code{user-select:all}.member details>summary{cursor:pointer;width:fit-content;padding-block:10px}.member details>form{padding-top:8px}
.member-list{display:grid;gap:8px}.member-list:empty,#web-user-result:empty{display:none}
.code{font:700 19px ui-monospace,monospace;letter-spacing:.06em;user-select:all}
#invite-result .code{font-size:25px}
.notice{position:fixed;z-index:4;bottom:calc(74px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:10px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);max-width:calc(100% - 24px)}
dialog .notice{position:sticky;left:auto;transform:none;bottom:0;max-width:none;margin:0 16px 12px}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:680px){main{padding-inline:24px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}dialog{inset:0;margin:auto;width:min(660px,calc(100% - 40px));border-radius:24px}}
@media(min-width:960px){.shell{padding-left:230px}.sidebar{inset:0 auto 0 0;width:230px;padding:28px 16px;border-top:0;border-right:1px solid var(--line)}.sidebar .brand{display:flex;padding:0 8px;margin-bottom:36px}nav{grid-template-columns:1fr}nav button{display:flex;justify-content:flex-start;align-items:center;min-height:46px;gap:10px;padding:0 12px;font-size:14px}main{padding:36px 32px}.notice{bottom:24px}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="card stack" id="gate-content"><h1>Панель управления платформой</h1><p role="status">Подключение…</p></div>
</div>
<div class="shell" id="shell" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 17l4-7 4 7H4Zm8 0 4-7 4 7h-8ZM8 9l4-6 4 6"/></svg></span><span class="logo-text">Urmanit Control<small>Управление платформой</small></span></div>
    <nav aria-label="Разделы панели">
      <button type="button" data-tab="pulse" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5l3-7 4 14 3-7h5"/></svg>Пульс</button>
      <button type="button" data-tab="orgs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20V9l6 3V9l6 3V4h4l2 16H3Zm4-4h1m4 0h1m4 0h1"/></svg>Лесопилки</button>
      <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="var(--surface)"/><circle cx="15" cy="17" r="2" fill="var(--surface)"/></svg>Настройки</button>
    </nav>
  </aside>
  <main>
    <header class="top"><h1 id="page-title">Пульс</h1><button class="button primary" id="create" type="button" hidden>+ Новая лесопилка</button></header>
    <p class="error status" id="load-error" role="alert"></p>
    <p class="muted status" id="loading" role="status"></p>
    <section class="stack" id="pulse" aria-labelledby="page-title"></section>
    <section class="stack" id="orgs" aria-labelledby="page-title" hidden>
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input type="search" id="search" aria-label="Поиск по названию" placeholder="Найти лесопилку"></label>
      <div class="filters" id="filters" role="group" aria-label="Фильтр лесопилок">
        <button class="button" type="button" data-filter="all" aria-pressed="true">Все</button>
        <button class="button" type="button" data-filter="work" aria-pressed="false">Рабочие</button>
        <button class="button" type="button" data-filter="demo" aria-pressed="false">Демо</button>
        <button class="button" type="button" data-filter="frozen" aria-pressed="false">Замороженные</button>
      </div>
      <div class="org-grid" id="org-list"></div>
    </section>
    <section class="stack" id="settings" aria-labelledby="page-title" hidden>
      <div class="card settings-list">
        <label class="toggle"><span>Тёмная тема</span><input type="checkbox" role="switch" id="theme-switch"></label>
        <a href="/">Перейти в основное приложение лесопилки <span>→</span></a>
        <button type="button" id="refresh">Обновить данные <span>↻</span></button>
        <button type="button" class="danger" id="logout">Выйти <span>↗</span></button>
      </div>
    </section>
  </main>
</div>
<dialog id="sheet" aria-labelledby="sheet-title">
  <header class="dialog-head row between"><h2 id="sheet-title"></h2><button class="button icon" id="close" type="button" aria-label="Закрыть">×</button></header>
  <div class="dialog-content stack" id="sheet-content"></div>
  <div class="notice" id="sheet-notice" role="status" hidden></div>
</dialog>
<div class="notice" id="notice" role="status" hidden></div>
<script>
'use strict';
const $ = selector => document.querySelector(selector);
const tg = window.Telegram?.WebApp;
const roles = {manager:'Руководитель',master:'Мастер',worker:'Сотрудник'};
const tabs = {pulse:'Пульс',orgs:'Лесопилки',settings:'Настройки'};
const el = {gate:$('#gate'), shell:$('#shell'), sheet:$('#sheet'), sheetContent:$('#sheet-content')};
const state = {filter:'all', overview:null, authenticated:false, botUsername:'', refresh:null, sheetVersion:0};
const number = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const date = new Intl.DateTimeFormat('ru-RU',{dateStyle:'short',timeStyle:'short'});
const esc = value => String(value ?? '').replace(/[&<>"']/g, character => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
})[character]);
const format = value => number.format(value ?? 0);
const amount = value => `<span class="unit">${format(value)}&nbsp;м³</span>`;
const when = value => value ? date.format(new Date(value)) : 'Операций пока нет';
const orgPath = id => `/admin/organizations/${encodeURIComponent(id)}`;
let noticeTimeout;

function applyTheme() {
  const selection = localStorage.getItem('theme');
  const theme = ['dark','light'].includes(selection) ? selection : (tg?.colorScheme || 'dark');
  document.documentElement.dataset.theme = theme;
  $('#theme-switch').checked = theme === 'dark';
  const color = theme === 'dark' ? '#111315' : '#f5f5f2';
  $('meta[name="theme-color"]').content = color;
  try { tg?.setHeaderColor(color); } catch {}
  try { tg?.setBackgroundColor(color); } catch {}
}
function safeArea() {
  const top = (tg?.safeAreaInset?.top || 0) + (tg?.contentSafeAreaInset?.top || 0);
  document.documentElement.style.setProperty('--tg-top',`${top}px`);
}
function notice(message) {
  clearTimeout(noticeTimeout);
  $('#notice').hidden = $('#sheet-notice').hidden = true;
  const target = el.sheet.open ? $('#sheet-notice') : $('#notice');
  target.textContent = message;
  target.hidden = false;
  noticeTimeout = setTimeout(() => { target.hidden = true; },3500);
}

class RequestError extends Error {
  constructor(status,message) {
    super(message);
    this.status = status;
  }
}
async function api(path,{method='GET',body,signal}={}) {
  const headers = {Accept:'application/json'};
  const token = localStorage.getItem('jwt_token');
  const isLogin = path.startsWith('/auth/');
  if (token && !isLogin) headers.Authorization = `Bearer ${token}`;
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  let response;
  try {
    response = await fetch('/api/v1'+path,{
      method, headers, signal, cache:'no-store', body:body === undefined ? undefined : JSON.stringify(body)
    });
  } catch (error) {
    if (error.name === 'AbortError') throw error;
    throw new RequestError(0,'Нет связи с сервером');
  }
  if (!response.ok) {
    const text = await response.text();
    const message = response.status < 500 && !text.trimStart().startsWith('<') ? text.trim() : '';
    if (response.status === 401 && !isLogin && state.authenticated && localStorage.getItem('jwt_token') === token) {
      signOut('Сессия завершилась. Войдите снова.');
    }
    if (response.status === 403 && path.startsWith('/admin/') && state.authenticated && localStorage.getItem('jwt_token') === token) {
      showDenied();
    }
    throw new RequestError(response.status,message || 'Не удалось выполнить запрос');
  }
  return response.status === 204 ? null : response.json();
}
function gate(content) {
  state.authenticated = false;
  state.refresh?.abort();
  el.shell.hidden = true;
  el.gate.hidden = false;
  el.sheet.close();
  $('#gate-content').innerHTML = content;
}
function showDenied() {
  gate('<h1>Доступ только для администратора платформы</h1><div class="row"><a class="button" href="/">Основное приложение</a><button class="button" type="button" id="other-login">Войти другим аккаунтом</button></div>');
  $('#other-login').onclick = () => signOut();
}
function showLogin(message='') {
  gate(`<h1>Панель управления платформой</h1>
    <form class="stack" id="login">
      <label>Логин<input name="username" autocomplete="username" required></label>
      <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
      <p class="error" role="alert">${esc(message)}</p>
      <button class="button primary" type="submit">Войти</button>
      <a href="/">Основное приложение</a>
    </form>`);
  bindForm($('#login'),async values => {
    const username = values.get('username').trim();
    const session = await api('/auth/login',{method:'POST',body:{username,password:values.get('password')}});
    localStorage.setItem('jwt_token',session.token);
    localStorage.setItem('uname',username);
    await authorize();
  });
}
function signOut(message) {
  localStorage.removeItem('jwt_token');
  state.overview = null;
  state.botUsername = '';
  showLogin(message);
}
async function authorize() {
  const config = await api('/config');
  if (!config.is_super_admin) {
    showDenied();
    return;
  }
  state.authenticated = true;
  el.gate.hidden = true;
  el.shell.hidden = false;
  showTab('pulse');
  await refresh();
}
async function start() {
  try {
    if (tg?.initData) {

function randomPassword() {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const limit = 256 - 256 % alphabet.length;
  const sample = new Uint8Array(1);
  let password = '';
  while (password.length < 10) {
    crypto.getRandomValues(sample);
    if (sample[0] < limit) password += alphabet[sample[0] % alphabet.length];
  }
  return password;
}
function readPassword(values,optional=false) {
  const password = values.get('password');
  if (!password && optional) return '';
  const length = new TextEncoder().encode(password).length;
  if (length < 8 || length > 72) throw new Error('Пароль должен содержать от 8 до 72 байт.');
  return password;
}

  }
  inviteList.addEventListener('click',async event => {
    const button = event.target.closest('button[data-revoke],button[data-retry]');
    if (!button || button.disabled) return;
    if (button.hasAttribute('data-retry')) {
      await loadInvites();
      return;
    }
    button.disabled = true;
    try {
      await api(path+'/invites/'+encodeURIComponent(button.dataset.revoke),{method:'DELETE'});
      if (current()) {
        if (String(newInvite?.id) === button.dataset.revoke) {
          newInvite = null;
          result.replaceChildren();
        }
        notice('Приглашение отозвано');
        await loadInvites();
      }
    } catch (error) {
      if (current()) notice(error.message);
    } finally {
      button.disabled = false;
    }
  });
  bindForm($('#new-invite'),async values => {
    const invite = await api(path+'/invites',{method:'POST',body:{role:values.get('role')}});
    if (current()) {
      newInvite = invite;
      warning = '';
      result.innerHTML = inviteResult(invite,org.name);
      result.scrollIntoView({block:'nearest'});
      await loadInvites();
    }
  });
  bindForm($('#edit-org'),async values => {
    const updated = await api(path,{method:'PUT',body:{...orgValues(values),is_active:values.has('is_active')}});
    if (current()) {
      manageOrg({...org,...updated},newInvite,warning,'settings');
      notice('Лесопилка обновлена');
    }
    void refresh();
  });
  const resetForm = $('#reset-org');
  if (resetForm) bindForm(resetForm,async values => {
    const confirm = values.get('confirm').trim().toUpperCase();
    if (confirm !== 'СБРОС') throw new Error('Введите СБРОС для подтверждения');
    await api(path+'/reset-test-data',{method:'POST',body:{confirm}});
    if (current()) {
      resetForm.reset();
      notice('Тестовые данные сброшены');
    }
    void refresh();
  });
  selectPane(initialTab);
}

async function copy(value) {
  try { await navigator.clipboard.writeText(value); }
  catch {
    const field = document.createElement('textarea');
    field.value = value;
    field.readOnly = true;
    field.style.position = 'fixed';
    field.style.opacity = '0';
    (el.sheet.open ? el.sheet : document.body).append(field);
    const focused = document.activeElement;
    field.select();
    try {
      if (!document.execCommand('copy')) throw new Error('Копирование недоступно');
    } finally {
      field.remove();
      focused?.focus();
    }
  }
}
document.addEventListener('click',async event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.tab) showTab(button.dataset.tab);
  if (button.hasAttribute('data-refresh')) void refresh();
  if (button.dataset.stock && Object.hasOwn(roles,button.dataset.role)) {
    localStorage.setItem('org_id',button.dataset.stock);
    location.assign('/?preview_role='+button.dataset.role);
  }
  if (button.dataset.org) {
    const org = state.overview?.organizations?.find(item => String(item.id) === button.dataset.org);
    if (org) manageOrg(org);
  }
  if (button.dataset.copy) {
    try {
      await copy(button.dataset.copy);
      notice('Скопировано');
    } catch {
      notice('Не удалось скопировать. Выделите код или откройте ссылку.');
    }
  }
});
$('#filters').addEventListener('click',event => {
  const button = event.target.closest('[data-filter]');
  if (!button) return;
  state.filter = button.dataset.filter;
  for (const filter of document.querySelectorAll('[data-filter]')) filter.setAttribute('aria-pressed',String(filter === button));
  renderOrgs();
});
$('#search').addEventListener('input',renderOrgs);
$('#create').onclick = createOrg;
$('#refresh').onclick = () => refresh();
$('#close').onclick = () => el.sheet.close();
el.sheet.addEventListener('close',() => {
  if (!el.sheet.open) el.sheetContent.replaceChildren();
});
$('#logout').onclick = () => signOut();
$('#theme-switch').onchange = event => {
  localStorage.setItem('theme',event.target.checked ? 'dark' : 'light');
  applyTheme();
};
window.addEventListener('storage',event => {
  if (event.key === 'theme') applyTheme();
  if (event.key === 'jwt_token' && state.authenticated) {
    if (!event.newValue) showLogin('Сессия завершилась. Войдите снова.');
    else location.reload();
  }
});
applyTheme();
safeArea();
tg?.onEvent?.('themeChanged',applyTheme);
tg?.onEvent?.('safeAreaChanged',safeArea);
tg?.onEvent?.('contentSafeAreaChanged',safeArea);
tg?.ready?.();
tg?.expand?.();
void start();
</script>
</body>
