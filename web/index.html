<!DOCTYPE html>
<html lang="ru" data-t="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121413">
<meta name="color-scheme" content="dark">
<title>Лесопилка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Лесопилка: Glassmorphism дизайн. Темные теплые тона, полупрозрачность. */
:root {
  --bg: #121413;
  --surface: rgba(255, 255, 255, 0.04);
  --surface-border: rgba(255, 255, 255, 0.08);
  --s1: #1a1c1b;
  --s2: #242725;
  --s3: #2d302e;
  --line: rgba(250,250,250,.08);
  --line2: rgba(250,250,250,.16);
  --t1: #f0f0f0;
  --t2: #a1a1aa;
  --t3: #8b8b95;
  --wood: #ebd2af;
  --err: #e8a29a;
  --ease: cubic-bezier(.2,.8,.2,1);
  --font: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --top: calc(var(--tg-content-safe-area-inset-top, 0px) + var(--tg-safe-area-inset-top, 0px) + env(safe-area-inset-top, 0px));
  --bot: calc(var(--tg-safe-area-inset-bottom, 0px) + env(safe-area-inset-bottom, 0px));
  
  /* Акценты кнопок из скриншота */
  --c-arrival: #d97757;
  --c-sawing: #7178d4;
  --c-order: #75b078;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  /* Имитация дымчатой текстуры/леса с помощью CSS-градиентов */
  background-image: 
    radial-gradient(circle at 80% -10%, rgba(133, 140, 130, 0.15) 0%, transparent 45%),
    radial-gradient(circle at 20% 40%, rgba(90, 100, 95, 0.1) 0%, transparent 60%),
    radial-gradient(circle at 50% 100%, rgba(60, 70, 65, 0.2) 0%, transparent 70%);
  background-attachment: fixed;
  color: var(--t1);
  font: 16px/1.5 var(--font);
  font-variant-numeric: tabular-nums;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  color-scheme: dark;
}
button, input, select { font: inherit; color: inherit; } button { cursor: pointer; }
svg { width: 24px; height: 24px; flex: none; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--t1); outline-offset: 2px; }
.mut, .hint { color: var(--t2); } .sm { font-size: 14px; }
.rip { position: relative; }

/* Шапка (Header) */
.top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(var(--top) + 24px) 24px 16px;
  background: transparent;
}
#title {
  flex: 1; min-width: 0;
  font-size: 30px; line-height: 36px; font-weight: 600;
  letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#hb {
  display: none; margin-left: -8px; width: 40px; height: 40px;
  border: 0; border-radius: 12px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
  place-items: center; transition: background .2s;
}
body.sub #hb { display: grid; } #hb:active { background: rgba(255,255,255,0.1); }
#hact { display: flex; align-items: center; gap: 12px; }

/* Стеклянные элементы в шапке (Кнопка отчетов и аватар) */
.hbtn, .avatar {
  background: var(--surface);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--surface-border);
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, background .2s;
}
.hbtn {
  flex-direction: column; gap: 4px; padding: 10px 12px;
  border-radius: 20px; font-weight: 500; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}
.hbtn svg { width: 22px; height: 22px; color: var(--t2); }
.hbtn span { font-size: 10px; color: var(--t2); text-transform: uppercase; letter-spacing: 0.05em; }
.hbtn:active, .avatar:active { background: rgba(255,255,255,0.1); transform: scale(.96); }

.avatar {
  width: 52px; height: 52px; border-radius: 50%;
  font-size: 20px; font-weight: 600; color: var(--wood);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}

#view { padding: 0 0 calc(var(--bot) + 120px); }
body.form #view { padding-bottom: calc(var(--bot) + 128px); }

/* Плавающее нижнее меню (Tabs) */
.tabs {
  position: fixed; left: 24px; right: 24px; bottom: 24px; z-index: 20;
  display: flex; justify-content: space-around; align-items: center; padding: 0 8px;
  height: 72px; max-width: 420px; margin: 0 auto;
  background: rgba(30, 32, 31, 0.65);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 36px; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
}
.tab {
  position: relative; width: 56px; height: 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 0; background: none; color: var(--t3); transition: color .2s; z-index: 1;
}
.tab span { display: none; } /* Скрываем текст табов по дизайну */
.tab svg { width: 26px; height: 26px; stroke-width: 1.8; }
.tab.on { color: var(--t1); }
.tab.on::after {
  content: ""; position: absolute;
  width: 48px; height: 48px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.04);
  border-radius: 18px; z-index: -1;
}
.tab:active { transform: scale(.94); }
/* Скрываем вкладку отчетов внизу, так как она перенесена в шапку */
.tabs .tab[data-v="stats"] { display: none !important; }

body.form .tabs, body.noauth .tabs, body.noauth .top, body.noauth .act { display: none; }
.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: none;
  padding: 16px 16px calc(var(--bot) + 16px); background: var(--bg); box-shadow: 0 -1px 0 var(--line);
}
body.form .act { display: block; }

/* Главная: Стеклянная карточка */
.glass-card {
  background: var(--surface);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--surface-border);
  border-radius: 32px; padding: 24px;
  margin: 8px 16px 24px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
}
.glass-card .lbl {
  text-transform: uppercase; font-size: 13px; color: var(--t2); font-weight: 500;
  letter-spacing: 0.04em; margin-bottom: 24px;
}

/* Круговой индикатор */
.arc-container {
  position: relative; width: 100%; display: flex; flex-direction: column; align-items: center;
}
.arc-svg { width: 220px; height: 110px; overflow: visible; }
.arc-svg path {
  stroke: var(--wood); filter: drop-shadow(0 0 12px rgba(235, 210, 175, 0.4));
}
.arc-container .big {
  margin-top: -64px;
  font-size: 56px; line-height: 1; font-weight: 400; letter-spacing: -0.02em; color: var(--t1);
}
.arc-container .sub-vol {
  color: var(--t2); font-size: 14px; margin-top: 12px; margin-bottom: 40px;
}

/* Кнопки действий (внутри карточки) */
.qa { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.qa-b {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.06); border-radius: 20px;
  padding: 16px 4px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); transition: background .2s, transform .1s;
}
.qa-b:active { background: rgba(255,255,255,0.08); transform: scale(.96); }
.qa-b svg { width: 28px; height: 28px; color: var(--t1); }
.qa-b span { font-size: 13px; color: var(--t1); font-weight: 400; text-align: center; }
.qa-b .dot {
  width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 10px currentColor; margin-bottom: 2px;
}
.qa-b .dot[data-id="arrival"] { color: var(--c-arrival); background: var(--c-arrival); }
.qa-b .dot[data-id="sawing"] { color: var(--c-sawing); background: var(--c-sawing); }
.qa-b .dot[data-id="order"] { color: var(--c-order); background: var(--c-order); }

/* Списки */
.list-wrap { padding: 0 24px; display: flex; flex-direction: column; }
.list-wrap .lg {
  display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center;
  padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
}
.list-wrap .lg:last-child { border-bottom: none; }
.list-wrap .lg span:first-child { font-size: 19px; font-weight: 400; }
.list-wrap .lg .mut { font-size: 16px; color: var(--t2); }
.list-wrap .lg b { font-size: 19px; font-weight: 500; text-align: right; }

.sh { display: flex; align-items: baseline; justify-content: space-between; margin: 40px 0 8px; padding: 0 24px; }
.sh h2 { font-size: 17px; line-height: 24px; font-weight: 600; }
.lnk { border: 0; background: none; color: var(--wood); font-size: 14px; font-weight: 500; }
.ld { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; box-shadow: inset 0 -1px 0 var(--line); }
.ld>span:first-child { color: var(--t2); }

/* Старые компоненты списков для других экранов */
.li {
  display: grid; grid-template-columns: 1fr auto; gap: 0 16px; width: calc(100% + 32px); margin: 0 -16px; padding: 16px; border: 0;
  background-color: transparent; background-image: linear-gradient(var(--line),var(--line)); background-size: calc(100% - 32px) 1px;
  background-position: center bottom; background-repeat: no-repeat; color: inherit; text-align: left; transition: background-color .2s;
}
button.li:active { background-color: rgba(255,255,255,0.05); }
.li-m, .li-e { display: flex; flex-direction: column; min-width: 0; } .li-e { text-align: right; align-items: flex-end; }
.li-t { font-weight: 500; } .li-v { font-weight: 600; } .li-s { color: var(--t2); font-size: 14px; }
.li-l { grid-column: 1/-1; display: grid; gap: 4px; margin-top: 8px; color: var(--t2); font-size: 14px; }
.grp { display: flex; justify-content: space-between; align-items: baseline; margin: 32px 0 0; font-size: 14px; font-weight: 600; color: var(--t2); padding: 0 24px; }
.grp b { font-weight: 600; }
.st { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; } .st i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

.empty { padding: 48px 24px; text-align: center; color: var(--t2); } .empty b { display: block; margin-bottom: 4px; color: var(--t1); font-weight: 500; }
.empty .btn { width: auto; margin: 24px auto 0; padding: 0 32px; }
.sk { height: 56px; margin: 8px 16px; border-radius: 20px; background: rgba(255,255,255,0.05); animation: pulse 1.4s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .4; } }

/* Управление (поиск, чипсы, табы внутри страниц) */
.srch {
  display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; margin: 0 24px 16px;
  border: 1px solid var(--surface-border); border-radius: 16px; background: rgba(255,255,255,0.03); color: var(--t3); transition: border-color .2s;
}
.srch:focus-within { border-color: rgba(255,255,255,0.2); } .srch svg { width: 20px; height: 20px; }
.srch input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--t1); } .srch input::placeholder { color: var(--t3); }

.seg { display: flex; gap: 4px; padding: 4px; margin: 0 24px 16px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--surface-border); }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: 12px; background: none; color: var(--t2); font-size: 14px; font-weight: 500; transition: .2s; }
.seg button.on { background: rgba(255,255,255,0.1); color: var(--t1); box-shadow: 0 2px 8px rgba(0,0,0,.2); }

.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 8px 8px; padding: 0 16px; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 0 16px; border: 1px solid var(--surface-border); border-radius: 20px; background: rgba(255,255,255,0.03); color: var(--t2); font-size: 14px; font-weight: 500; transition: .2s; }
.chip.on { background: var(--t1); border-color: var(--t1); color: var(--bg); font-weight: 600; }

.utabs { display: flex; gap: 24px; overflow-x: auto; margin: 0 8px 16px; padding: 0 16px; box-shadow: inset 0 -1px 0 var(--line); scrollbar-width: none; } .utabs::-webkit-scrollbar { display: none; }
.utab { position: relative; flex: none; min-height: 48px; padding: 0; border: 0; background: none; color: var(--t2); font-size: 15px; font-weight: 500; transition: color .2s; }
.utab.on { color: var(--t1); font-weight: 600; } .utab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--wood); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 0 24px;
  border: 0; border-radius: 16px; background: var(--t1); color: var(--bg); font-size: 16px; font-weight: 600; transition: .2s;
}
.btn:active { background: #d4d4d8; transform: scale(.98); } .btn:disabled { opacity: .5; pointer-events: none; }
.btn.ghost { background: rgba(255,255,255,0.05); color: var(--t1); box-shadow: inset 0 0 0 1px var(--surface-border); backdrop-filter: blur(10px); }
.btn.ghost:active { background: rgba(255,255,255,0.1); }
.btn svg { width: 20px; height: 20px; }
.btn.busy::before { content: ""; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.two { display: flex; gap: 8px; margin-top: 24px; } .two .btn { flex: 1; } .stackb { display: grid; gap: 8px; margin-top: 24px; }

/* Формы */
.fgrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; padding: 0 24px; }
.fs { grid-column: span 2; margin: 32px 0 16px; font-size: 17px; font-weight: 600; } .fgrid>.fs:first-child { margin-top: 0; }
.fld { grid-column: span 2; margin-bottom: 16px; min-width: 0; } .fld.half { grid-column: span 1; }
.fld>label { display: block; margin-bottom: 8px; color: var(--t2); font-size: 14px; font-weight: 500; }
.fld input, .fld select { width: 100%; height: 52px; padding: 0 16px; border: 1px solid var(--surface-border); border-radius: 16px; outline: 0; background: rgba(255,255,255,0.03); appearance: none; -webkit-appearance: none; transition: .2s; }
.fld input::placeholder { color: var(--t3); }
.fld input:focus, .fld select:focus, .num:focus-within { border-color: rgba(255,255,255,0.3); box-shadow: 0 0 0 4px rgba(255,255,255,0.05); }
.fld select option { background: var(--s2); }
.sel { position: relative; } .sel::after { content: ""; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; border: solid var(--t2); border-width: 0 2px 2px 0; transform: translateY(-75%) rotate(45deg); pointer-events: none; } .sel select { padding-right: 48px; text-overflow: ellipsis; }
.num { display: flex; overflow: hidden; border: 1px solid var(--surface-border); border-radius: 16px; background: rgba(255,255,255,0.03); transition: .2s; }
.num input { flex: 1; min-width: 0; height: 50px; padding: 0 8px; border: 0; border-radius: 0; background: none; text-align: center; font-size: 18px; font-weight: 500; box-shadow: none!important; }
.num button { width: 48px; border: 0; background: none; color: var(--t1); font-size: 20px; transition: .2s; } .num button:active { background: rgba(255,255,255,0.1); }
@media(max-width:359px) { .fld.half { grid-column: span 2; } }
.fld .chips { flex-wrap: wrap; margin: 12px 0 0; padding: 0; overflow: visible; }
.pv { display: grid; gap: 16px; margin-top: 32px; padding: 24px; border-top: 1px solid var(--line); }
.pvr { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; } .pvr b { font-size: 20px; font-weight: 600; }

/* Шторка, уведомления */
.sheet { position: fixed; inset: 0; z-index: 60; visibility: hidden; transition: visibility 0s .4s; } .sheet.on { visibility: visible; transition-delay: 0s; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.7); opacity: 0; transition: opacity .3s; } .sheet.on .scrim { opacity: 1; }
.panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow: auto; padding: 8px 24px calc(var(--bot) + 32px); border-radius: 32px 32px 0 0; background: var(--bg); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 -16px 48px rgba(0,0,0,.6); transform: translateY(105%); transition: transform .4s var(--ease); }
.sheet.on .panel { transform: none; } .grab { width: 48px; height: 4px; margin: 12px auto 24px; border-radius: 2px; background: rgba(255,255,255,0.2); }
.panel h3 { margin-bottom: 8px; font-size: 22px; line-height: 30px; font-weight: 600; }
.dl { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); } .dl:last-of-type { border-bottom: 0; } .dl b { font-weight: 500; }
.srow { display: flex; align-items: center; gap: 16px; width: 100%; margin-bottom: 8px; padding: 16px; border: 1px solid var(--surface-border); border-radius: 20px; background: rgba(255,255,255,0.03); text-align: left; transition: .2s; }
.srow:active { background: rgba(255,255,255,0.08); } .srow .e { display: grid; place-items: center; color: var(--wood); } .srow span:nth-child(2) { flex: 1; } .srow b { display: block; font-weight: 500; } .srow small { color: var(--t2); font-size: 14px; } .srow>svg { color: var(--t3); } .srow.off, .srow:disabled { opacity: .5; pointer-events: none; }
#toast { position: fixed; top: calc(var(--top) + 8px); left: 50%; z-index: 99; display: flex; gap: 12px; width: max-content; max-width: min(92vw,360px); padding: 12px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; background: rgba(30,30,30,0.9); backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,.5); font-size: 14px; font-weight: 500; transform: translate(-50%,-160%); transition: transform .4s var(--ease); }
#toast.on { transform: translate(-50%,0); } #toast::before { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; font-weight: 700; color: var(--bg); }
#toast.ok::before { content: "✓"; background: #86d4ae; } #toast.err::before { content: "!"; background: var(--err); }

/* Отчёты, профиль */
.dates { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; padding: 0 24px; } .dates .fld { grid-column: auto; margin: 0; }
.rev { margin-top: 32px; padding: 0 24px; } .rev .big { margin-bottom: 0; font-size: 48px; font-weight: 400; }
.vb { margin-top: 24px; padding: 0 24px; } .vb-h { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--t2); } .vb-h b { color: var(--t1); font-weight: 500; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.05); overflow: hidden; } .bar i { display: block; width: var(--w); height: 100%; background: var(--wood); transform-origin: 0 50%; animation: grow .8s var(--ease); }
.who { text-align: center; padding: 8px 24px 24px; } .who .avatar { width: 88px; height: 88px; margin: 0 auto 24px; font-size: 32px; } .who h2 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }

.sw { flex: none; position: relative; width: 52px; height: 32px; border: 1px solid var(--surface-border); border-radius: 16px; background: rgba(255,255,255,0.05); transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--t2); transition: transform .2s var(--ease), background .2s; }
.sw[aria-checked=true] { background: var(--wood); } .sw[aria-checked=true]::after { transform: translateX(20px); background: var(--bg); }

/* Вход */
body.noauth { overflow: hidden; } body.noauth #view { padding: 0; min-height: 100dvh; display: grid; place-items: center; }
.login { width: 100%; max-width: 320px; margin: auto; padding: 24px 0; text-align: center; }
.login .logo { display: grid; place-items: center; margin-bottom: 32px; color: var(--wood); } .login .logo svg { width: 64px; height: 64px; stroke-width: 1.2; }
.login h1 { font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.02em; } .login .sub { margin: 8px 0 40px; color: var(--t2); font-size: 15px; }
.login .fld { text-align: left; } .login .btn { margin-top: 16px; }

html.lite *, html.lite *::before, html.lite *::after { animation: none!important; transition: none!important; }
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="noauth">
<header class="top">
  <button id="hb" data-a="back" aria-label="Назад"></button>
  <h1 id="title">Лесопилка</h1>
  <div id="hact"></div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Разделы"></nav>
<div class="act"><button class="btn" id="ok" data-a="ok"></button></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="scrim" data-a="no"></div><div class="panel"><div class="grab"></div><div id="sb"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const tg = window.Telegram.WebApp, inTg = !!tg.initData;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF = {};
/* Длина в метрах: 6000 -> «6 м», 4500 -> «4,5 м» */
const lenM = mm => fmt(mm / 1000, 2) + ' м';
/* Доска по-человечески: «Доска 50×150 · 6 м · Сосна, сорт 1» (без технических номеров) */
const boardTitle = b => `Доска ${b.height_mm}×${b.width_mm}`;
const boardLabel = b => `${boardTitle(b)} · ${lenM(b.length_mm)} · ${b.species || 'порода не указана'}${b.grade ? ', сорт ' + b.grade : ''}`;
const fmt = (n, d = 1) => (NF[d] || (NF[d] = new Intl.NumberFormat('ru-RU', {maximumFractionDigits: d}))).format(+n || 0);
const sum = (a, k) => a.reduce((s, x) => s + (+x[k] || 0), 0);
const pad = n => String(n).padStart(2, '0'), ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const ST = {new: 'Новый', in_progress: 'В работе', completed: 'Завершён', canceled: 'Отменён'};
const ROLE = {manager: 'Руководитель', master: 'Мастер', worker: 'Сотрудник'};
/* палитра графиков */
const PAL = ['#b6d9fc', '#8a63f5', '#98c0ef', '#269684', '#027dea', '#e46d4c'];
const ICP = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>', check: '<path d="M5 12l5 5L20 7"/>',
  file: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
  back: '<path d="M15 5l-7 7 7 7"/>', chev: '<path d="M9 5l7 7-7 7"/>',
  arrival: '<path d="M1 6h13v10H1z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  sawing: '<path d="M12 2l10 5-10 5L2 7z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/>',
  order: '<path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h6"/>',
  send: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  download: '<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  ok: '<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>',
  warn: '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/>',
  trend: '<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',
  journal: '<path d="M4 4h12a2 2 0 012 2v14H6a2 2 0 01-2-2z"/><path d="M8 9h6M8 13h6"/>',
  mark: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="3"/>',
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICP[n] || ''}</svg>`;

tg.ready(); tg.expand();
function theme() {
  document.documentElement.dataset.t = 'dark';
  try { tg.setHeaderColor('#121413'); tg.setBackgroundColor('#0f1110'); } catch (e) {}
}
theme(); tg.onEvent('themeChanged', theme);
try { tg.MainButton.hide(); } catch (e) {}

/* ---------- экономный режим ---------- */
let LITE = null; try { LITE = localStorage.getItem('lite'); } catch (e) {}
document.documentElement.classList.toggle('lite', LITE === 'on');
const isLite = () => document.documentElement.classList.contains('lite');
function setLite(on, auto) {
  document.documentElement.classList.toggle('lite', on);
  if (!auto) { LITE = on ? 'on' : 'off'; try { localStorage.setItem('lite', LITE); } catch (e) {} }
}
function perfProbe() {
  if (LITE !== null || isLite()) return;
  let n = 0, last = 0, slow = 0;
  const step = t => {
    if (last) { n++; if (t - last > 36) slow++; }
    last = t;
    if (n < 45) requestAnimationFrame(step);
    else if (slow > 20) { setLite(true, true); toast('Включён экономный режим для плавной работы'); }
  };
  setTimeout(() => requestAnimationFrame(step), 1500);
}

/* ---------- состояние и утилиты ---------- */
const S = {role: 'worker', name: '', tab: 'home', cur: 'login', stack: [], wt: 'boards', wq: '', wsp: '', of: 'all', oq: '', range: 'month'};
let CFG = {pdf_send: true};
const D = {boards: [], logs: [], orders: [], con: {}};
let MEM = {}; try { MEM = JSON.parse(localStorage.getItem('mem') || '{}'); } catch (e) {}
const mem = (k, v) => { MEM[k] = v; try { localStorage.setItem('mem', JSON.stringify(MEM)); } catch (e) {} };
const hap = t => { try { tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };
const notify = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const token = () => localStorage.getItem('jwt_token');
const jwt = () => { try { return JSON.parse(decodeURIComponent(atob(token().split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''))); } catch (e) { return null; } };
const uid = () => jwt()?.user_id || 1;
const sk = n => '<div class="sk"></div>'.repeat(n);
const hello = () => { const h = new Date().getHours(); return h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер'; };

let tt;
function toast(m, k = 'ok') { const t = $('#toast'); t.className = k + ' on'; t.textContent = m; clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2900); }

async function api(path, opts = {}) {
  const headers = {'Content-Type': 'application/json', ...(opts.headers || {})};
  if (token()) headers.Authorization = 'Bearer ' + token();
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 15000);
  let r, text;
  try {
    r = await fetch('/api/v1' + path, {...opts, headers, signal: controller.signal});
    text = await r.text();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Сервер долго не отвечает. Проверьте соединение и повторите попытку.');
    throw new Error('Не удалось связаться с сервером. Проверьте подключение и повторите попытку.');
  } finally { clearTimeout(timer); }
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
  if (!r.ok) {
    const supplied = data && (data.message || data.error || data.detail);
    const plainMessage = !data && text.trim() ? text.trim() : null;
    if (r.status === 401 || r.status === 403) throw new Error(supplied || plainMessage || 'Нет доступа. Возможно, нужно войти снова.');
    if (r.status >= 500) throw new Error(supplied || plainMessage || 'На сервере произошла ошибка. Попробуйте позже.');
    throw new Error(supplied || plainMessage || (r.status === 400 ? 'Проверьте введённые данные.' : `Не удалось выполнить запрос (${r.status}).`));
  }
  if (text && data === null) throw new Error('Сервер вернул некорректный ответ. Попробуйте позже.');
  return data;
}
const safe = async u => { try { return (await api(u)) || []; } catch (e) { toast(e.message, 'err'); return null; } };
async function loadConfig() { try { const c = await api('/config'); if (c) CFG = {...CFG, ...c}; } catch (e) {} }
async function loadStock() { const [b, l] = await Promise.all([safe('/boards'), safe('/logs')]); if (b) D.boards = b; if (l) D.logs = l; return !!b && !!l; }
async function ensureCon() { if (Object.keys(D.con).length) return true; const list = await safe('/contractors'); if (!list) return false; list.forEach(c => D.con[c.id] = c.name); return true; }

function countUp(root = $('#view')) {
  const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
  $$('[data-n]', root).forEach(el => {
    const n = +el.dataset.n, d = +el.dataset.d || 0, u = el.dataset.u || '', t0 = performance.now();
    const f = t => { const k = still ? 1 : Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(n * e, d) + u; if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}

/* ---------- шторка и подтверждение ---------- */
let ASK = null;
const sheet = html => { $('#sb').innerHTML = html; $('#sheet').classList.add('on'); };
const closeSheet = () => $('#sheet').classList.remove('on');
function ask(e, title, text, ok) {
  return new Promise(res => {
    ASK = res;
    sheet(`<h3>${esc(title)}</h3><p class="mut">${esc(text)}</p>
      <div class="two"><button class="btn ghost" data-a="no">Отмена</button><button class="btn" data-a="yes">${esc(ok)}</button></div>`);
  });
}
const settle = v => { closeSheet(); if (ASK) { const r = ASK; ASK = null; r(v); } };

/* ---------- навигация ---------- */
const TABS = ['home', 'stock', 'orders', 'journal', 'stats'];
const TT = {stock: 'Склад', orders: 'Заказы', journal: 'Журнал', stats: 'Отчёты', profile: 'Профиль'};
const canOrd = () => S.role === 'manager' || S.role === 'master';
const jSegs = () => [canOrd() && ['arrivals', 'Приходы'], S.role !== 'master' && ['production', 'Распилы'], canOrd() && ['sales', 'Продажи']].filter(Boolean);

function buildTabs() {
  const t = [['home', 'home', 'Главная'], ['stock', 'box', 'Склад']];
  if (canOrd()) t.push(['orders', 'order', 'Заказы']);
  t.push(['journal', 'journal', 'Журнал']);
  if (S.role === 'manager') t.push(['stats', 'chart', 'Отчёты']);
  $('#tabs').innerHTML = t.map(x => `<button class="tab" data-a="go" data-v="${x[0]}">${ic(x[1])}<span>${x[2]}</span></button>`).join('');
}
const hbtn = (k, l) => `<button class="hbtn" data-a="new" data-v="${k}">${ic('plus')}<span>${l}</span></button>`;
function setAct(v) {
  $('#hact').innerHTML = v === 'home' ? `
      ${S.role === 'manager' ? `<button class="hbtn" data-a="go" data-v="stats">${ic('chart')}<span>Отчёты</span></button>` : ''}
      <button class="avatar" data-a="go" data-v="profile" aria-label="Профиль">${esc((S.name || '?')[0].toUpperCase())}</button>
    `
    : v === 'orders' ? hbtn('order', 'Заказ')
    : v === 'journal' ? (S.jt === 'arrivals' ? hbtn('arrival', 'Приход') : S.jt === 'production' ? hbtn('sawing', 'Распил') : '') : '';
}
function go(v, p) {
  if (TABS.includes(v)) { S.tab = v; S.stack = []; } else S.stack.push(S.cur);
  show(v, p);
}
function back() { show(S.stack.pop() || S.tab); }
function show(v, p) {
  S.cur = v;
  const f = FORMS[v], sub = !!f || v === 'profile';
  document.body.classList.toggle('form', !!f);
  document.body.classList.toggle('sub', sub);
  $('#title').textContent = f ? f.t : v === 'home' ? 'Лесопилка' : TT[v] || 'Лесопилка';
  setAct(v);
  $$('.tab').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); });
  try { sub ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
  scrollTo(0, 0);
  if (f) vForm(v, p); else ({home: vHome, stock: vStock, orders: vOrders, journal: vJournal, stats: vStats, profile: vProfile}[v] || (() => {}))();
}
tg.BackButton.onClick(back);
$('#hb').innerHTML = ic('back');

/* ---------- помощники отображения ---------- */
const SPX = ['#d8c7a1', '#9fb3a0', '#c49a76', '#cfd3d8', '#8a7a5e', '#7c8799'], SPN = {'сосна': 0, 'ель': 1, 'лиственница': 2, 'берёза': 3, 'дуб': 4};
const spc = (n, i) => SPX[SPN[String(n).toLowerCase()] ?? i % SPX.length];
const li = (t, s, v, s2, o = {}) => { const tag = o.a ? 'button' : 'div'; return `<${tag} class="li"${o.a ? ` data-a="${o.a}" data-v="${esc(o.d)}"` : ''}><span class="li-m"><span class="li-t">${t}</span><span class="li-s">${s}</span></span><span class="li-e"><span class="li-v">${v}</span><span class="li-s">${s2}</span></span>${o.lines ? `<span class="li-l">${o.lines}</span>` : ''}</${tag}>`; };
const grp = (h, b, rows) => `<section><h2 class="grp"><span>${h}</span>${b ? `<b>${b}</b>` : ''}</h2>${rows}</section>`;
const fail = (m, v) => `<div class="empty"><b>${m}</b><button class="btn ghost" data-a="go" data-v="${v}">Повторить</button></div>`;
const none = (t, s) => `<div class="empty"><b>${t}</b>${s ? `<span>${s}</span>` : ''}</div>`;
const dayKey = s => { if (!s) return ''; const d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T00:00:00') : new Date(s); return isNaN(d) ? '' : ymd(d); };
const dayLabel = k => {
  if (!k) return 'Без даты';
  const n = new Date(), d = new Date(k + 'T00:00:00');
  if (k === ymd(n)) return 'Сегодня';
  if (k === ymd(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1))) return 'Вчера';
  return d.toLocaleDateString('ru-RU', d.getFullYear() === n.getFullYear() ? {day: 'numeric', month: 'long'} : {day: 'numeric', month: 'long', year: 'numeric'});
};
const byDay = (list, kf, rf) => { const g = new Map(); list.forEach(x => { const k = dayKey(kf(x)); if (!g.has(k)) g.set(k, []); g.get(k).push(x); }); return [...g].map(([k, a]) => grp(dayLabel(k), '', a.map(rf).join(''))).join(''); };
const lines = a => a.map(l => `<span>${esc(l)}</span>`).join('');
const isOpen = o => o.status !== 'completed' && o.status !== 'canceled';
const STC = {new: '#ebd2af', in_progress: '#9db8d8', completed: '#86d4ae', canceled: '#e8a29a'};
const stl = s => `<span class="st" style="--c:${STC[s] || '#a1a1aa'}"><i></i>${esc(ST[s] || s)}</span>`;
const odate = (o, f) => { const d = o.created_at ? new Date(o.created_at) : null; return d && !isNaN(d) ? d.toLocaleDateString('ru-RU', f) : ''; };
const oRow = o => li(`Заказ №${esc(o.id)}`, esc(D.con[o.contractor_id] || 'Клиент №' + o.contractor_id), stl(o.status), esc(odate(o, {day: 'numeric', month: 'short'})), {a: 'order', d: o.id});

/* ---------- главный экран ---------- */
function rng(r) {
  const e = new Date(), s = new Date();
  if (r === 'week') s.setDate(s.getDate() - 6); else if (r === 'month') s.setDate(1); else if (r === 'year') { s.setMonth(0); s.setDate(1); }
  return [ymd(s), ymd(e)];
}
const sQ = (a, b) => `/statistics?start_date=${encodeURIComponent(a)}&end_date=${encodeURIComponent(b)}`;

async function vHome() {
  const v = $('#view'), m = S.role === 'manager';
  const qa = [['arrival', 'Приход леса'], ['sawing', 'Распиловка'], canOrd() && ['order', 'Новый заказ']].filter(Boolean);
  
  // Кнопки действий адаптированы для встраивания в карточку матового стекла
  const qaHtml = `<div class="qa" style="--n:${qa.length}">${qa.map(([k, l]) => `<button class="qa-b" data-a="new" data-v="${k}"><i class="dot" data-id="${k}"></i>${ic(k)}<span>${l}</span></button>`).join('')}</div>`;

  v.innerHTML = `<div class="hello" style="display:none"><h2>${hello()}, ${esc(S.name)}</h2></div>
    <div id="hd" style="margin-top:0">${sk(3)}</div>`;
    
  const [, orders, st] = await Promise.all([loadStock(), canOrd() ? safe('/orders') : [], m ? api(sQ(...rng('month'))).catch(e => { toast(e.message, 'err'); return null; }) : null, ensureCon()]);
  if (S.cur !== 'home' || !$('#hd')) return;
  if (orders) D.orders = orders;
  const bv = sum(D.boards, 'volume_m3'), bc = sum(D.boards, 'count'), lv = sum(D.logs, 'volume_m3');
  const open = D.orders.filter(isOpen);
  const by = {}; D.boards.forEach(b => { const k = b.species || '—'; by[k] = (by[k] || 0) + (+b.volume_m3 || 0); });
  const sp = Object.entries(by).sort((a, b) => b[1] - a[1]), rest = sp.slice(5).reduce((n, x) => n + x[1], 0);
  const leg = [...sp.slice(0, 5).map(([n, x, c], i) => [n, x, spc(n, i)]), ...(rest > 0 ? [['Прочее', rest, '#52525b']] : [])];

  $('#hd').innerHTML = `<section class="stock">
      <div class="glass-card">
        <p class="lbl">Готовая продукция на складе</p>
        <div class="arc-container">
          <svg class="arc-svg" viewBox="0 0 100 50"><path d="M 5 45 A 40 40 0 0 1 95 45" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg>
          <div class="big"><span data-n="${bv}" data-d="2">0</span></div>
          <div class="sub-vol"><span data-n="${bv}" data-d="2">0</span> м кубических</div>
        </div>
        ${qaHtml}
      </div>
      ${leg.length && bv > 0 ? `
      <div class="list-wrap">
        ${leg.map(([n, x, c]) => `<div class="lg"><span>${esc(n)}</span><span class="mut">${fmt(x / bv * 100, 0)}%</span><b>${fmt(x, 2)} м³</b></div>`).join('')}
      </div>` : ''}
    </section>
    ${m && st ? `<div class="sh" style="padding:0 24px"><h2>За месяц</h2></div>
      <div class="ld" style="margin:0 24px"><span>Выручка</span><b data-n="${st.total_sales_amount || 0}" data-u=" ₽">0</b></div>
      <div class="ld" style="margin:0 24px"><span>Продано</span><b data-n="${st.total_sales_volume || 0}" data-d="1" data-u=" м³">0</b></div>
      <div class="ld" style="margin:0 24px"><span>Распилено</span><b data-n="${st.total_logs_sawed_volume || 0}" data-d="1" data-u=" м³">0</b></div>` : ''}
    ${canOrd() ? `<div class="sh" style="padding:0 24px"><h2>Активные заказы${open.length ? ' (' + open.length + ')' : ''}</h2><button class="lnk" data-a="go" data-v="orders">Все заказы</button></div>
      <div style="padding:0 24px">${open.length ? open.slice(0, 3).map(oRow).join('') : '<p class="mut">Активных заказов нет</p>'}</div>` : ''}`;
  countUp(v);
}

/* ---------- журнал: приходы, распилы, продажи ---------- */
async function jArrivals(box) {
  const [a, c] = await Promise.all([safe('/arrivals?limit=100'), ensureCon()]);
  if (!box.isConnected) return;
  if (!a || !c) { box.innerHTML = fail('Не удалось загрузить поступления', 'journal'); return; }
  box.innerHTML = a.length ? byDay(a, x => x.arrival_date, x => {
    const it = x.items || [], sup = D.con[x.supplier_id] || 'Поставщик №' + x.supplier_id, car = D.con[x.carrier_id] || '№' + x.carrier_id;
    return li(`Поступление №${esc(x.id)}`, esc(`${sup}, машина ${x.truck_number}`), `${fmt(sum(it, 'volume_m3'), 3)} м³`, `${fmt(sum(it, 'count'), 0)} шт`,
      {lines: lines([...(car !== sup ? ['Перевозчик: ' + car] : []), ...it.map(i => `${i.species} Ø${i.diameter_mm} × ${lenM(i.length_mm)}, ${fmt(i.count, 0)} шт`)])});
  }) : none('Поступлений пока нет');
}
async function jProduction(box) {
  const ops = await safe('/sawing?limit=100');
  if (!box.isConnected) return;
  if (!ops) { box.innerHTML = fail('Не удалось загрузить распилы', 'journal'); return; }
  box.innerHTML = ops.length ? byDay(ops, x => x.date, x => {

  if (f.t === 'sel') c = `<div class="sel"><select data-k="${f.k}">${(f.o || []).map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select></div>`;
  else if (f.t === 'num') c = `<div class="num"><button type="button" class="rip" data-a="st" data-k="${f.k}" data-v="-1">−</button><input data-k="${f.k}" inputmode="decimal" value="${esc(fval(f))}"><button type="button" class="rip" data-a="st" data-k="${f.k}" data-v="1">+</button></div>`;
  else if (f.t === 'txt') c = `<input data-k="${f.k}" value="${esc(fval(f))}" placeholder="${esc(f.ph || '')}" autocomplete="off">`;
  else c = '';
  const ch = f.c ? `<div class="chips">${f.c.map(x => `<button type="button" class="chip rip" data-a="${f.t === 'pre' ? 'size' : 'chip'}" data-k="${f.k}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : '';
  return `${f.h ? `<h3 class="fs">${f.h}</h3>` : ''}<div class="fld${f.half ? ' half' : ''}"><label>${f.l}</label>${c}${ch}</div>`;
}
function vals() {
  const v = {};
  FORMS[FK].f.forEach(f => { const el = fe(f.k); if (el) v[f.k] = f.t === 'num' ? num(el.value) : el.value.trim(); });
  return v;
}
function calcForm(fromAuto) {
  const F = FORMS[FK]; if (!F) return;
  let v = vals();
  if (F.calc && !fromAuto) { const r = F.calc(v); for (const k in r) fe(k).value = (+r[k] || 0).toFixed(3); v = vals(); }
  const pv = $('#pv'); if (pv && F.pv) pv.innerHTML = F.pv(v);
}
async function vForm(kind, p = {}) {
  const F = FORMS[kind]; FK = kind;
  $('#view').innerHTML = `<div class="fgrid">${F.f.map(fld).join('')}</div>${F.pv ? '<section class="pv" id="pv"></section>' : ''}`;
  $('#ok').textContent = F.ok;
  const needs = await Promise.all([F.need.includes('con') ? ensureCon() : true, F.need.some(n => n !== 'con') ? loadStock() : true]);
  if (S.cur !== kind) return;
  if (needs.some(ok => !ok)) { $('#view').innerHTML = `<div class="empty"><b>Не удалось загрузить данные для формы</b><button class="btn ghost" data-a="retryform">Повторить</button></div>`; $('#ok').disabled = true; return; }
  $('#ok').disabled = false;
  F.f.forEach(f => {
    if (f.t !== 'sel' || !f.src) return;
    const el = fe(f.k), o = SRC[f.src]();
    el.innerHTML = o.length ? o.map(x => `<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('') : '<option value="">Нет данных</option>';
    const want = p[f.k] ?? (f.m ? MEM[f.k] : null);
    if (want != null && o.some(x => String(x[0]) === String(want))) el.value = want;
  });
  if (kind === 'sawing') syncLog();
  calcForm();
}
function syncLog() { const l = D.logs.find(x => x.id == fe('log').value); if (l) fe('lvol').value = (+l.volume_m3).toFixed(3); }
async function submitForm() {
  const F = FORMS[FK], v = vals(), e = F.req(v);
  if (e) { notify('error'); toast(e, 'err'); return; }
  if (!await ask(F.e, F.t, F.sum(v), 'Сохранить')) return;
  const b = $('#ok'); b.disabled = true; b.classList.add('busy');
  try {
    await api(F.path, {method: 'POST', body: JSON.stringify(F.body(v))});
    F.mem.forEach(k => mem(k, v[k]));
    notify('success'); toast(F.done); go(F.after);
  } catch (er) { notify('error'); toast(er.message, 'err'); }
  b.disabled = false; b.classList.remove('busy');
}

/* ---------- события ---------- */
const find = (t, id) => (t === 'boards' ? D.boards : D.logs).find(x => x.id == id);
const ACT = {
  go: v => go(v), lite: () => { setLite(!isLite()); vProfile(); }, back, yes: () => settle(true), no: () => settle(false), ok: submitForm, login, retry: tgAuth, retryform: () => vForm(FK),
  logout: () => { localStorage.removeItem('jwt_token'); S.stack = []; buildTabs(); vLogin(); $('#tabs').innerHTML = ''; },
  new: v => { closeSheet(); go(v); },
  order: v => {
    const o = D.orders.find(x => x.id == v); if (!o) return;
    sheet(`<h3>Заказ №${esc(o.id)}</h3>
      <div class="dl"><span class="mut">Клиент</span><b>${esc(D.con[o.contractor_id] || 'Клиент №' + o.contractor_id)}</b></div>
      <div class="dl"><span class="mut">Статус</span>${stl(o.status)}</div>
      <div class="dl"><span class="mut">Создан</span><b>${esc(odate(o, {day: 'numeric', month: 'long', year: 'numeric'}) || '—')}</b></div>
      <div class="stackb">${isOpen(o) ? `<button class="btn" data-a="done" data-v="${esc(o.id)}">Завершить заказ</button>` : ''}<button class="btn ghost" data-a="pdf" data-v="${esc(o.id)}">Накладная PDF</button></div>`);
  },
  jt: v => { S.jt = v; vJournal(); },
  wt: v => { S.wt = v; S.wsp = ''; vStock(false); },
  sp: v => { S.wsp = v; vStock(false); },
  of: v => { S.of = v; vOrders(false); },
  range: v => { S.range = v; vStats(); },
  item: v => {
    const [t, id] = v.split(':'), x = find(t, id); if (!x) return;
    sheet(`<h3>${t === 'boards' ? esc(boardTitle(x)) : `Бревно Ø${esc(x.diameter_mm)}`}</h3>
      <div class="dl"><span class="hint">Порода</span><b>${esc(x.species || 'не указана')}</b></div>
      <div class="dl"><span class="hint">Длина</span><b>${lenM(x.length_mm)}</b></div>
      ${t === 'boards' ? `<div class="dl"><span class="hint">Сорт</span><b>${esc(x.grade || '1')}</b></div>` : `<div class="dl"><span class="hint">Партия прихода</span><b>№${esc(x.arrival_id)}</b></div>`}
      <div class="dl"><span class="hint">Остаток</span><b>${esc(x.count)} шт</b></div>
      <div class="dl"><span class="hint">Объём</span><b>${fmt(x.volume_m3, 3)} м³</b></div>
      ${t === 'boards' && canOrd() ? `<button class="btn rip" style="margin-top:14px" data-a="mk" data-v="order:board:${x.id}">Создать заказ на эту позицию</button>` : ''}
      ${t === 'logs' ? `<button class="btn rip" style="margin-top:14px" data-a="mk" data-v="sawing:log:${x.id}">Записать распиловку из этой партии</button>` : ''}`);
  },
  mk: v => { const [f, k, id] = v.split(':'); closeSheet(); go(f, {[k]: id}); },
  done: (v, el) => ask('ok', 'Завершить заказ №' + v, 'Товары будут списаны со склада и проведены как продажа.', 'Завершить').then(ok => ok && doComplete(v, el)),
  pdf: v => pdfSheet(v), pdfsend: (v, el) => pdfDo('send', v, el), pdfdl: (v, el) => pdfDo('dl', v, el), pdfview: (v, el) => pdfDo('view', v, el),
  chip: (v, el) => { fe(el.dataset.k).value = v; calcForm(); },
  size: v => { const [a, b] = v.split('×'); fe('th').value = a; fe('wd').value = b; calcForm(); },
  st: (v, el) => {
    const f = FORMS[FK].f.find(x => x.k === el.dataset.k), i = fe(f.k);
    i.value = Math.max(0, Math.round((num(i.value) + (+v) * (f.s || 1)) * 1000) / 1000); calcForm(f.k === FORMS[FK].auto);
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = ACT[el.dataset.a]; if (f) { hap(); f(el.dataset.v, el); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.wq = t.value; clearTimeout(DEB); DEB = setTimeout(() => stockList(false), 120); }
  else if (t.id === 'oq') { S.oq = t.value; clearTimeout(DEB); DEB = setTimeout(() => orderList(false), 120); }
  else if (t.id === 'd1' || t.id === 'd2') { S.range = 'custom'; $$('[data-a="range"]').forEach(b => b.classList.remove('on')); loadStats(); }
  else if (t.dataset.k && FK) calcForm(t.dataset.k === FORMS[FK].auto);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.k && FK) { if (FK === 'sawing' && t.dataset.k === 'log') syncLog(); calcForm(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lp') login(); });

/* ---------- старт ---------- */
if (inTg) tgAuth();
else { const j = jwt(); if (j && j.exp * 1000 > Date.now()) finish(token()); else vLogin(); }
</script>
</body>
