<script>

const fmt = (n, d = 1) => (NF[d] || (NF[d] = new Intl.NumberFormat('ru-RU', {maximumFractionDigits: d}))).format(+n || 0);

const pad = n => String(n).padStart(2, '0'), ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

let LITE = null; try { LITE = localStorage.getItem('lite'); } catch (e) {}
document.documentElement.classList.toggle('lite', LITE === 'on');
const isLite = () => document.documentElement.classList.contains('lite');
function setLite(on, auto) {
  document.documentElement.classList.toggle('lite', on);
  if (!auto) { LITE = on ? 'on' : 'off'; try { localStorage.setItem('lite', LITE); } catch (e) {} }
}
/* Автоопределение: если сразу после входа большинство кадров медленнее ~30 к/с, включаем экономный режим на этот сеанс. */
function perfProbe() {
  if (LITE !== null || isLite()) return;
  let n = 0, last = 0, slow = 0;
  const step = t => {
    if (last) { n++; if (t - last > 36) slow++; }
    last = t;
    if (n < 45) requestAnimationFrame(step);
    else if (slow > 20) { setLite(true, true); toast('Включён экономный режим для плавной работы'); }
  };
  setTimeout(() => requestAnimationFrame(step), 1500);
}

async function api(path, opts = {}) {
  const headers = {'Content-Type': 'application/json'};
  if (token()) headers.Authorization = 'Bearer ' + token();
  const r = await fetch('/api/v1' + path, {...opts, headers});
  if (!r.ok) throw new Error((await r.text()).trim() || 'Ошибка ' + r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

function countUp(root = $('#view')) {
  const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
  $$('[data-n]', root).forEach(el => {
    const n = +el.dataset.n, d = +el.dataset.d || 0, u = el.dataset.u || '', t0 = performance.now();
    const f = t => { const k = still ? 1 : Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(n * e, d) + u; if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}

async function pdfDo(kind, id, btn) {

    if (kind === 'send') {
      await api(`/orders/${id}/pdf/send`, {method: 'POST'});
      closeSheet(); notify('success'); toast('Накладная отправлена в чат с ботом');
      return;

    closeSheet();

      tg.downloadFile({url: l.download_url, file_name: l.file_name});

    <div class="dl"><span class="hint">Экономный режим<br><small>меньше эффектов, холоднее телефон</small></span><button class="chip rip ${isLite() ? 'on' : ''}" data-a="lite">${isLite() ? 'Вкл' : 'Выкл'}</button></div></div></div>
    ${inTg ? '' : '<button class="btn ghost rip" data-a="logout">Выйти</button>'}`;
}
function vLogin(msg) {
  document.body.classList.add('noauth'); S.cur = 'login';
  $('#view').innerHTML = `<div class="login"><div class="logo">🪵</div><div class="wordmark gt">Лесопилка</div>
    <div class="eyebrow">Учёт производства</div>
    <div class="card glass"><div class="fld"><label>Логин</label><input id="lu" autocomplete="username"></div>
    <div class="fld"><label>Пароль</label><input id="lp" type="password" autocomplete="current-password"></div>
    <button class="btn rip" id="lb" data-a="login">Войти</button></div></div>`;
  if (msg) toast(msg, 'err');
}
function vAuthErr(msg) {
  document.body.classList.add('noauth');
  $('#view').innerHTML = `<div class="login"><div class="logo">🔒</div><div class="wordmark" style="font-size:24px;margin-bottom:8px">Не удалось войти</div>
    <p class="hint">${esc(msg)}</p><button class="btn rip" data-a="retry" style="margin-top:14px;max-width:420px;margin-left:auto;margin-right:auto">Повторить</button></div>`;
}
async function login() {
  const b = $('#lb'), u = $('#lu').value.trim();
  b.disabled = true; b.classList.add('busy');
  try {
    const d = await api('/auth/login', {method: 'POST', body: JSON.stringify({username: u, password: $('#lp').value})});
    if (d?.token) { localStorage.setItem('uname', u); finish(d.token, u); }
  } catch (e) { notify('error'); toast(e.message, 'err'); }
  b.disabled = false; b.classList.remove('busy');
}
function finish(tkn, name) {
  localStorage.setItem('jwt_token', tkn);
  S.role = jwt()?.role || 'worker'; S.name = name || localStorage.getItem('uname') || 'Сотрудник';
  $('#av').textContent = S.name[0].toUpperCase();
  document.body.classList.remove('noauth'); buildTabs(); go('home'); perfProbe();
}
async function tgAuth() {
  document.body.classList.add('noauth'); $('#view').innerHTML = sk(2);
  try {
    const d = await api('/auth/telegram', {method: 'POST', body: JSON.stringify({init_data: tg.initData})});
    if (!d?.token) throw new Error('Токен не получен');
    finish(d.token, tg.initDataUnsafe?.user?.first_name || 'User');
  } catch (e) { vAuthErr(e.message); }
}

/* ---------- формы ---------- */
const SP = ['Сосна', 'Ель', 'Лиственница', 'Берёза', 'Дуб'];
const SIZES = ['25×100', '40×100', '50×100', '50×150', '50×200', '100×100', '150×150'];
const SRC = {
  con: () => Object.entries(D.con),
  boards: () => D.boards.map(b => [b.id, `${b.species || 'Доска'} ${b.height_mm}×${b.width_mm}×${b.length_mm} · ${b.count} шт (№${b.id})`]),
  logs: () => D.logs.map(l => [l.id, `${l.species || 'Бревно'} Ø${l.diameter_mm} · ${l.count} шт · ${fmt(l.volume_m3, 2)} м³ (№${l.id})`])
};
const FORMS = {
  arrival: {
    t: 'Приход леса', e: '📥', ok: 'Сохранить приход', path: '/arrivals', done: 'Приход зарегистрирован', after: 'home', auto: 'vol', need: ['con'],
    f: [{k: 'supplier', l: 'Поставщик', t: 'sel', src: 'con', half: 1, m: 1}, {k: 'carrier', l: 'Перевозчик', t: 'sel', src: 'con', half: 1, m: 1},
      {k: 'truck', l: 'Номер машины', t: 'txt', ph: 'А000АА000', m: 1},
      {k: 'species', l: 'Порода', t: 'txt', c: SP, v: 'Сосна', m: 1, h: 'Бревна в партии'},
      {k: 'len', l: 'Длина, мм', t: 'num', v: 6000, s: 100, half: 1}, {k: 'dia', l: 'Диаметр, мм', t: 'num', v: 220, s: 10, half: 1},
      {k: 'cnt', l: 'Количество, шт', t: 'num', v: 10, s: 1, half: 1}, {k: 'vol', l: 'Объём, м³', t: 'num', v: 0, s: .1, half: 1}],
    calc: v => ({vol: Math.PI * (v.dia / 2000) ** 2 * (v.len / 1000) * v.cnt}),
    req: v => !v.truck ? 'Укажите номер машины' : v.cnt <= 0 ? 'Укажите количество бревен' : v.vol <= 0 ? 'Объём должен быть больше нуля' : null,
    sum: v => `${v.species}: ${fmt(v.cnt, 0)} шт, ${fmt(v.vol, 3)} м³, машина ${v.truck}`,
    mem: ['supplier', 'carrier', 'truck', 'species'],
    body: v => ({supplier_id: +v.supplier || 1, carrier_id: +v.carrier || 1, truck_number: v.truck, arrival_date: ymd(new Date()),
      items: [{species: v.species, length_mm: Math.round(v.len), diameter_mm: Math.round(v.dia), count: Math.round(v.cnt), volume_m3: v.vol}]})
  },
  sawing: {
    t: 'Распиловка', e: '🪚', ok: 'Сохранить распиловку', path: '/sawing', done: 'Распиловка сохранена', after: 'home', auto: 'vol', need: ['logs'],
    f: [{k: 'log', l: 'Сырьё (позиция прихода)', t: 'sel', src: 'logs'}, {k: 'lvol', l: 'Объём сырья, м³', t: 'num', v: 0, s: .1},
      {k: 'species', l: 'Порода', t: 'txt', c: SP, v: 'Сосна', m: 1, h: 'Полученная продукция'},
      {k: 'size', l: 'Типовой размер', t: 'pre', c: SIZES},
      {k: 'th', l: 'Толщина, мм', t: 'num', v: 50, s: 5, half: 1}, {k: 'wd', l: 'Ширина, мм', t: 'num', v: 150, s: 10, half: 1},
      {k: 'len', l: 'Длина, мм', t: 'num', v: 6000, s: 100, half: 1}, {k: 'cnt', l: 'Количество, шт', t: 'num', v: 10, s: 1, half: 1},
      {k: 'grade', l: 'Сорт', t: 'sel', o: [['1', '1 сорт'], ['2', '2 сорт'], ['3', '3 сорт']], half: 1}, {k: 'vol', l: 'Объём, м³', t: 'num', v: 0, s: .1, half: 1}],
    calc: v => ({vol: v.th * v.wd * v.len * v.cnt / 1e9}),
    pv: v => `<div class="pvr"><span class="hint">Получено досок</span><b>${fmt(v.vol, 3)} м³</b></div><div class="pvr"><span class="hint">Выход из сырья</span><b class="gt">${v.lvol > 0 ? fmt(v.vol / v.lvol * 100, 0) : 0}%</b></div>`,
    req: v => !v.log ? 'Выберите сырьё' : v.lvol <= 0 ? 'Укажите объём сырья' : v.cnt <= 0 ? 'Укажите количество досок' : v.vol <= 0 ? 'Объём досок должен быть больше нуля' : null,
    sum: v => `${v.species} ${v.th}×${v.wd}×${v.len}: ${fmt(v.cnt, 0)} шт, ${fmt(v.vol, 3)} м³ из ${fmt(v.lvol, 2)} м³ сырья`,
    mem: ['species'],
    body: v => ({date: ymd(new Date()), logs: [{log_id: +v.log, volume_m3: v.lvol}],
      boards: [{species: v.species, grade: v.grade, height_mm: Math.round(v.th), width_mm: Math.round(v.wd), length_mm: Math.round(v.len), count: Math.round(v.cnt), volume_m3: v.vol}]})
  },
  order: {
    t: 'Новый заказ', e: '🧾', ok: 'Создать заказ', path: '/orders', done: 'Заказ создан', after: 'orders', need: ['con', 'boards'],
    f: [{k: 'con', l: 'Клиент', t: 'sel', src: 'con', m: 1}, {k: 'board', l: 'Доска со склада', t: 'sel', src: 'boards'},
      {k: 'cnt', l: 'Количество, шт', t: 'num', v: 10, s: 1, half: 1}, {k: 'price', l: 'Цена за 1 м³, ₽', t: 'num', v: 9000, s: 500, half: 1, m: 1}],
    pv: v => {
      const b = D.boards.find(x => x.id == v.board); if (!b || !(b.count > 0)) return '<span class="hint">Выберите доску со склада</span>';
      const vol = v.cnt === b.count ? b.volume_m3 : b.volume_m3 / b.count * v.cnt;
      return `<div class="pvr"><span class="hint">Объём заказа</span><b>${fmt(vol, 3)} м³</b></div><div class="pvr"><span class="hint">Сумма</span><b class="gt">${fmt(vol * v.price, 0)} ₽</b></div>
        <div class="pvr"><span class="hint">На складе</span><b style="font-size:16px;color:${v.cnt > b.count ? 'var(--err)' : 'inherit'}">${b.count} шт${v.cnt > b.count ? ' · не хватает' : ''}</b></div>`;
    },
    req: v => !v.board ? 'Выберите доску' : v.cnt <= 0 ? 'Укажите количество' : null,
    sum: v => `${fmt(v.cnt, 0)} шт по ${fmt(v.price, 0)} ₽ за м³, клиент: ${D.con[v.con] || '№' + v.con}`,
    mem: ['con', 'price'],
    body: v => ({contractor_id: +v.con || 1, status: 'new', delivery_price: 0, extra_price: 0, items: [{board_id: +v.board, count: Math.round(v.cnt), price: v.price}]})
  }
};
let FK = null;
const fe = k => $(`input[data-k="${k}"],select[data-k="${k}"]`);
const fval = (f, x) => (f.m && MEM[f.k] != null) ? MEM[f.k] : (x ?? f.v ?? '');
function fld(f) {
  let c;
  if (f.t === 'sel') c = `<div class="sel"><select data-k="${f.k}">${(f.o || []).map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select></div>`;
  else if (f.t === 'num') c = `<div class="num"><button type="button" class="rip" data-a="st" data-k="${f.k}" data-v="-1">−</button><input data-k="${f.k}" inputmode="decimal" value="${esc(fval(f))}"><button type="button" class="rip" data-a="st" data-k="${f.k}" data-v="1">+</button></div>`;
  else if (f.t === 'txt') c = `<input data-k="${f.k}" value="${esc(fval(f))}" placeholder="${esc(f.ph || '')}" autocomplete="off">`;
  else c = '';
  const ch = f.c ? `<div class="chips">${f.c.map(x => `<button type="button" class="chip rip" data-a="${f.t === 'pre' ? 'size' : 'chip'}" data-k="${f.k}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : '';
  return `${f.h ? `<h4>${f.h}</h4>` : ''}<div class="fld${f.half ? ' half' : ''}"><label>${f.l}</label>${c}${ch}</div>`;
}
function vals() {
  const v = {};
  FORMS[FK].f.forEach(f => { const el = fe(f.k); if (el) v[f.k] = f.t === 'num' ? num(el.value) : el.value.trim(); });
  return v;
}
function calcForm(fromAuto) {
  const F = FORMS[FK]; if (!F) return;
  let v = vals();
  if (F.calc && !fromAuto) { const r = F.calc(v); for (const k in r) fe(k).value = (+r[k] || 0).toFixed(3); v = vals(); }
  const pv = $('#pv'); if (pv && F.pv) pv.innerHTML = F.pv(v);
}
async function vForm(kind, p = {}) {
  const F = FORMS[kind]; FK = kind;
  $('#view').innerHTML = `<div class="card glass"><div class="fgrid">${F.f.map(fld).join('')}</div></div>${F.pv ? '<div class="card glass pv" id="pv"></div>' : ''}`;
  $('#ok').textContent = F.ok;
  await Promise.all([F.need.includes('con') ? ensureCon() : 0, F.need.some(n => n !== 'con') ? loadStock() : 0]);
  if (S.cur !== kind) return;
  F.f.forEach(f => {
    if (f.t !== 'sel' || !f.src) return;
    const el = fe(f.k), o = SRC[f.src]();
    el.innerHTML = o.length ? o.map(x => `<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('') : '<option value="">Нет данных</option>';
    const want = p[f.k] ?? (f.m ? MEM[f.k] : null);
    if (want != null && o.some(x => String(x[0]) === String(want))) el.value = want;
  });
  if (kind === 'sawing') syncLog();
  calcForm();
}
function syncLog() { const l = D.logs.find(x => x.id == fe('log').value); if (l) fe('lvol').value = (+l.volume_m3).toFixed(3); }
async function submitForm() {
  const F = FORMS[FK], v = vals(), e = F.req(v);
  if (e) { notify('error'); toast(e, 'err'); return; }
  if (!await ask(F.e, F.t, F.sum(v), 'Сохранить')) return;
  const b = $('#ok'); b.disabled = true; b.classList.add('busy');
  try {
    await api(F.path, {method: 'POST', body: JSON.stringify(F.body(v))});
    F.mem.forEach(k => mem(k, v[k]));
    notify('success'); toast(F.done); go(F.after);
  } catch (er) { notify('error'); toast(er.message, 'err'); }
  b.disabled = false; b.classList.remove('busy');
}

/* ---------- события ---------- */
const find = (t, id) => (t === 'boards' ? D.boards : D.logs).find(x => x.id == id);
const ACT = {
  go: v => go(v), lite: () => { setLite(!isLite()); vProfile(); }, back, yes: () => settle(true), no: () => settle(false), ok: submitForm, login, retry: tgAuth,
  logout: () => { localStorage.removeItem('jwt_token'); S.stack = []; buildTabs(); vLogin(); $('#tabs').innerHTML = ''; },
  new: v => { closeSheet(); go(v); },
  fab: () => sheet(`<div class="ctr" style="margin-bottom:14px"><h3>Что оформить?</h3></div>
    ${[['arrival', '📥', 'Приход леса', 'Принять партию бревен'], ['sawing', '🪚', 'Распиловка', 'Записать результат распила'], canOrd() && ['order', '🧾', 'Новый заказ', 'Заказ клиента на доски']].filter(Boolean)
      .map(([k, e, t, d]) => `<button class="srow glass rip" data-a="new" data-v="${k}"><span class="e">${e}</span><span><b>${t}</b><small>${d}</small></span>${ic('chev')}</button>`).join('')}`),
  wt: v => { S.wt = v; S.wsp = ''; vStock(false); },
  sp: v => { S.wsp = v; vStock(false); },
  of: v => { S.of = v; vOrders(false); },
  range: v => { S.range = v; vStats(); },
  item: v => {
    const [t, id] = v.split(':'), x = find(t, id); if (!x) return;
    sheet(`<h3>${t === 'boards' ? `${esc(x.species || 'Доска')} ${esc(x.height_mm)}×${esc(x.width_mm)}×${esc(x.length_mm)} мм` : `${esc(x.species || 'Бревно')} Ø${esc(x.diameter_mm)} · ${esc(x.length_mm)} мм`}</h3>
      <div class="dl"><span class="hint">Номер позиции</span><b>№${esc(x.id)}</b></div><div class="dl"><span class="hint">Остаток</span><b>${esc(x.count)} шт</b></div>
      <div class="dl"><span class="hint">Объём</span><b>${fmt(x.volume_m3, 3)} м³</b></div>
      ${t === 'boards' ? `<div class="dl"><span class="hint">Сорт</span><b>${esc(x.grade || '1')}</b></div>` : `<div class="dl"><span class="hint">Партия прихода</span><b>№${esc(x.arrival_id)}</b></div>`}
      ${t === 'boards' && canOrd() ? `<button class="btn rip" style="margin-top:14px" data-a="mk" data-v="order:board:${x.id}">Создать заказ на эту позицию</button>` : ''}
      ${t === 'logs' ? `<button class="btn rip" style="margin-top:14px" data-a="mk" data-v="sawing:log:${x.id}">Записать распиловку из этой партии</button>` : ''}`);
  },
  mk: v => { const [f, k, id] = v.split(':'); closeSheet(); go(f, {[k]: id}); },
  done: (v, el) => ask('✅', 'Завершить заказ №' + v, 'Товары будут списаны со склада и проведены как продажа.', 'Завершить').then(ok => ok && doComplete(v, el)),
  pdf: v => pdfSheet(v), pdfsend: (v, el) => pdfDo('send', v, el), pdfdl: (v, el) => pdfDo('dl', v, el), pdfview: (v, el) => pdfDo('view', v, el),
  chip: (v, el) => { fe(el.dataset.k).value = v; calcForm(); },
  size: v => { const [a, b] = v.split('×'); fe('th').value = a; fe('wd').value = b; calcForm(); },
  st: (v, el) => {
    const f = FORMS[FK].f.find(x => x.k === el.dataset.k), i = fe(f.k);
    i.value = Math.max(0, Math.round((num(i.value) + (+v) * (f.s || 1)) * 1000) / 1000); calcForm(f.k === FORMS[FK].auto);
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = ACT[el.dataset.a]; if (f) { hap(); f(el.dataset.v, el); }
});
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.rip'); if (!el) return;
  const r = el.getBoundingClientRect(); el.style.setProperty('--x', e.clientX - r.left + 'px'); el.style.setProperty('--y', e.clientY - r.top + 'px');
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.wq = t.value; clearTimeout(DEB); DEB = setTimeout(() => stockList(false), 120); }
  else if (t.id === 'oq') { S.oq = t.value; clearTimeout(DEB); DEB = setTimeout(() => orderList(false), 120); }
  else if (t.id === 'd1' || t.id === 'd2') { S.range = 'custom'; $$('[data-a="range"]').forEach(b => b.classList.remove('on')); loadStats(); }
  else if (t.dataset.k && FK) calcForm(t.dataset.k === FORMS[FK].auto);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.k && FK) { if (FK === 'sawing' && t.dataset.k === 'log') syncLog(); calcForm(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lp') login(); });

/* ---------- старт ---------- */
if (inTg) tgAuth();
else { const j = jwt(); if (j && j.exp * 1000 > Date.now()) finish(token()); else vLogin(); }
</script>
