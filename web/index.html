<!DOCTYPE html>
<html lang="ru" data-t="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060f">
<meta name="color-scheme" content="dark">
<title>Лесопилка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============================================================
   Лесопилка — Midnight product-launch
   Frosted glass cathedral at midnight (токены из DESIGN.md)
   ============================================================ */
:root{
  /* --- Цвета --- */
  --color-midnight-canvas:#05060f;
  --color-steel-plate:#2f343e;
  --color-fog-veil:#9da7ba;
  --color-moon-mist:#c7d3ea;
  --color-frost-glow:#d1e4fa;
  --color-ice-highlight:#d8ecf8;
  --gradient-ice-highlight:linear-gradient(0deg,#d8ecf8 0%,#98c0ef 100%);
  --color-pure-white:#ffffff;
  --color-void-violet:#663af3;
  --color-blueprint-blue:#b6d9fc;
  --color-ember-glow:#e46d4c;
  --color-signal-blue:#027dea;
  --color-deep-teal:#269684;
  --color-gridline-blue:#3f4959;

  /* --- Полупрозрачные стеклянные слои --- */
  --glass-edge:rgba(186,215,247,.12);        /* универсальная hairline-обводка */
  --glass-edge-soft:rgba(186,214,247,.06);
  --frost-wash:rgba(186,214,247,.06);        /* фон ghost-кнопок и плиток */
  --frost-wash-hi:rgba(186,214,247,.12);     /* hover/active frost wash */
  --luminous-fill:rgba(199,211,234,.12);     /* фон бейджей */
  --glass-plate:rgba(186,214,247,.035);      /* поверхность стеклянной карточки */
  --deep-glass:rgba(5,6,15,.97);             /* почти непрозрачная midnight-поверхность */

  /* --- Семантика (внутри палитры) --- */
  --ok:#3fce9e;
  --warn:#e8b34b;
  --err:var(--color-ember-glow);

  /* --- Типографика --- */
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;

  /* --- Тени: elevation через inset-frost + тёмный halo --- */
  --shadow-hairline:inset 0 0 0 1px var(--glass-edge);
  --shadow-card:inset 0 1px 0 rgba(199,211,234,.10),0 10px 20px rgba(6,6,14,.45);
  --shadow-modal:inset 0 1px 0 rgba(216,236,248,.2),0 -10px 24px rgba(0,0,0,.35);
  --shadow-focus:inset 0 0 0 1px rgba(186,215,247,.24),0 0 0 4px rgba(182,217,252,.08);

  /* --- Безопасные зоны Telegram --- */
  --top:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + env(safe-area-inset-top,0px));
  --bot:calc(var(--tg-safe-area-inset-bottom,0px) + env(safe-area-inset-bottom,0px));
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--color-midnight-canvas);
  color:var(--color-frost-glow);
  font:16px/1.5 var(--font-ui);
  letter-spacing:-.16px;
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  color-scheme:dark;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:22px;height:22px;flex:none}
::selection{background:rgba(102,58,243,.45)}

/* ---------- фон: blueprint-сетка + прожектор + статичные свечения ---------- */
/* Раньше: три слоя 75vmax с filter:blur(70px) и бесконечной анимацией. Это главная причина нагрева iPhone. */
.bg{position:fixed;inset:0;overflow:hidden;z-index:-1;contain:paint;
  background:
    radial-gradient(60vmax 60vmax at -10% -8%,rgba(102,58,243,.30),transparent 70%),
    radial-gradient(60vmax 60vmax at 110% 38%,rgba(2,125,234,.24),transparent 70%),
    radial-gradient(60vmax 60vmax at -5% 108%,rgba(38,150,132,.18),transparent 70%),
    var(--color-midnight-canvas)}
.bg::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(186,215,247,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(186,215,247,.05) 1px,transparent 1px);
  background-size:80px 80px;
  -webkit-mask-image:radial-gradient(ellipse 110% 75% at 50% 0%,#000 25%,transparent 100%);
  mask-image:radial-gradient(ellipse 110% 75% at 50% 0%,#000 25%,transparent 100%);
}
.bg::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:conic-gradient(at 50% -5%,transparent 45%,rgba(124,145,182,.28) 49%,rgba(124,145,182,.48) 50%,rgba(124,145,182,.28) 51%,transparent 55%);
}
.bg i{display:none}
/* живой фон только на настольных устройствах (мышь): на телефонах он статичен */
@media (hover:hover) and (pointer:fine){
  .bg i{display:block;position:absolute;width:75vmax;height:75vmax;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform;animation:drift 24s ease-in-out infinite alternate}
  .bg i:nth-child(1){left:-30vmax;top:-26vmax;background:radial-gradient(circle,rgba(102,58,243,.32),transparent 68%)}
  .bg i:nth-child(2){right:-36vmax;top:24vh;background:radial-gradient(circle,rgba(2,125,234,.26),transparent 68%);animation-delay:-9s}
  .bg i:nth-child(3){left:-16vmax;bottom:-42vmax;background:radial-gradient(circle,rgba(38,150,132,.2),transparent 68%);animation-delay:-16s}
}
@keyframes drift{to{transform:translate(12vmax,-8vmax) scale(1.16)}}

/* ---------- стекло ---------- */
/* Карточки лежат на гладком тёмном фоне: backdrop-filter там ничего не добавлял, но пересчитывался на каждый кадр.
   Размытие оставлено только у панелей, под которыми прокручивается контент. */
.glass{
  background-color:var(--glass-plate);
  background-image:linear-gradient(180deg,rgba(199,211,234,.06),rgba(199,211,234,0) 45%);
  box-shadow:var(--shadow-hairline),var(--shadow-card);
}
.glass-deep{background-color:var(--deep-glass);box-shadow:inset 0 0 0 1px rgba(199,211,234,.08),var(--shadow-modal)}
.tabs,.act,.panel{backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}

/* ---------- мягкий отклик при нажатии (ripple) ---------- */
.rip{position:relative;overflow:hidden}
.rip::after{content:"";position:absolute;left:var(--x,50%);top:var(--y,50%);width:10px;height:10px;margin:-5px;border-radius:50%;background:rgba(216,236,248,.4);opacity:0;pointer-events:none}
.rip.go::after{animation:rp .55s ease-out}
@keyframes rp{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(30)}}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;gap:12px;padding:calc(var(--top) + 14px) 18px 8px}
.tt{flex:1;min-width:0}
.tt small{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-fog-veil);min-height:0;margin-bottom:2px}
h1{margin:0;font-family:var(--font-display);font-size:26px;line-height:1.15;font-weight:500;letter-spacing:-.01em;color:var(--color-pure-white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h3{margin:0 0 6px;font-family:var(--font-display);font-size:20px;font-weight:500;color:var(--color-pure-white)}
h4{grid-column:span 2;margin:12px 0 10px;font-family:var(--font-mono);font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--color-fog-veil)}
.icb{width:46px;height:46px;border-radius:9999px;display:grid;place-items:center;font-weight:600;font-size:17px;color:var(--color-frost-glow);border:0;flex:none;transition:transform .15s}
.icb:active{transform:scale(.9)}
#hb{display:none}
body.form #hb{display:grid}
body.form #av,body.noauth #av{display:none}
#view{padding:10px 16px calc(var(--bot) + 132px)}
.hint{color:var(--color-fog-veil)}.sm{font-size:13px}

/* светящийся градиентный текст (Skywash) — только для крупных акцентов */
.gt{background:var(--gradient-ice-highlight);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- карточки ---------- */
.card{border-radius:16px;padding:24px;margin-bottom:14px;animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.98)}}
.hero{padding:24px}
.hero .big{font-family:var(--font-display);font-size:48px;font-weight:500;letter-spacing:-.02em;line-height:1.05;margin:8px 0 4px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;background:var(--luminous-fill);color:var(--color-frost-glow);box-shadow:inset 0 1px 1px rgba(199,211,234,.1)}

/* KPI-плитки */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.k{border-radius:16px;padding:16px 12px;animation:up .5s both}
.k small{display:block;color:var(--color-fog-veil);font-size:12px;line-height:1.33}
.k b{display:block;font-family:var(--font-display);font-weight:500;font-size:18px;color:var(--color-ice-highlight);margin-top:6px;letter-spacing:-.01em}

/* eyebrow-заголовки секций: моноширинные caps с затухающей линией */
.sect{display:flex;align-items:center;gap:12px;margin:26px 2px 12px}
.sect>span{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-moon-mist);display:flex;align-items:center;gap:10px;white-space:nowrap}
.sect>span::before{content:"";width:18px;height:1px;background:linear-gradient(90deg,transparent,var(--glass-edge))}
.sect button{margin-left:auto;border:0;background:none;color:var(--color-blueprint-blue);font-size:14px;font-weight:500;padding:6px 4px}

/* плитки быстрых действий */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:0;border-radius:16px;padding:18px 8px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--color-frost-glow);text-align:center;transition:transform .15s}
.tile:active,.it:active,.srow:active,.chip:active{transform:scale(.96)}
.tile .e{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--frost-wash-hi);color:var(--color-ice-highlight)}
.tile .e svg{width:24px;height:24px}

/* прогресс-бары */
.bar{margin:14px 0}
.bar .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px;color:var(--color-moon-mist)}
.bar .l b{color:var(--color-frost-glow);font-weight:600}
.pb{height:8px;border-radius:999px;background:rgba(199,211,234,.08);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);overflow:hidden}
.pb i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--c,var(--gradient-ice-highlight));transform-origin:0 50%;animation:grow 1s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scaleX(0)}}

/* ---------- списки ---------- */
.it{border-radius:16px;padding:16px;margin-bottom:10px;animation:up .45s both;animation-delay:calc(var(--i,0)*45ms);transition:transform .15s;content-visibility:auto;contain-intrinsic-size:auto 88px}
.noanim .it{animation:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row b{color:var(--color-pure-white);font-weight:600}
.it .pb{margin-top:12px;height:6px}
.bd{font-size:12px;font-weight:500;padding:5px 10px;border-radius:6px;white-space:nowrap;background:var(--luminous-fill);color:var(--color-frost-glow);box-shadow:inset 0 1px 1px rgba(199,211,234,.1)}
.bd.completed{background:rgba(38,150,132,.22);color:#5fe3bd}
.bd.in_progress{background:rgba(2,125,234,.2);color:#7db8f7}
.bd.canceled{background:rgba(228,109,76,.16);color:var(--color-ember-glow)}

/* поиск — крупная pill-строка */
.srch{display:flex;align-items:center;gap:10px;height:54px;padding:0 18px;border-radius:999px;margin-bottom:12px;color:var(--color-fog-veil)}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--color-pure-white);font-size:15px}
.srch input::placeholder{color:var(--color-fog-veil)}

/* сегментный переключатель */
.seg{display:flex;gap:4px;padding:5px;border-radius:999px;margin-bottom:12px}
.seg button{flex:1;min-height:46px;border:0;border-radius:999px;background:none;font-weight:600;font-size:14px;color:var(--color-fog-veil);transition:all .25s}
.seg button.on{background:var(--color-void-violet);color:var(--color-pure-white);box-shadow:0 6px 20px rgba(102,58,243,.45),inset 0 1px 0 rgba(255,255,255,.22)}

/* чипы-фильтры */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 16px;border-radius:999px;border:0;box-shadow:var(--shadow-hairline);background:var(--frost-wash);color:var(--color-moon-mist);font-size:14px;font-weight:500;transition:all .2s}
.chip.on{background:var(--frost-wash-hi);color:var(--color-pure-white);box-shadow:inset 0 0 0 1px rgba(186,215,247,.28),inset 0 1px 1px rgba(216,236,248,.2)}

/* пустые состояния и скелетоны */
.empty{text-align:center;color:var(--color-fog-veil);padding:44px 12px;font-size:15px}
.empty .e{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--frost-wash);color:var(--color-fog-veil)}
.empty .e svg{width:30px;height:30px}
.sk{height:78px;border-radius:16px;margin-bottom:10px;background:rgba(186,214,247,.07);animation:pulse 1.4s ease-in-out infinite;box-shadow:var(--shadow-hairline)}
@keyframes pulse{50%{opacity:.45}}

/* ---------- кнопки ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;width:100%;padding:0 24px;border:0;border-radius:999px;
  font-weight:600;font-size:16px;color:var(--color-pure-white);
  background:linear-gradient(180deg,#7447ff,var(--color-void-violet) 60%,#5329d6);
  box-shadow:0 12px 30px rgba(102,58,243,.42),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .15s,filter .15s,opacity .2s;
}
.btn:active{transform:scale(.96);filter:brightness(1.1)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn.ghost{color:var(--color-frost-glow);background:var(--frost-wash);box-shadow:var(--shadow-hairline)}
.btn.ghost:active{background:var(--frost-wash-hi)}
.btn.sm{min-height:48px;font-size:14px}
.btn svg{width:20px;height:20px}
.btn.busy::before{content:"";width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.two{display:flex;gap:10px;margin-top:14px}.two .btn{flex:1}

/* ---------- нижняя навигация ---------- */
.tabs{
  position:fixed;left:14px;right:14px;bottom:calc(var(--bot) + 12px);z-index:20;height:72px;border-radius:999px;
  display:flex;align-items:center;justify-content:space-around;padding:0 10px;
  background-color:rgba(20,24,36,.72);
}
body.form .tabs,body.noauth .tabs{display:none}
.tab{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:999px;background:none;color:var(--color-fog-veil);font-size:11px;font-weight:600;letter-spacing:.01em;transition:color .2s,background .2s}
.tab svg{transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.tab.on{color:var(--color-pure-white);background:var(--frost-wash-hi);box-shadow:inset 0 0 0 1px rgba(186,215,247,.22),inset 0 1px 1px rgba(216,236,248,.18)}
.tab.on svg{transform:translateY(-2px) scale(1.12);color:var(--color-blueprint-blue)}
.fab{
  width:62px;height:62px;flex:none;margin:0 6px;transform:translateY(-16px);border:0;border-radius:9999px;display:grid;place-items:center;color:var(--color-pure-white);
  background:linear-gradient(180deg,#7447ff,var(--color-void-violet));
  box-shadow:0 14px 34px rgba(102,58,243,.55),inset 0 1px 0 rgba(255,255,255,.32);transition:transform .2s;
}
.fab svg{width:28px;height:28px;stroke-width:2.4;transition:transform .35s}
.fab:active{transform:translateY(-14px) scale(.92)}.fab:active svg{transform:rotate(90deg)}

/* панель действия для форм */
.act{position:fixed;left:14px;right:14px;bottom:calc(var(--bot) + 12px);z-index:20;padding:10px;border-radius:28px;display:none;background-color:rgba(20,24,36,.72)}
body.form .act{display:block}

/* ---------- формы ---------- */
.fgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.fld{grid-column:span 2;margin-bottom:14px;min-width:0}.fld.half{grid-column:span 1}
.fld>label{display:block;font-size:13px;font-weight:500;color:var(--color-fog-veil);margin:0 0 8px 4px}
.fld input,.fld select{
  width:100%;height:56px;padding:0 16px;border:0;border-radius:6px;outline:0;
  background:rgba(199,211,234,.06);color:var(--color-pure-white);
  box-shadow:var(--shadow-hairline);
  appearance:none;-webkit-appearance:none;
  transition:box-shadow .2s;
}
.fld input::placeholder{color:rgba(199,211,234,.6)}
.fld input:focus,.fld select:focus{box-shadow:var(--shadow-focus)}
.fld select option{color:var(--color-frost-glow);background:#141824}
.fld input[type="date"]{min-height:56px}
.sel{position:relative}
.sel::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;border:solid var(--color-fog-veil);border-width:0 2px 2px 0;transform:translateY(-75%) rotate(45deg);pointer-events:none}
.sel select{padding-right:40px;text-overflow:ellipsis}
.num{display:flex;gap:6px}
.num input{flex:1;min-width:0;text-align:center;font-weight:600;font-size:18px;padding:0 2px;font-variant-numeric:tabular-nums}
.num button{width:42px;height:56px;flex:none;border:0;border-radius:16px;box-shadow:var(--shadow-hairline);background:var(--frost-wash);color:var(--color-frost-glow);font-size:22px;font-weight:500;transition:background .15s}
.num button:active{background:var(--frost-wash-hi)}
@media(max-width:359px){.fld.half{grid-column:span 2}} /* на очень узких экранах поля идут в одну колонку */
.fld .chips{padding:10px 0 0}

/* превью-расчёт в формах */
.pv{display:flex;flex-direction:column;gap:12px}
.pvr{display:flex;justify-content:space-between;align-items:baseline}
.pvr b{font-family:var(--font-display);font-weight:500;font-size:22px;letter-spacing:-.01em;color:var(--color-ice-highlight)}

/* ---------- шторка и тост ---------- */
.sheet{position:fixed;inset:0;z-index:60;visibility:hidden;transition:visibility 0s .4s}
.sheet.on{visibility:visible;transition-delay:0s}
.scrim{position:absolute;inset:0;background:rgba(3,4,10,.62);opacity:0;transition:opacity .3s}
.sheet.on .scrim{opacity:1}
.panel{
  position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;
  border-radius:16px 16px 0 0;padding:12px 20px calc(var(--bot) + 24px);
  transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.3,1);
  background-color:var(--deep-glass);
  box-shadow:inset 0 1px 1px rgba(216,236,248,.2),0 -10px 28px rgba(0,0,0,.4);
}
.sheet.on .panel{transform:none}
.grab{width:42px;height:5px;border-radius:999px;background:var(--color-fog-veil);opacity:.35;margin:2px auto 18px}
.ctr{text-align:center;padding:6px 0 4px}
.ctr .e{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--frost-wash-hi);color:var(--color-ice-highlight)}
.ctr .e svg{width:30px;height:30px}
.ctr p{color:var(--color-fog-veil)}
.srow{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:0;margin-bottom:10px;border-radius:16px;text-align:left;color:var(--color-frost-glow);transition:transform .15s}
.srow .e{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:14px;background:var(--frost-wash-hi);color:var(--color-ice-highlight)}
.srow .e svg{width:22px;height:22px}
.srow.off{opacity:.55;pointer-events:none}
.k small svg{width:14px;height:14px;vertical-align:-2px;margin-right:6px}
.srow span:nth-child(2){flex:1}
.srow b{display:block;color:var(--color-pure-white);font-weight:600}
.srow small{color:var(--color-fog-veil)}
.srow>svg{color:var(--color-fog-veil)}
.srow:disabled{opacity:.55;pointer-events:none}
.dl{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--glass-edge-soft)}
.dl:last-of-type{border:0}
.dl b{color:var(--color-frost-glow);font-weight:600}
#toast{
  white-space:normal;text-align:center;position:fixed;top:calc(var(--top) + 8px);left:50%;z-index:99;max-width:90vw;
  padding:13px 22px;border-radius:999px;font-size:14px;font-weight:600;color:var(--color-pure-white);
  background-color:rgba(20,24,36,.85);
  transform:translate(-50%,-160%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);
}
#toast.on{transform:translate(-50%,0)}
#toast.ok::before{content:"";display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:#34c759}
#toast.err::before{content:"";display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:#ff453a}

/* ---------- вход ---------- */
.login{text-align:center;margin-top:8vh}
.login .logo{
  font-size:44px;display:grid;place-items:center;width:96px;height:96px;margin:0 auto;border-radius:9999px;
  background:var(--frost-wash);box-shadow:inset 0 1px 1px rgba(216,236,248,.2),inset 0 24px 48px rgba(168,216,245,.06),0 16px 32px rgba(0,0,0,.3);
  animation:flt 3.5s ease-in-out infinite;
}
@keyframes flt{50%{transform:translateY(-8px)}}
.login .logo svg{width:46px;height:46px;color:var(--color-ice-highlight)}
.login .wordmark{font-family:var(--font-display);font-weight:500;font-size:32px;letter-spacing:-.01em;margin:16px 0 4px}
.login .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-fog-veil);display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px}
.login .eyebrow::before,.login .eyebrow::after{content:"";width:36px;height:1px}
.login .eyebrow::before{background:linear-gradient(90deg,transparent,var(--glass-edge))}
.login .eyebrow::after{background:linear-gradient(90deg,var(--glass-edge),transparent)}
.login .card{max-width:420px;margin-left:auto;margin-right:auto}
.login .fld{text-align:left}
.av{width:88px;height:88px;margin:4px auto 14px;font-size:36px;font-family:var(--font-display);font-weight:500;color:var(--color-ice-highlight)}

/* ---------- экономный режим: включается вручную в профиле или автоматически на слабых устройствах ---------- */
html.lite *,html.lite *::before,html.lite *::after{animation:none!important;transition:none!important}
html.lite .tabs,html.lite .act,html.lite .panel{backdrop-filter:none;-webkit-backdrop-filter:none}
html.lite .tabs,html.lite .act{background-color:rgba(14,17,28,.97)}
html.lite .panel{background-color:#0b0e1a}
html.lite .bg::after,html.lite .bg i{display:none}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="noauth">
<div class="bg"><i></i><i></i><i></i></div>
<header class="top">
  <button class="icb glass rip" id="hb" data-a="back" aria-label="Назад"></button>
  <div class="tt"><small id="sub"></small><h1 id="title">Лесопилка</h1></div>
  <button class="icb glass rip" id="av" data-a="go" data-v="profile" aria-label="Профиль"></button>
</header>
<main id="view"></main>
<nav class="tabs glass" id="tabs"></nav>
<div class="act glass"><button class="btn rip" id="ok" data-a="ok"></button></div>
<div class="sheet" id="sheet"><div class="scrim" data-a="no"></div><div class="panel"><div class="grab"></div><div id="sb"></div></div></div>
<div id="toast" class="glass"></div>

<script>
const tg = window.Telegram.WebApp, inTg = !!tg.initData;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF = {};
/* Длина в метрах: 6000 -> «6 м», 4500 -> «4,5 м» */
const lenM = mm => fmt(mm / 1000, 2) + ' м';
/* Доска по-человечески: «Доска 50×150 · 6 м · Сосна, сорт 1» (без технических номеров) */
const boardTitle = b => `Доска ${b.height_mm}×${b.width_mm}`;
const boardLabel = b => `${boardTitle(b)} · ${lenM(b.length_mm)} · ${b.species || 'порода не указана'}${b.grade ? ', сорт ' + b.grade : ''}`;
const fmt = (n, d = 1) => (NF[d] || (NF[d] = new Intl.NumberFormat('ru-RU', {maximumFractionDigits: d}))).format(+n || 0);
const sum = (a, k) => a.reduce((s, x) => s + (+x[k] || 0), 0);
const pad = n => String(n).padStart(2, '0'), ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const ST = {new: 'Новый', in_progress: 'В работе', completed: 'Завершён', canceled: 'Отменён'};
const ROLE = {manager: 'Руководитель', master: 'Мастер', worker: 'Сотрудник'};
/* палитра графиков — внутри дизайн-системы: blueprint blue, violet, ice, teal, signal, ember */
const PAL = ['#b6d9fc', '#8a63f5', '#98c0ef', '#269684', '#027dea', '#e46d4c'];
const ICP = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>', check: '<path d="M5 12l5 5L20 7"/>',
  file: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
  back: '<path d="M15 5l-7 7 7 7"/>', chev: '<path d="M9 5l7 7-7 7"/>',
  arrival: '<path d="M1 6h13v10H1z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  sawing: '<path d="M12 2l10 5-10 5L2 7z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/>',
  order: '<path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h6"/>',
  send: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  download: '<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  ok: '<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>',
  warn: '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/>',
  trend: '<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',
  mark: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="3"/>',
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICP[n] || ''}</svg>`;

tg.ready(); tg.expand();
/* тема: всегда midnight — кастомная палитра является основной темой приложения */
function theme() {
  document.documentElement.dataset.t = 'dark';
  try { tg.setHeaderColor('#05060f'); tg.setBackgroundColor('#05060f'); } catch (e) {}
}
theme(); tg.onEvent('themeChanged', theme);
try { tg.MainButton.hide(); } catch (e) {}


/* ---------- экономный режим ---------- */
let LITE = null; try { LITE = localStorage.getItem('lite'); } catch (e) {}
document.documentElement.classList.toggle('lite', LITE === 'on');
const isLite = () => document.documentElement.classList.contains('lite');
function setLite(on, auto) {
  document.documentElement.classList.toggle('lite', on);
  if (!auto) { LITE = on ? 'on' : 'off'; try { localStorage.setItem('lite', LITE); } catch (e) {} }
}
/* Автоопределение: если сразу после входа большинство кадров медленнее ~30 к/с, включаем экономный режим на этот сеанс. */
function perfProbe() {
  if (LITE !== null || isLite()) return;
  let n = 0, last = 0, slow = 0;
  const step = t => {
    if (last) { n++; if (t - last > 36) slow++; }
    last = t;
    if (n < 45) requestAnimationFrame(step);
    else if (slow > 20) { setLite(true, true); toast('Включён экономный режим для плавной работы'); }
  };
  setTimeout(() => requestAnimationFrame(step), 1500);
}

/* ---------- состояние и утилиты ---------- */
const S = {role: 'worker', name: '', tab: 'home', cur: 'login', stack: [], wt: 'boards', wq: '', wsp: '', of: 'all', oq: '', range: 'month'};
let CFG = {pdf_send: true}; // настройки с сервера (/config)
const D = {boards: [], logs: [], orders: [], con: {}};
let MEM = {}; try { MEM = JSON.parse(localStorage.getItem('mem') || '{}'); } catch (e) {}
const mem = (k, v) => { MEM[k] = v; try { localStorage.setItem('mem', JSON.stringify(MEM)); } catch (e) {} };
const hap = t => { try { tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };
const notify = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const token = () => localStorage.getItem('jwt_token');
const jwt = () => { try { return JSON.parse(decodeURIComponent(atob(token().split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''))); } catch (e) { return null; } };
const uid = () => jwt()?.user_id || 1;
const sk = n => '<div class="sk"></div>'.repeat(n);
const hello = () => { const h = new Date().getHours(); return h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер'; };

let tt;
function toast(m, k = 'ok') { const t = $('#toast'); t.className = 'glass ' + k + ' on'; t.textContent = m; clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2900); }

async function api(path, opts = {}) {
  const headers = {'Content-Type': 'application/json'};
  if (token()) headers.Authorization = 'Bearer ' + token();
  const r = await fetch('/api/v1' + path, {...opts, headers});
  if (!r.ok) throw new Error((await r.text()).trim() || 'Ошибка ' + r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const safe = async u => { try { return (await api(u)) || []; } catch (e) { return null; } };
async function loadConfig() { try { const c = await api('/config'); if (c) CFG = {...CFG, ...c}; } catch (e) {} }
async function loadStock() { const [b, l] = await Promise.all([safe('/boards'), safe('/logs')]); if (b) D.boards = b; if (l) D.logs = l; }
async function ensureCon() { if (Object.keys(D.con).length) return; (await safe('/contractors') || []).forEach(c => D.con[c.id] = c.name); }

function countUp(root = $('#view')) {
  const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
  $$('[data-n]', root).forEach(el => {
    const n = +el.dataset.n, d = +el.dataset.d || 0, u = el.dataset.u || '', t0 = performance.now();
    const f = t => { const k = still ? 1 : Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(n * e, d) + u; if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}

/* ---------- шторка и подтверждение ---------- */
let ASK = null;
const sheet = html => { $('#sb').innerHTML = html; $('#sheet').classList.add('on'); };
const closeSheet = () => $('#sheet').classList.remove('on');
function ask(e, title, text, ok) {
  return new Promise(res => {
    ASK = res;
    sheet(`<div class="ctr"><div class="e">${ic(e)}</div><h3>${esc(title)}</h3><p>${esc(text)}</p></div>
      <div class="two"><button class="btn ghost rip" data-a="no">Отмена</button><button class="btn rip" data-a="yes">${esc(ok)}</button></div>`);
  });
}
const settle = v => { closeSheet(); if (ASK) { const r = ASK; ASK = null; r(v); } };

/* ---------- навигация ---------- */
const TABS = ['home', 'stock', 'orders', 'stats', 'profile'];
const TT = {stock: 'Склад', orders: 'Заказы', stats: 'Отчёты', profile: 'Профиль'};
const canOrd = () => S.role === 'manager' || S.role === 'master';

function buildTabs() {
  const t = [['home', 'home', 'Главная'], ['stock', 'box', 'Склад']];
  if (canOrd()) t.push(['orders', 'list', 'Заказы']);
  if (S.role === 'manager') t.push(['stats', 'chart', 'Отчёты']); else if (!canOrd()) t.push(['profile', 'user', 'Профиль']);
  t.splice(2, 0, ['fab']);
  $('#tabs').innerHTML = t.map(x => x[0] === 'fab'
    ? `<button class="fab rip" data-a="fab" aria-label="Создать">${ic('plus')}</button>`
    : `<button class="tab rip" data-a="go" data-v="${x[0]}">${ic(x[1])}<span>${x[2]}</span></button>`).join('');
}

function go(v, p) {
  if (TABS.includes(v)) { S.tab = v; S.stack = []; } else S.stack.push(S.cur);
  show(v, p);
}
function back() { show(S.stack.pop() || S.tab); }
function show(v, p) {
  S.cur = v;
  const form = !!FORMS[v];
  document.body.classList.toggle('form', form);
  const f = FORMS[v];
  $('#title').textContent = f ? f.t : v === 'home' ? `${hello()}, ${S.name}` : TT[v] || 'Лесопилка';
  $('#sub').textContent = v === 'home' ? new Date().toLocaleDateString('ru-RU', {weekday: 'long', day: 'numeric', month: 'long'}) : '';
  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.v === S.tab));
  try { form ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
  scrollTo(0, 0);
  if (f) vForm(v, p); else ({home: vHome, stock: vStock, orders: vOrders, stats: vStats, profile: vProfile}[v] || (() => {}))();
}
tg.BackButton.onClick(back);
$('#hb').innerHTML = ic('back');

/* ---------- главный экран ---------- */
function rng(r) {
  const e = new Date(), s = new Date();
  if (r === 'week') s.setDate(s.getDate() - 6); else if (r === 'month') s.setDate(1); else if (r === 'year') { s.setMonth(0); s.setDate(1); }
  return [ymd(s), ymd(e)];
}
const sQ = (a, b) => `/statistics?start_date=${encodeURIComponent(a)}&end_date=${encodeURIComponent(b)}`;

async function vHome() {
  const v = $('#view'), m = S.role === 'manager';
  v.innerHTML = sk(3);
  const [, orders, st] = await Promise.all([loadStock(), canOrd() ? safe('/orders') : [], m ? api(sQ(...rng('month'))).catch(() => null) : null, ensureCon()]);
  if (S.cur !== 'home') return;
  D.orders = orders || [];
  const bv = sum(D.boards, 'volume_m3'), bc = sum(D.boards, 'count'), lv = sum(D.logs, 'volume_m3');
  const open = D.orders.filter(o => o.status !== 'completed' && o.status !== 'canceled');
  const by = {}; D.boards.forEach(b => { const k = b.species || '—'; by[k] = (by[k] || 0) + (+b.volume_m3 || 0); });
  const sp = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 5), mx = sp[0]?.[1] || 1;
  v.innerHTML = `
    <div class="card glass hero"><span class="hint sm">Готовая продукция на складе</span>
      <div class="big gt"><span data-n="${bv}" data-d="2" data-u=" м³">0</span></div>
      <div class="pills"><span class="pill">${fmt(bc, 0)} шт</span><span class="pill">${D.boards.length} позиций</span><span class="pill">сырьё ${fmt(lv, 1)} м³</span></div></div>
    ${m && st ? `<div class="kp">
      <div class="k glass"><small>Выручка, мес.</small><b data-n="${st.total_sales_amount || 0}" data-u=" ₽">0</b></div>
      <div class="k glass"><small>Продано</small><b data-n="${st.total_sales_volume || 0}" data-d="1" data-u=" м³">0</b></div>
      <div class="k glass"><small>Распилено</small><b data-n="${st.total_logs_sawed_volume || 0}" data-d="1" data-u=" м³">0</b></div></div>` : ''}
    <div class="sect"><span>Быстрые действия</span></div>
    <div class="tiles">
      <button class="tile glass rip" data-a="new" data-v="arrival"><span class="e">${ic('arrival')}</span>Приход леса</button>
      <button class="tile glass rip" data-a="new" data-v="sawing"><span class="e">${ic('sawing')}</span>Распиловка</button>
      ${canOrd() ? `<button class="tile glass rip" data-a="new" data-v="order"><span class="e">${ic('order')}</span>Новый заказ</button>` : `<button class="tile glass rip" data-a="go" data-v="stock"><span class="e">${ic('box')}</span>Склад</button>`}
    </div>
    ${sp.length ? `<div class="sect"><span>Склад по породам</span><button data-a="go" data-v="stock">Всё</button></div><div class="card glass">
      ${sp.map(([n, x], i) => `<div class="bar"><div class="l"><span>${esc(n)}</span><b>${fmt(x, 2)} м³</b></div><div class="pb"><i style="--w:${x / mx * 100}%;--c:${PAL[i % 6]}"></i></div></div>`).join('')}</div>` : ''}
    ${canOrd() ? `<div class="sect"><span>Активные заказы · ${open.length}</span><button data-a="go" data-v="orders">Все</button></div>
      ${open.length ? open.slice(0, 3).map(oCard).join('') : `<div class="empty glass card"><span class="e">${ic('ok')}</span>Все заказы выполнены</div>`}` : ''}`;
  countUp(v);
}

/* ---------- склад ---------- */
async function vStock(fetchNew = true) {
  const v = $('#view');
  if (fetchNew) { v.innerHTML = sk(5); await loadStock(); if (S.cur !== 'stock') return; }
  const list = S.wt === 'boards' ? D.boards : D.logs, sps = [...new Set(list.map(x => x.species || '—'))];
  v.innerHTML = `
    <div class="srch glass">${ic('search')}<input id="q" placeholder="Поиск: порода, размер, №" value="${esc(S.wq)}"></div>
    <div class="seg glass"><button class="rip ${S.wt === 'boards' ? 'on' : ''}" data-a="wt" data-v="boards">Пиломатериалы</button><button class="rip ${S.wt === 'logs' ? 'on' : ''}" data-a="wt" data-v="logs">Сырьё</button></div>
    <div class="chips"><button class="chip rip ${S.wsp ? '' : 'on'}" data-a="sp" data-v="">Все</button>${sps.map(s => `<button class="chip rip ${S.wsp === s ? 'on' : ''}" data-a="sp" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <div class="hint sm" id="ssum" style="margin:0 4px 10px"></div><div id="sl"></div>`;
  stockList();
}
const KEYS = new WeakMap();
const skey = x => {
  let k = KEYS.get(x);
  if (k === undefined) {
    k = [x.species, x.grade && 'сорт ' + x.grade,
         x.height_mm != null ? `доска ${x.height_mm}×${x.width_mm} ${x.length_mm}` : `бревно ø${x.diameter_mm} ${x.length_mm}`,
         x.arrival_id != null ? 'партия ' + x.arrival_id : ''].filter(Boolean).join(' ').toLowerCase();
    KEYS.set(x, k);
  }
  return k;
};
let DEB;
function stockList(animate = true) {
  const t = S.wt, q = S.wq.toLowerCase().replace(/(\d)\s*[*xх]\s*(\d)/g, '$1×$2');
  const list = (t === 'boards' ? D.boards : D.logs).filter(x => (!S.wsp || (x.species || '—') === S.wsp) && (!q || skey(x).includes(q))).sort((a, b) => b.volume_m3 - a.volume_m3);
  const mx = Math.max(...list.map(x => +x.volume_m3 || 0), 0.0001);
  $('#sl').classList.toggle('noanim', !animate);
  $('#ssum').textContent = `${list.length} поз. · ${fmt(sum(list, 'count'), 0)} шт · ${fmt(sum(list, 'volume_m3'), 2)} м³`;
  $('#sl').innerHTML = list.length ? list.map((x, i) => `
    <div class="it glass rip" data-a="item" data-v="${t}:${x.id}" style="--i:${Math.min(i, 12)}">
      <div class="row"><div><b>${t === 'boards' ? esc(boardTitle(x)) + ' · ' + lenM(x.length_mm) : `Бревно Ø${esc(x.diameter_mm)} × ${lenM(x.length_mm)}`}</b>
        <div class="hint sm">${[x.species, t === 'boards' ? (x.grade ? 'сорт ' + x.grade : '') : 'партия №' + x.arrival_id, fmt(x.volume_m3, 3) + ' м³'].filter(Boolean).map(esc).join(' · ')}</div></div>
        <span class="bd">${esc(x.count)} шт</span></div>
      <div class="pb"><i style="--w:${(x.volume_m3 / mx * 100).toFixed(1)}%"></i></div></div>`).join('')
    : `<div class="empty"><span class="e">${ic('inbox')}</span>Ничего не найдено</div>`;
}

/* ---------- заказы ---------- */
const isOpen = o => o.status !== 'completed' && o.status !== 'canceled';
function oCard(o, i = 0) {

  item: v => {
    const [t, id] = v.split(':'), x = find(t, id); if (!x) return;
    sheet(`<h3>${t === 'boards' ? esc(boardTitle(x)) : `Бревно Ø${esc(x.diameter_mm)}`}</h3>
      <div class="dl"><span class="hint">Порода</span><b>${esc(x.species || 'не указана')}</b></div>
      <div class="dl"><span class="hint">Длина</span><b>${lenM(x.length_mm)}</b></div>
      ${t === 'boards' ? `<div class="dl"><span class="hint">Сорт</span><b>${esc(x.grade || '1')}</b></div>` : `<div class="dl"><span class="hint">Партия прихода</span><b>№${esc(x.arrival_id)}</b></div>`}
      <div class="dl"><span class="hint">Остаток</span><b>${esc(x.count)} шт</b></div>
      <div class="dl"><span class="hint">Объём</span><b>${fmt(x.volume_m3, 3)} м³</b></div>
      ${t === 'boards' && canOrd() ? `<button class="btn rip" style="margin-top:14px" data-a="mk" data-v="order:board:${x.id}">Создать заказ на эту позицию</button>` : ''}
      ${t === 'logs' ? `<button class="btn rip" style="margin-top:14px" data-a="mk" data-v="sawing:log:${x.id}">Записать распиловку из этой партии</button>` : ''}`);
  },
  mk: v => { const [f, k, id] = v.split(':'); closeSheet(); go(f, {[k]: id}); },
  done: (v, el) => ask('ok', 'Завершить заказ №' + v, 'Товары будут списаны со склада и проведены как продажа.', 'Завершить').then(ok => ok && doComplete(v, el)),
  pdf: v => pdfSheet(v), pdfsend: (v, el) => pdfDo('send', v, el), pdfdl: (v, el) => pdfDo('dl', v, el), pdfview: (v, el) => pdfDo('view', v, el),
  chip: (v, el) => { fe(el.dataset.k).value = v; calcForm(); },
  size: v => { const [a, b] = v.split('×'); fe('th').value = a; fe('wd').value = b; calcForm(); },
  st: (v, el) => {
    const f = FORMS[FK].f.find(x => x.k === el.dataset.k), i = fe(f.k);
    i.value = Math.max(0, Math.round((num(i.value) + (+v) * (f.s || 1)) * 1000) / 1000); calcForm(f.k === FORMS[FK].auto);
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = ACT[el.dataset.a]; if (f) { hap(); f(el.dataset.v, el); }
});
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.rip'); if (!el) return;
  const r = el.getBoundingClientRect(); el.style.setProperty('--x', e.clientX - r.left + 'px'); el.style.setProperty('--y', e.clientY - r.top + 'px');
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.wq = t.value; clearTimeout(DEB); DEB = setTimeout(() => stockList(false), 120); }
  else if (t.id === 'oq') { S.oq = t.value; clearTimeout(DEB); DEB = setTimeout(() => orderList(false), 120); }
  else if (t.id === 'd1' || t.id === 'd2') { S.range = 'custom'; $$('[data-a="range"]').forEach(b => b.classList.remove('on')); loadStats(); }
  else if (t.dataset.k && FK) calcForm(t.dataset.k === FORMS[FK].auto);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.k && FK) { if (FK === 'sawing' && t.dataset.k === 'log') syncLog(); calcForm(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lp') login(); });

/* ---------- старт ---------- */
if (inTg) tgAuth();
else { const j = jwt(); if (j && j.exp * 1000 > Date.now()) finish(token()); else vLogin(); }
</script>
</body>
</html>
