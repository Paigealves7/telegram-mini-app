<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Лесопилка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --acc:var(--tg-theme-button-color,#4c8dff);--on:var(--tg-theme-button-text-color,#fff);
  --tx:var(--tg-theme-text-color,#0e1320);--hint:var(--tg-theme-hint-color,#667089);--base:var(--tg-theme-bg-color,#eaf0fc);
  --g:rgba(255,255,255,.55);--gb:rgba(255,255,255,.8);--sh:rgba(40,60,120,.18);--ig:rgba(255,255,255,.65);
  --ok:#22c55e;--warn:#f59e0b;--err:#ef4444;
  --top:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + env(safe-area-inset-top,0px));
  --bot:calc(var(--tg-safe-area-inset-bottom,0px) + env(safe-area-inset-bottom,0px));
}
html[data-t=dark]{--g:rgba(255,255,255,.08);--gb:rgba(255,255,255,.17);--sh:rgba(0,0,0,.5);--ig:rgba(255,255,255,.07);
  --base:var(--tg-theme-bg-color,#0a0e1a);--tx:var(--tg-theme-text-color,#f1f4ff);--hint:var(--tg-theme-hint-color,#98a2b8)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--base);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:22px;height:22px;flex:none}
.bg{position:fixed;inset:0;overflow:hidden;z-index:-1}
.bg i{position:absolute;width:75vmax;height:75vmax;border-radius:50%;filter:blur(60px);opacity:.5;will-change:transform;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){left:-28vmax;top:-24vmax;background:radial-gradient(circle,var(--acc),transparent 68%)}
.bg i:nth-child(2){right:-34vmax;top:22vh;background:radial-gradient(circle,#a855f7,transparent 68%);animation-delay:-8s}
.bg i:nth-child(3){left:-14vmax;bottom:-40vmax;background:radial-gradient(circle,#06b6d4,transparent 68%);animation-delay:-14s}
html[data-t=dark] .bg i{opacity:.36}
@keyframes drift{to{transform:translate(14vmax,-9vmax) scale(1.18)}}
.glass{background-color:var(--g);background-image:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,0) 46%);
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--gb);
  box-shadow:0 8px 32px var(--sh),inset 0 1px 0 rgba(255,255,255,.3)}
.rip{position:relative;overflow:hidden}
.rip::after{content:"";position:absolute;left:var(--x,50%);top:var(--y,50%);width:10px;height:10px;margin:-5px;border-radius:50%;background:rgba(255,255,255,.5);opacity:0;pointer-events:none}
.rip.go::after{animation:rp .55s ease-out}
@keyframes rp{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(30)}}
/* шапка */
.top{display:flex;align-items:center;gap:12px;padding:calc(var(--top) + 14px) 18px 8px}
.tt{flex:1;min-width:0}
.tt small{display:block;color:var(--hint);font-size:13px;text-transform:capitalize;min-height:0}
h1{margin:0;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h3{margin:0 0 6px;font-size:19px}
h4{grid-column:span 2;margin:8px 0 12px;font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:.8px}
.icb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:1px solid var(--gb);flex:none}
#hb{display:none}
body.form #hb{display:grid}
body.form #av,body.noauth #av{display:none}
#view{padding:8px 16px calc(var(--bot) + 130px)}
.hint{color:var(--hint)}.sm{font-size:13px}
.gt{background:linear-gradient(135deg,var(--tx),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{border-radius:26px;padding:18px;margin-bottom:14px;animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.98)}}
.hero{padding:22px}
.hero .big{font-size:46px;font-weight:800;letter-spacing:-1.6px;line-height:1.05;margin:6px 0}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.k{border-radius:22px;padding:14px 12px;animation:up .5s both}
.k small{display:block;color:var(--hint);font-size:12px}
.k b{display:block;font-size:18px;margin-top:4px;letter-spacing:-.4px}
.sect{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 10px;font-weight:700}
.sect button{border:0;background:none;color:var(--acc);font-size:14px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:24px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:700;text-align:center;transition:transform .15s}
.tile:active,.it:active,.srow:active{transform:scale(.96)}
.tile .e{font-size:30px}
.bar{margin:12px 0}
.bar .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.pb{height:8px;border-radius:8px;background:rgba(127,127,127,.2);overflow:hidden}
.pb i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--c,linear-gradient(90deg,var(--acc),#a855f7));animation:grow 1s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}
/* списки */
.it{border-radius:22px;padding:14px 16px;margin-bottom:10px;animation:up .45s both;animation-delay:calc(var(--i,0)*45ms);transition:transform .15s}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.it .pb{margin-top:10px;height:6px}
.bd{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;background:rgba(127,127,127,.18);background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.bd.completed{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.bd.in_progress{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.bd.canceled{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err)}
.srch{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:20px;margin-bottom:12px;color:var(--hint)}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--tx)}
.seg{display:flex;gap:4px;padding:4px;border-radius:20px;margin-bottom:12px}
.seg button{flex:1;min-height:44px;border:0;border-radius:16px;background:none;font-weight:700;color:var(--hint);transition:all .25s}
.seg button.on{background:var(--acc);color:var(--on);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 40%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--gb);background:var(--g);font-size:14px;font-weight:600;transition:all .2s}
.chip.on{background:var(--acc);color:var(--on);border-color:transparent}
.empty{text-align:center;color:var(--hint);padding:44px 12px}
.empty .e{font-size:44px;display:block;margin-bottom:8px}
.sk{height:76px;border-radius:22px;margin-bottom:10px;background:linear-gradient(90deg,var(--g) 25%,var(--gb) 50%,var(--g) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;width:100%;padding:0 20px;border:0;border-radius:20px;font-weight:700;color:var(--on);
  background:var(--acc);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 74%,#fff),var(--acc) 55%,color-mix(in srgb,var(--acc) 82%,#000));
  box-shadow:0 10px 28px color-mix(in srgb,var(--acc) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .15s,filter .15s,opacity .2s}
.btn:active{transform:scale(.96);filter:brightness(1.08)}
.btn:disabled{opacity:.6;pointer-events:none}
.btn.ghost{color:var(--tx);background-color:var(--g);background-image:none;border:1px solid var(--gb);box-shadow:none}
.btn.sm{min-height:46px;font-size:14px;border-radius:16px}
.btn svg{width:20px;height:20px}
.btn.busy::before{content:"";width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.two{display:flex;gap:10px;margin-top:12px}.two .btn{flex:1}
/* навигация */
.tabs{position:fixed;left:14px;right:14px;bottom:calc(var(--bot) + 12px);z-index:20;height:70px;border-radius:30px;display:flex;align-items:center;justify-content:space-around;padding:0 8px}
body.form .tabs,body.noauth .tabs{display:none}
.tab{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:22px;background:none;color:var(--hint);font-size:11px;font-weight:700;transition:color .2s,background .2s}
.tab svg{transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.tab.on{color:var(--acc);background:rgba(127,127,127,.16);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.tab.on svg{transform:translateY(-2px) scale(1.15)}
.fab{width:62px;height:62px;flex:none;margin:0 6px;transform:translateY(-16px);border:0;border-radius:50%;display:grid;place-items:center;color:var(--on);
  background:var(--acc);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 68%,#fff),var(--acc));
  box-shadow:0 14px 32px color-mix(in srgb,var(--acc) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .2s}
.fab svg{width:28px;height:28px;stroke-width:2.6;transition:transform .35s}
.fab:active{transform:translateY(-14px) scale(.92)}.fab:active svg{transform:rotate(90deg)}
.act{position:fixed;left:14px;right:14px;bottom:calc(var(--bot) + 12px);z-index:20;padding:10px;border-radius:28px;display:none}
body.form .act{display:block}
/* формы */
.fgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.fld{grid-column:span 2;margin-bottom:14px;min-width:0}.fld.half{grid-column:span 1}
.fld>label{display:block;font-size:13px;font-weight:600;color:var(--hint);margin:0 0 7px 4px}
.fld input,.fld select{width:100%;height:54px;padding:0 16px;border:1px solid var(--gb);border-radius:18px;outline:0;background:var(--ig);appearance:none;-webkit-appearance:none;transition:box-shadow .2s,border-color .2s}
.fld input:focus,.fld select:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 28%,transparent)}
.fld select option{color:#111}
.sel{position:relative}
.sel::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;border:solid var(--hint);border-width:0 2px 2px 0;transform:translateY(-75%) rotate(45deg);pointer-events:none}
.sel select{padding-right:40px;text-overflow:ellipsis}
.num{display:flex;gap:6px}
.num input{text-align:center;font-weight:700;font-size:18px;min-width:0;padding:0 4px}
.num button{width:46px;height:54px;flex:none;border-radius:18px;border:1px solid var(--gb);background:var(--g);font-size:22px;font-weight:600}
.fld .chips{padding:10px 0 0}
.pv{display:flex;flex-direction:column;gap:10px}
.pvr{display:flex;justify-content:space-between;align-items:baseline}
.pvr b{font-size:21px;letter-spacing:-.5px}
/* шторка и тост */
.sheet{position:fixed;inset:0;z-index:60;visibility:hidden;transition:visibility 0s .4s}
.sheet.on{visibility:visible;transition-delay:0s}
.scrim{position:absolute;inset:0;background:rgba(5,8,20,.45);opacity:0;transition:opacity .3s}
.sheet.on .scrim{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;border-radius:32px 32px 0 0;padding:12px 20px calc(var(--bot) + 22px);transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.3,1);backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%)}
.sheet.on .panel{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--hint);opacity:.4;margin:2px auto 18px}
.ctr{text-align:center;padding:6px 0 4px}.ctr .e{font-size:48px}
.srow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;margin-bottom:10px;border-radius:22px;text-align:left;transition:transform .15s}
.srow .e{font-size:30px}.srow span:nth-child(2){flex:1}.srow b{display:block}.srow small{color:var(--hint)}
.dl{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gb)}.dl:last-of-type{border:0}
#toast{position:fixed;top:calc(var(--top) + 8px);left:50%;z-index:99;max-width:90vw;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:700;transform:translate(-50%,-160%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
#toast.on{transform:translate(-50%,0)}
#toast.ok::before{content:"✓ ";color:var(--ok)}#toast.err::before{content:"⚠ ";color:var(--err)}
.login{text-align:center;margin-top:9vh}
.login .logo{font-size:64px;display:inline-block;animation:flt 3.5s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-10px) rotate(-4deg)}}
.login .fld{text-align:left}
.av{width:84px;height:84px;margin:6px auto 12px;font-size:34px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="noauth">
<div class="bg"><i></i><i></i><i></i></div>
<header class="top">
  <button class="icb glass rip" id="hb" data-a="back" aria-label="Назад"></button>
  <div class="tt"><small id="sub"></small><h1 id="title">Лесопилка</h1></div>
  <button class="icb glass rip" id="av" data-a="go" data-v="profile" aria-label="Профиль"></button>
</header>
<main id="view"></main>
<nav class="tabs glass" id="tabs"></nav>
<div class="act glass"><button class="btn rip" id="ok" data-a="ok"></button></div>
<div class="sheet" id="sheet"><div class="scrim" data-a="no"></div><div class="panel glass"><div class="grab"></div><div id="sb"></div></div></div>
<div id="toast" class="glass"></div>

<script>
const tg = window.Telegram.WebApp, inTg = !!tg.initData;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 1) => (+n || 0).toLocaleString('ru-RU', {maximumFractionDigits: d});
const sum = (a, k) => a.reduce((s, x) => s + (+x[k] || 0), 0);
const pad = n => String(n).padStart(2, '0'), ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const ST = {new: 'Новый', in_progress: 'В работе', completed: 'Завершён', canceled: 'Отменён'};
const ROLE = {manager: 'Руководитель', master: 'Мастер', worker: 'Сотрудник'};
const PAL = ['#4c8dff', '#a855f7', '#06b6d4', '#f59e0b', '#22c55e', '#ec4899'];
const ICP = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>', check: '<path d="M5 12l5 5L20 7"/>',
  file: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
  back: '<path d="M15 5l-7 7 7 7"/>', chev: '<path d="M9 5l7 7-7 7"/>'
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICP[n]}</svg>`;

tg.ready(); tg.expand();
function theme() {
  const dark = (tg.colorScheme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light')) === 'dark';
  document.documentElement.dataset.t = dark ? 'dark' : 'light';
  try { tg.setHeaderColor('bg_color'); tg.setBackgroundColor('bg_color'); } catch (e) {}
}
theme(); tg.onEvent('themeChanged', theme);
try { tg.MainButton.hide(); } catch (e) {}

/* ---------- состояние и утилиты ---------- */
const S = {role: 'worker', name: '', tab: 'home', cur: 'login', stack: [], wt: 'boards', wq: '', wsp: '', of: 'all', oq: '', range: 'month'};
const D = {boards: [], logs: [], orders: [], con: {}};
let MEM = {}; try { MEM = JSON.parse(localStorage.getItem('mem') || '{}'); } catch (e) {}
const mem = (k, v) => { MEM[k] = v; try { localStorage.setItem('mem', JSON.stringify(MEM)); } catch (e) {} };
const hap = t => { try { tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };
const notify = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const token = () => localStorage.getItem('jwt_token');
const jwt = () => { try { return JSON.parse(decodeURIComponent(atob(token().split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''))); } catch (e) { return null; } };
const uid = () => jwt()?.user_id || 1;
const sk = n => '<div class="sk"></div>'.repeat(n);
const hello = () => { const h = new Date().getHours(); return h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер'; };

let tt;
function toast(m, k = 'ok') { const t = $('#toast'); t.className = 'glass ' + k + ' on'; t.textContent = m; clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2900); }

async function api(path, opts = {}) {
  const headers = {'Content-Type': 'application/json'};
  if (token()) headers.Authorization = 'Bearer ' + token();
  const r = await fetch('/api/v1' + path, {...opts, headers});
  if (!r.ok) throw new Error((await r.text()).trim() || 'Ошибка ' + r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const safe = async u => { try { return (await api(u)) || []; } catch (e) { return null; } };
async function loadStock() { const [b, l] = await Promise.all([safe('/boards'), safe('/logs')]); if (b) D.boards = b; if (l) D.logs = l; }
async function ensureCon() { if (Object.keys(D.con).length) return; (await safe('/contractors') || []).forEach(c => D.con[c.id] = c.name); }

function countUp(root = $('#view')) {
  const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
  $$('[data-n]', root).forEach(el => {
    const n = +el.dataset.n, d = +el.dataset.d || 0, u = el.dataset.u || '', t0 = performance.now();
    const f = t => { const k = still ? 1 : Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(n * e, d) + u; if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}

/* ---------- шторка и подтверждение ---------- */
let ASK = null;
const sheet = html => { $('#sb').innerHTML = html; $('#sheet').classList.add('on'); };
const closeSheet = () => $('#sheet').classList.remove('on');
function ask(e, title, text, ok) {
  return new Promise(res => {
    ASK = res;
    sheet(`<div class="ctr"><div class="e">${e}</div><h3>${esc(title)}</h3><p class="hint">${esc(text)}</p></div>
      <div class="two"><button class="btn ghost rip" data-a="no">Отмена</button><button class="btn rip" data-a="yes">${esc(ok)}</button></div>`);
  });
}
const settle = v => { closeSheet(); if (ASK) { const r = ASK; ASK = null; r(v); } };

/* ---------- навигация ---------- */
const TABS = ['home', 'stock', 'orders', 'stats', 'profile'];
const TT = {stock: 'Склад', orders: 'Заказы', stats: 'Отчёты', profile: 'Профиль'};
const canOrd = () => S.role === 'manager' || S.role === 'master';

function buildTabs() {
  const t = [['home', 'home', 'Главная'], ['stock', 'box', 'Склад']];
  if (canOrd()) t.push(['orders', 'list', 'Заказы']);
  if (S.role === 'manager') t.push(['stats', 'chart', 'Отчёты']); else if (!canOrd()) t.push(['profile', 'user', 'Профиль']);
  t.splice(2, 0, ['fab']);
  $('#tabs').innerHTML = t.map(x => x[0] === 'fab'

      const vol = v.cnt === b.count ? b.volume_m3 : b.volume_m3 / b.count * v.cnt;
      return `<div class="pvr"><span class="hint">Объём заказа</span><b>${fmt(vol, 3)} м³</b></div><div class="pvr"><span class="hint">Сумма</span><b class="gt">${fmt(vol * v.price, 0)} ₽</b></div>
        <div class="pvr"><span class="hint">На складе</span><b style="font-size:16px;color:${v.cnt > b.count ? 'var(--err)' : 'inherit'}">${b.count} шт${v.cnt > b.count ? ' · не хватает' : ''}</b></div>`;
    },
    req: v => !v.board ? 'Выберите доску' : v.cnt <= 0 ? 'Укажите количество' : null,
    sum: v => `${fmt(v.cnt, 0)} шт по ${fmt(v.price, 0)} ₽ за м³, клиент: ${D.con[v.con] || '№' + v.con}`,
    mem: ['con', 'price'],
    body: v => ({contractor_id: +v.con || 1, status: 'new', delivery_price: 0, extra_price: 0, items: [{board_id: +v.board, count: Math.round(v.cnt), price: v.price}]})
  }
};
let FK = null;
const fe = k => $(`input[data-k="${k}"],select[data-k="${k}"]`);
const fval = (f, x) => (f.m && MEM[f.k] != null) ? MEM[f.k] : (x ?? f.v ?? '');
function fld(f) {
  let c;
  if (f.t === 'sel') c = `<div class="sel"><select data-k="${f.k}">${(f.o || []).map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select></div>`;
  else if (f.t === 'num') c = `<div class="num"><button type="button" class="rip" data-a="st" data-k="${f.k}" data-v="-1">−</button><input data-k="${f.k}" inputmode="decimal" value="${esc(fval(f))}"><button type="button" class="rip" data-a="st" data-k="${f.k}" data-v="1">+</button></div>`;
  else if (f.t === 'txt') c = `<input data-k="${f.k}" value="${esc(fval(f))}" placeholder="${esc(f.ph || '')}" autocomplete="off">`;
  else c = '';
  const ch = f.c ? `<div class="chips">${f.c.map(x => `<button type="button" class="chip rip" data-a="${f.t === 'pre' ? 'size' : 'chip'}" data-k="${f.k}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : '';
  return `${f.h ? `<h4>${f.h}</h4>` : ''}<div class="fld${f.half ? ' half' : ''}"><label>${f.l}</label>${c}${ch}</div>`;
}
function vals() {
  const v = {};
  FORMS[FK].f.forEach(f => { const el = fe(f.k); if (el) v[f.k] = f.t === 'num' ? num(el.value) : el.value.trim(); });
  return v;
}
function calcForm(fromAuto) {
  const F = FORMS[FK]; if (!F) return;
  let v = vals();
  if (F.calc && !fromAuto) { const r = F.calc(v); for (const k in r) fe(k).value = (+r[k] || 0).toFixed(3); v = vals(); }
  const pv = $('#pv'); if (pv && F.pv) pv.innerHTML = F.pv(v);
}
async function vForm(kind, p = {}) {
  const F = FORMS[kind]; FK = kind;
  $('#view').innerHTML = `<div class="card glass"><div class="fgrid">${F.f.map(fld).join('')}</div></div>${F.pv ? '<div class="card glass pv" id="pv"></div>' : ''}`;
  $('#ok').textContent = F.ok;
  await Promise.all([F.need.includes('con') ? ensureCon() : 0, F.need.some(n => n !== 'con') ? loadStock() : 0]);
  if (S.cur !== kind) return;
  F.f.forEach(f => {
    if (f.t !== 'sel' || !f.src) return;
    const el = fe(f.k), o = SRC[f.src]();
    el.innerHTML = o.length ? o.map(x => `<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('') : '<option value="">Нет данных</option>';
    const want = p[f.k] ?? (f.m ? MEM[f.k] : null);
    if (want != null && o.some(x => String(x[0]) === String(want))) el.value = want;
  });
  if (kind === 'sawing') syncLog();
  calcForm();
}
function syncLog() { const l = D.logs.find(x => x.id == fe('log').value); if (l) fe('lvol').value = (+l.volume_m3).toFixed(3); }
async function submitForm() {
  const F = FORMS[FK], v = vals(), e = F.req(v);
  if (e) { notify('error'); toast(e, 'err'); return; }
  if (!await ask(F.e, F.t, F.sum(v), 'Сохранить')) return;
  const b = $('#ok'); b.disabled = true; b.classList.add('busy');
  try {
    await api(F.path, {method: 'POST', body: JSON.stringify(F.body(v))});
    F.mem.forEach(k => mem(k, v[k]));
    notify('success'); toast(F.done); go(F.after);
  } catch (er) { notify('error'); toast(er.message, 'err'); }
  b.disabled = false; b.classList.remove('busy');
}

/* ---------- события ---------- */
const find = (t, id) => (t === 'boards' ? D.boards : D.logs).find(x => x.id == id);
const ACT = {
  go: v => go(v), back, yes: () => settle(true), no: () => settle(false), ok: submitForm, login, retry: tgAuth,
  logout: () => { localStorage.removeItem('jwt_token'); S.stack = []; buildTabs(); vLogin(); $('#tabs').innerHTML = ''; },
  new: v => { closeSheet(); go(v); },
  fab: () => sheet(`<div class="ctr" style="margin-bottom:14px"><h3>Что оформить?</h3></div>
    ${[['arrival', '📥', 'Приход леса', 'Принять партию бревен'], ['sawing', '🪚', 'Распиловка', 'Записать результат распила'], canOrd() && ['order', '🧾', 'Новый заказ', 'Заказ клиента на доски']].filter(Boolean)
      .map(([k, e, t, d]) => `<button class="srow glass rip" data-a="new" data-v="${k}"><span class="e">${e}</span><span><b>${t}</b><small>${d}</small></span>${ic('chev')}</button>`).join('')}`),
  wt: v => { S.wt = v; S.wsp = ''; vStock(false); },
  sp: v => { S.wsp = v; vStock(false); },
  of: v => { S.of = v; vOrders(false); },
  range: v => { S.range = v; vStats(); },
  item: v => {
    const [t, id] = v.split(':'), x = find(t, id); if (!x) return;
    sheet(`<h3>${t === 'boards' ? `${esc(x.species || 'Доска')} ${esc(x.height_mm)}×${esc(x.width_mm)}×${esc(x.length_mm)} мм` : `${esc(x.species || 'Бревно')} Ø${esc(x.diameter_mm)} · ${esc(x.length_mm)} мм`}</h3>
      <div class="dl"><span class="hint">Номер позиции</span><b>№${esc(x.id)}</b></div><div class="dl"><span class="hint">Остаток</span><b>${esc(x.count)} шт</b></div>
      <div class="dl"><span class="hint">Объём</span><b>${fmt(x.volume_m3, 3)} м³</b></div>
      ${t === 'boards' ? `<div class="dl"><span class="hint">Сорт</span><b>${esc(x.grade || '1')}</b></div>` : `<div class="dl"><span class="hint">Партия прихода</span><b>№${esc(x.arrival_id)}</b></div>`}
      ${t === 'boards' && canOrd() ? `<button class="btn rip" style="margin-top:14px" data-a="mk" data-v="order:board:${x.id}">Создать заказ на эту позицию</button>` : ''}
      ${t === 'logs' ? `<button class="btn rip" style="margin-top:14px" data-a="mk" data-v="sawing:log:${x.id}">Записать распиловку из этой партии</button>` : ''}`);
  },
  mk: v => { const [f, k, id] = v.split(':'); closeSheet(); go(f, {[k]: id}); },
  done: (v, el) => ask('✅', 'Завершить заказ №' + v, 'Товары будут списаны со склада и проведены как продажа.', 'Завершить').then(ok => ok && doComplete(v, el)),
  pdf: (v, el) => pdf(v, el),
  chip: (v, el) => { fe(el.dataset.k).value = v; calcForm(); },
  size: v => { const [a, b] = v.split('×'); fe('th').value = a; fe('wd').value = b; calcForm(); },
  st: (v, el) => {
    const f = FORMS[FK].f.find(x => x.k === el.dataset.k), i = fe(f.k);
    i.value = Math.max(0, Math.round((num(i.value) + (+v) * (f.s || 1)) * 1000) / 1000); calcForm(f.k === FORMS[FK].auto);
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = ACT[el.dataset.a]; if (f) { hap(); f(el.dataset.v, el); }
});
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.rip'); if (!el) return;
  const r = el.getBoundingClientRect(); el.style.setProperty('--x', e.clientX - r.left + 'px'); el.style.setProperty('--y', e.clientY - r.top + 'px');
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.wq = t.value; stockList(); }
  else if (t.id === 'oq') { S.oq = t.value; orderList(); }
  else if (t.id === 'd1' || t.id === 'd2') { S.range = 'custom'; $$('[data-a="range"]').forEach(b => b.classList.remove('on')); loadStats(); }
  else if (t.dataset.k && FK) calcForm(t.dataset.k === FORMS[FK].auto);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.k && FK) { if (FK === 'sawing' && t.dataset.k === 'log') syncLog(); calcForm(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lp') login(); });

/* ---------- старт ---------- */
if (inTg) tgAuth();
else { const j = jwt(); if (j && j.exp * 1000 > Date.now()) finish(token()); else vLogin(); }
</script>
</body>
</html>
