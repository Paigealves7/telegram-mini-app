<!DOCTYPE html>
<html lang="ru" data-t="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121412">
<meta name="color-scheme" content="dark">
<title>Лесопилка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Лесопилка: тёмный «стеклянный» интерфейс. Фон: туман в оливково-серых тонах. Акцент: кремовый. */
:root{--bg:#121412;--ink:#1a1c1a;--s1:rgba(255,255,255,.06);--s2:rgba(255,255,255,.08);--s3:rgba(255,255,255,.14);
--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.22);
--t1:#f5efe6;--t2:rgba(245,239,230,.6);--t3:rgba(245,239,230,.5);--wood:#f3e6d3;--err:#f0a99f;--ease:cubic-bezier(.2,.8,.2,1);
--font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--serif:'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif;
--blur:blur(22px) saturate(1.3);
--fx:inset 0 1px 0 rgba(255,255,255,.1),0 12px 40px rgba(0,0,0,.28);
--top:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + env(safe-area-inset-top,0px));
--bot:calc(var(--tg-safe-area-inset-bottom,0px) + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--t1);font:16px/1.5 var(--font);font-variant-numeric:tabular-nums;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;color-scheme:dark}
/* фон: размытый туман без внешних картинок */
body::before,body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
body::before{background:
 radial-gradient(70% 26% at 72% 24%,rgba(96,112,90,.42),transparent 72%),
 radial-gradient(80% 22% at 12% 52%,rgba(74,90,70,.34),transparent 72%),
 radial-gradient(70% 20% at 88% 70%,rgba(84,100,80,.30),transparent 72%),
 radial-gradient(100% 34% at 40% 100%,rgba(62,74,60,.42),transparent 72%),
 radial-gradient(120% 60% at 50% 0%,#1a1d19,transparent 70%),var(--bg)}
body::after{opacity:.5;mix-blend-mode:screen;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.006 .011' numOctaves='4' seed='11'/><feColorMatrix values='0 0 0 0 .34 0 0 0 0 .42 0 0 0 0 .33 0 0 0 1.25 -.5'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") center/cover}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
svg{width:24px;height:24px;flex:none;stroke-width:1.7}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--wood);outline-offset:3px}
.mut,.hint{color:var(--t2)}.sm{font-size:14px}
.rip{position:relative}
/* шапка */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(var(--top) + 16px) 20px 12px;background:linear-gradient(rgba(18,20,18,.92) 55%,rgba(18,20,18,0))}
#title{flex:1;min-width:0;font-size:34px;line-height:48px;font-weight:700;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.sub #title{font-size:24px;line-height:44px;font-weight:600}
#hact{display:flex;align-items:center;gap:12px}
#hb{display:none;margin-left:-8px;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--s1);place-items:center;transition:background .2s,transform .15s}
body.sub #hb{display:grid}#hb:active{background:var(--s3);transform:scale(.95)}
.hbtn,.avatar,.rbtn{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--s1);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--fx);font-weight:600;transition:background .2s,transform .15s}
.hbtn{gap:8px;height:44px;padding:0 18px 0 14px;border-radius:22px;font-size:14px}.hbtn svg{width:20px;height:20px}
.avatar{width:48px;height:48px;border-radius:50%;font-size:20px;font-weight:500;color:var(--t2)}
.rbtn{flex-direction:column;gap:4px;width:68px;height:68px;border-radius:22px;font-size:12px;font-weight:500;color:var(--t2)}.rbtn svg{width:28px;height:28px;color:var(--t1)}
.hbtn:active,.avatar:active,.rbtn:active{background:var(--s3);transform:scale(.96)}
#view{padding:8px 20px calc(var(--bot) + 120px)}
body.form #view{padding-bottom:calc(var(--bot) + 128px)}
/* нижнее меню: плавающая «таблетка» */
.tabs{position:fixed;left:16px;right:16px;bottom:calc(var(--bot) + 12px);z-index:20;display:flex;height:72px;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:var(--s1);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--fx)}
.tab{position:relative;flex:1;min-width:0;display:grid;place-items:center;border:0;background:none;color:var(--t3);transition:color .2s,transform .15s}
.tab svg{width:28px;height:28px;transition:transform .3s var(--ease)}
.tab+.tab::before{content:"";position:absolute;left:0;top:50%;width:1px;height:28px;background:var(--line);transform:translateY(-50%)}
.tab.on{color:var(--t1)}.tab.on svg{transform:scale(1.22);stroke-width:1.9}
.tab:active{transform:scale(.93);color:var(--t1)}
body.form .tabs,body.noauth .tabs,body.noauth .top,body.noauth .act{display:none}
.act{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;padding:40px 20px calc(var(--bot) + 16px);background:linear-gradient(rgba(18,20,18,0),rgba(18,20,18,.94) 50%)}
body.form .act{display:block}
/* главная: карточка склада */
.stock{margin-top:0;padding:24px 20px 20px;border:1px solid var(--line);border-radius:32px;background:var(--s1);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--fx)}
.lbl{color:var(--t2);font-size:13px;line-height:20px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.stock .lbl{padding:0 4px}
.gauge{position:relative;max-width:300px;margin:20px auto 24px}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.g-t,.g-f{fill:none;stroke-width:10;stroke-linecap:round}
.g-t{stroke:rgba(255,255,255,.1)}
.g-f{stroke:var(--wood);stroke-dasharray:100;stroke-dashoffset:100;opacity:0;transition:stroke-dashoffset 1.1s var(--ease),opacity .3s}
.gv{position:absolute;left:0;right:0;bottom:0;text-align:center}
.big{margin:8px 0;font-family:var(--serif);font-variant-numeric:lining-nums;font-feature-settings:"lnum";font-size:56px;line-height:1;font-weight:500;letter-spacing:-.01em;color:var(--wood)}
.gv .big{margin:0;font-size:76px}
.gs{margin-top:6px;color:var(--t2);font-size:15px;line-height:20px}
.meta{display:flex;flex-wrap:wrap;gap:0 16px;color:var(--t2);font-size:14px}
#hd>.meta{justify-content:center;margin-top:20px;font-size:13px}
#ssum{margin:8px 0}
/* быстрые действия внутри карточки */
.qa{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px}
.qa-b{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;padding:26px 4px 12px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);color:var(--t1);font-size:15px;line-height:1.2;font-weight:400;text-align:center;transition:background .2s,border-color .2s,transform .15s}
.qa-b .dot{position:absolute;top:12px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--c);box-shadow:0 0 12px 1px var(--c)}
.qa-b svg{width:28px;height:28px;color:var(--t2)}
.qa-b:active{background:rgba(255,255,255,.14);border-color:var(--line2);transform:scale(.97)}
/* список пород */
.spl{margin:4px 4px 0}
.lg{display:grid;grid-template-columns:1fr auto 104px;align-items:baseline;gap:12px;padding:9px 4px;font-size:20px;line-height:28px;box-shadow:inset 0 -1px 0 var(--line)}
.lg:last-child{box-shadow:none}.lg>span:first-child{color:var(--t1)}
.lg .pc{text-align:right}.lg b{font-weight:400;text-align:right;white-space:nowrap}
.ld b{font-weight:600;text-align:right}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:36px 0 8px}
.sh h2{font-size:20px;line-height:28px;font-weight:600}
.lnk{border:0;background:none;padding:8px 0 8px 16px;color:var(--wood);font-size:14px;font-weight:500}
.ld{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;box-shadow:inset 0 -1px 0 var(--line)}.ld>span:first-child,.ld>div>span:first-child{color:var(--t2)}
/* списки: строки без карточек */
.li{display:grid;grid-template-columns:1fr auto;gap:0 16px;width:calc(100% + 40px);margin:0 -20px;padding:16px 20px;border:0;border-radius:0;background-color:transparent;background-image:linear-gradient(var(--line),var(--line));background-size:calc(100% - 40px) 1px;background-position:center bottom;background-repeat:no-repeat;color:inherit;text-align:left;transition:background-color .2s}
button.li:active{background-color:rgba(255,255,255,.06)}
.li-m,.li-e{display:flex;flex-direction:column;min-width:0}.li-e{text-align:right;align-items:flex-end}
.li-t{font-weight:500}.li-v{font-weight:600}.li-s{color:var(--t2);font-size:14px}
.li-l{grid-column:1/-1;display:grid;gap:4px;margin-top:8px;color:var(--t2);font-size:14px}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 0;font-size:14px;font-weight:600;color:var(--t2)}
.grp b{font-weight:600}#view>section:first-child>.grp,#jl>section:first-child>.grp{margin-top:8px}
.st{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500}.st i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.empty{padding:48px 0;text-align:center;color:var(--t2)}.empty b{display:block;margin-bottom:4px;color:var(--t1);font-weight:500}
.empty .btn{width:auto;margin:24px auto 0;padding:0 32px}
.sk{height:56px;margin-bottom:8px;border-radius:20px;background:var(--s1);animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.5}}
/* управление */
.srch{display:flex;align-items:center;gap:8px;height:52px;padding:0 18px;margin-bottom:16px;border:1px solid var(--line);border-radius:20px;background:var(--s1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);color:var(--t3);transition:border-color .2s}
.srch:focus-within{border-color:var(--line2)}.srch svg{width:20px;height:20px}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--t1)}.srch input::placeholder{color:var(--t3)}
.seg{display:flex;gap:4px;padding:4px;margin-bottom:16px;border:1px solid var(--line);border-radius:20px;background:var(--s1)}
.seg button{flex:1;min-height:42px;border:0;border-radius:16px;background:none;color:var(--t2);font-size:14px;font-weight:500;transition:background .2s,color .2s,transform .15s}
.seg button:active{transform:scale(.97)}
.seg button.on{background:rgba(255,255,255,.14);color:var(--t1);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 8px;padding:0 20px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 18px;border:1px solid var(--line);border-radius:20px;background:var(--s1);color:var(--t2);font-size:14px;font-weight:500;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--wood);border-color:var(--wood);color:var(--ink);font-weight:600}
.utabs{display:flex;gap:24px;overflow-x:auto;margin:0 -20px 8px;padding:0 20px;box-shadow:inset 0 -1px 0 var(--line);scrollbar-width:none}.utabs::-webkit-scrollbar{display:none}
.utab{position:relative;flex:none;min-height:48px;padding:0;border:0;background:none;color:var(--t2);font-size:15px;font-weight:500;transition:color .2s}
.utab.on{color:var(--t1);font-weight:600}.utab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--wood)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 24px;border:0;border-radius:22px;background:var(--wood);color:var(--ink);font-size:16px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:background .2s,transform .15s,opacity .2s}
.btn:active{background:#e0d2bd;transform:scale(.97)}.btn:disabled{opacity:.5;pointer-events:none}
.btn.ghost{background:var(--s1);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line2)}.btn.ghost:active{background:var(--s3)}
.btn svg{width:20px;height:20px}
.btn.busy::before{content:"";width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.two{display:flex;gap:8px;margin-top:24px}.two .btn{flex:1}.stackb{display:grid;gap:8px;margin-top:24px}
/* формы */
.fgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.fs{grid-column:span 2;margin:32px 0 16px;font-size:20px;font-weight:600}.fgrid>.fs:first-child{margin-top:0}
.fld{grid-column:span 2;margin-bottom:16px;min-width:0}.fld.half{grid-column:span 1}
.fld>label{display:block;margin-bottom:8px;color:var(--t2);font-size:14px;font-weight:500}
.fld input,.fld select{width:100%;height:52px;padding:0 18px;border:1px solid var(--line);border-radius:20px;outline:0;background:var(--s1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);appearance:none;-webkit-appearance:none;transition:border-color .2s,box-shadow .2s}
.fld input::placeholder{color:var(--t3)}
.fld input:focus,.fld select:focus,.num:focus-within{border-color:rgba(243,230,211,.55);box-shadow:0 0 0 3px rgba(243,230,211,.1)}
.fld select option{background:#1d201d;color:var(--t1)}
.sel{position:relative}.sel::after{content:"";position:absolute;right:20px;top:50%;width:8px;height:8px;border:solid var(--t2);border-width:0 2px 2px 0;transform:translateY(-75%) rotate(45deg);pointer-events:none}.sel select{padding-right:48px;text-overflow:ellipsis}
.num{display:flex;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--s1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:border-color .2s,box-shadow .2s}
.num input{flex:1;min-width:0;height:50px;padding:0 8px;border:0;border-radius:0;background:none;text-align:center;font-size:18px;font-weight:500;box-shadow:none!important}
.num button{width:52px;border:0;background:none;color:var(--t1);font-size:20px;transition:background .2s}.num button:active{background:var(--s3)}
@media(max-width:359px){.fld.half{grid-column:span 2}}
.fld .chips{flex-wrap:wrap;margin:12px 0 0;padding:0;overflow:visible}
.pv{display:grid;gap:16px;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.pvr{display:flex;justify-content:space-between;align-items:baseline;gap:16px}.pvr b{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--wood)}
/* шторка, уведомления */
.sheet{position:fixed;inset:0;z-index:60;visibility:hidden;transition:visibility 0s .4s}.sheet.on{visibility:visible;transition-delay:0s}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s}.sheet.on .scrim{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;padding:8px 24px calc(var(--bot) + 32px);border:1px solid var(--line);border-bottom:0;border-radius:32px 32px 0 0;background:rgba(30,34,30,.8);-webkit-backdrop-filter:blur(30px) saturate(1.3);backdrop-filter:blur(30px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 -16px 48px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .4s var(--ease)}
.sheet.on .panel{transform:none}.grab{width:40px;height:4px;margin:8px auto 24px;border-radius:2px;background:var(--t3);opacity:.5}
.panel h3{margin-bottom:8px;font-size:22px;line-height:30px;font-weight:600}
.dl{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}.dl:last-of-type{border-bottom:0}.dl b{font-weight:500}
.srow{display:flex;align-items:center;gap:16px;width:100%;margin-bottom:8px;padding:16px;border:1px solid var(--line);border-radius:22px;background:var(--s1);text-align:left;transition:background .2s,transform .15s}
.srow:active{background:var(--s3);transform:scale(.98)}.srow .e{display:grid;place-items:center;color:var(--wood)}.srow span:nth-child(2){flex:1}.srow b{display:block;font-weight:500}.srow small{color:var(--t2);font-size:14px}.srow>svg{color:var(--t3)}.srow.off,.srow:disabled{opacity:.5;pointer-events:none}
#toast{position:fixed;top:calc(var(--top) + 8px);left:50%;z-index:99;display:flex;gap:12px;width:max-content;max-width:min(92vw,360px);padding:12px 18px;border:1px solid var(--line2);border-radius:22px;background:rgba(30,34,30,.86);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:14px;font-weight:500;transform:translate(-50%,-160%);transition:transform .4s var(--ease)}
#toast.on{transform:translate(-50%,0)}#toast::before{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:700;color:var(--ink)}
#toast.ok::before{content:"✓";background:#7fd18b}#toast.err::before{content:"!";background:var(--err)}
/* отчёты, профиль */
.dates{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.dates .fld{grid-column:auto;margin:0}
.rev{margin-top:32px}.rev .big{margin-bottom:0;font-size:64px}
.vb{margin-top:24px}.vb-h{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--t2)}.vb-h b{color:var(--t1);font-weight:600}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;width:var(--w);height:100%;border-radius:3px;background:var(--wood);transform-origin:0 50%;animation:grow .8s var(--ease)}
@keyframes grow{from{transform:scaleX(0)}}
.who{text-align:center;padding:8px 0 24px}.who .avatar{width:80px;height:80px;margin:0 auto 16px;font-size:32px}.who h2{font-size:22px;font-weight:600}
.sw{flex:none;position:relative;width:52px;height:32px;border:1px solid var(--line2);border-radius:16px;background:var(--s3);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--t2);transition:transform .2s var(--ease),background .2s}
.sw[aria-checked=true]{background:var(--wood)}.sw[aria-checked=true]::after{transform:translateX(20px);background:var(--ink)}
/* вход */
body.noauth{overflow:hidden}body.noauth #view{padding:20px;min-height:100dvh;display:grid;place-items:center}
.login{width:100%;max-width:340px;margin:auto;padding:36px 24px 28px;border:1px solid var(--line);border-radius:32px;background:var(--s1);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--fx);text-align:center}
.login .logo{display:grid;place-items:center;margin-bottom:24px;color:var(--wood)}.login .logo svg{width:48px;height:48px;stroke-width:1.4}
.login h1{font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.02em}.login .sub{margin:8px 0 32px;color:var(--t2);font-size:14px}
.login .fld{text-align:left}.login .btn{margin-top:8px}
/* запасные варианты */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.stock,.tabs,.login,.hbtn,.avatar,.rbtn,.panel,#toast{background:rgba(34,38,34,.94)}}
html.lite *,html.lite *::before,html.lite *::after{animation:none!important;transition:none!important}
html.lite .stock,html.lite .tabs,html.lite .login,html.lite .hbtn,html.lite .avatar,html.lite .rbtn,html.lite .panel,html.lite #toast{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(34,38,34,.92)}
html.lite body::after{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="noauth">
<header class="top">
  <button id="hb" data-a="back" aria-label="Назад"></button>
  <h1 id="title">Лесопилка</h1>
  <div id="hact"></div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Разделы"></nav>
<div class="act"><button class="btn" id="ok" data-a="ok"></button></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="scrim" data-a="no"></div><div class="panel"><div class="grab"></div><div id="sb"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const tg = window.Telegram.WebApp, inTg = !!tg.initData;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF = {};
/* Длина в метрах: 6000 -> «6 м», 4500 -> «4,5 м» */
const lenM = mm => fmt(mm / 1000, 2) + ' м';
/* Доска по-человечески: «Доска 50×150 · 6 м · Сосна, сорт 1» (без технических номеров) */
const boardTitle = b => `Доска ${b.height_mm}×${b.width_mm}`;
const boardLabel = b => `${boardTitle(b)} · ${lenM(b.length_mm)} · ${b.species || 'порода не указана'}${b.grade ? ', сорт ' + b.grade : ''}`;
const fmt = (n, d = 1) => (NF[d] || (NF[d] = new Intl.NumberFormat('ru-RU', {maximumFractionDigits: d}))).format(+n || 0);
const sum = (a, k) => a.reduce((s, x) => s + (+x[k] || 0), 0);
const pad = n => String(n).padStart(2, '0'), ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const ST = {new: 'Новый', in_progress: 'В работе', completed: 'Завершён', canceled: 'Отменён'};
const ROLE = {manager: 'Руководитель', master: 'Мастер', worker: 'Сотрудник'};
/* палитра графиков — внутри дизайн-системы: blueprint blue, violet, ice, teal, signal, ember */
const PAL = ['#b6d9fc', '#8a63f5', '#98c0ef', '#269684', '#027dea', '#e46d4c'];
const ICP = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>', check: '<path d="M5 12l5 5L20 7"/>',
  file: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
  back: '<path d="M15 5l-7 7 7 7"/>', chev: '<path d="M9 5l7 7-7 7"/>',
  arrival: '<path d="M1 6h13v10H1z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  sawing: '<path d="M12 2l10 5-10 5L2 7z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/>',
  order: '<path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h6"/>',
  send: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  download: '<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  ok: '<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>',
  warn: '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/>',
  trend: '<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',
  journal: '<rect x="4" y="3" width="16" height="18" rx="3.5"/><path d="M8.5 9h7M8.5 14h7"/>',
  tractor: '<circle cx="6.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="18" r="2"/><path d="M10 16.5h6.5M4 13V6h5l1.6 4H16a3 3 0 013 3v3"/><path d="M14 10V4h3"/>',
  cart: '<circle cx="9" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/><path d="M2 3h3l2.6 11.2a1.8 1.8 0 001.8 1.4h8.2a1.8 1.8 0 001.8-1.4L21 7H6"/>',
  mark: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="3"/>',
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICP[n] || ''}</svg>`;

tg.ready(); tg.expand();
/* тема: всегда midnight — кастомная палитра является основной темой приложения */
function theme() {
  document.documentElement.dataset.t = 'dark';
  try { tg.setHeaderColor('#121412'); tg.setBackgroundColor('#121412'); } catch (e) {}
}
theme(); tg.onEvent('themeChanged', theme);
try { tg.MainButton.hide(); } catch (e) {}


/* ---------- экономный режим ---------- */
let LITE = null; try { LITE = localStorage.getItem('lite'); } catch (e) {}
document.documentElement.classList.toggle('lite', LITE === 'on');
const isLite = () => document.documentElement.classList.contains('lite');
function setLite(on, auto) {
  document.documentElement.classList.toggle('lite', on);
  if (!auto) { LITE = on ? 'on' : 'off'; try { localStorage.setItem('lite', LITE); } catch (e) {} }
}
/* Автоопределение: если сразу после входа большинство кадров медленнее ~30 к/с, включаем экономный режим на этот сеанс. */
function perfProbe() {
  if (LITE !== null || isLite()) return;
  let n = 0, last = 0, slow = 0;
  const step = t => {
    if (last) { n++; if (t - last > 36) slow++; }
    last = t;
    if (n < 45) requestAnimationFrame(step);
    else if (slow > 20) { setLite(true, true); toast('Включён экономный режим для плавной работы'); }
  };
  setTimeout(() => requestAnimationFrame(step), 1500);
}

/* ---------- состояние и утилиты ---------- */
const S = {role: 'worker', name: '', tab: 'home', cur: 'login', stack: [], wt: 'boards', wq: '', wsp: '', of: 'all', oq: '', range: 'month'};
let CFG = {pdf_send: true}; // настройки с сервера (/config)
const D = {boards: [], logs: [], orders: [], con: {}};
let MEM = {}; try { MEM = JSON.parse(localStorage.getItem('mem') || '{}'); } catch (e) {}
const mem = (k, v) => { MEM[k] = v; try { localStorage.setItem('mem', JSON.stringify(MEM)); } catch (e) {} };
const hap = t => { try { tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };
const notify = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const token = () => localStorage.getItem('jwt_token');
const jwt = () => { try { return JSON.parse(decodeURIComponent(atob(token().split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''))); } catch (e) { return null; } };
const uid = () => jwt()?.user_id || 1;
const sk = n => '<div class="sk"></div>'.repeat(n);

let tt;
function toast(m, k = 'ok') { const t = $('#toast'); t.className = k + ' on'; t.textContent = m; clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2900); }

async function api(path, opts = {}) {
  const headers = {'Content-Type': 'application/json', ...(opts.headers || {})};
  if (token()) headers.Authorization = 'Bearer ' + token();
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 15000);
  let r, text;
  try {
    r = await fetch('/api/v1' + path, {...opts, headers, signal: controller.signal});
    text = await r.text();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Сервер долго не отвечает. Проверьте соединение и повторите попытку.');
    throw new Error('Не удалось связаться с сервером. Проверьте подключение и повторите попытку.');
  } finally { clearTimeout(timer); }
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
  if (!r.ok) {
    const supplied = data && (data.message || data.error || data.detail);
    const plainMessage = !data && text.trim() ? text.trim() : null;
    if (r.status === 401 || r.status === 403) throw new Error(supplied || plainMessage || 'Нет доступа. Возможно, нужно войти снова.');
    if (r.status >= 500) throw new Error(supplied || plainMessage || 'На сервере произошла ошибка. Попробуйте позже.');
    throw new Error(supplied || plainMessage || (r.status === 400 ? 'Проверьте введённые данные.' : `Не удалось выполнить запрос (${r.status}).`));
  }
  if (text && data === null) throw new Error('Сервер вернул некорректный ответ. Попробуйте позже.');
  return data;
}
const safe = async u => { try { return (await api(u)) || []; } catch (e) { toast(e.message, 'err'); return null; } };
async function loadConfig() { try { const c = await api('/config'); if (c) CFG = {...CFG, ...c}; } catch (e) { /* необязательная конфигурация: используются значения по умолчанию */ } }
async function loadStock() { const [b, l] = await Promise.all([safe('/boards'), safe('/logs')]); if (b) D.boards = b; if (l) D.logs = l; return !!b && !!l; }
async function ensureCon() { if (Object.keys(D.con).length) return true; const list = await safe('/contractors'); if (!list) return false; list.forEach(c => D.con[c.id] = c.name); return true; }

function countUp(root = $('#view')) {
  const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
  $$('[data-n]', root).forEach(el => {
    const n = +el.dataset.n, d = +el.dataset.d || 0, u = el.dataset.u || '', t0 = performance.now();
    const f = t => { const k = still ? 1 : Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(n * e, d) + u; if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}

/* ---------- шторка и подтверждение ---------- */
let ASK = null;
const sheet = html => { $('#sb').innerHTML = html; $('#sheet').classList.add('on'); };
const closeSheet = () => $('#sheet').classList.remove('on');
function ask(e, title, text, ok) {
  return new Promise(res => {
    ASK = res;
    sheet(`<h3>${esc(title)}</h3><p class="mut">${esc(text)}</p>
      <div class="two"><button class="btn ghost" data-a="no">Отмена</button><button class="btn" data-a="yes">${esc(ok)}</button></div>`);
  });
}
const settle = v => { closeSheet(); if (ASK) { const r = ASK; ASK = null; r(v); } };

/* ---------- навигация ---------- */
const TABS = ['home', 'stock', 'orders', 'journal', 'stats'];
const TT = {stock: 'Склад', orders: 'Заказы', journal: 'Журнал', stats: 'Отчёты', profile: 'Профиль'};
const canOrd = () => S.role === 'manager' || S.role === 'master';
const jSegs = () => [canOrd() && ['arrivals', 'Приходы'], S.role !== 'master' && ['production', 'Распилы'], canOrd() && ['sales', 'Продажи']].filter(Boolean);

function buildTabs() {
  const t = [['home', 'home', 'Главная'], ['stock', 'box', 'Склад']];
  if (canOrd()) t.push(['orders', 'order', 'Заказы']);
  t.push(['journal', 'journal', 'Журнал']);
  $('#tabs').innerHTML = t.map(x => `<button class="tab" data-a="go" data-v="${x[0]}" aria-label="${x[2]}" title="${x[2]}">${ic(x[1])}</button>`).join('');
}
const hbtn = (k, l) => `<button class="hbtn" data-a="new" data-v="${k}">${ic('plus')}${l}</button>`;
function setAct(v) {
  $('#hact').innerHTML = v === 'home' ? `${S.role === 'manager' ? `<button class="rbtn" data-a="go" data-v="stats" aria-label="Отчёты">${ic('chart')}<span>Отчёты</span></button>` : ''}<button class="avatar" data-a="go" data-v="profile" aria-label="Профиль">${esc((S.name || '?')[0].toUpperCase())}</button>`
    : v === 'orders' ? hbtn('order', 'Заказ')
    : v === 'journal' ? (S.jt === 'arrivals' ? hbtn('arrival', 'Приход') : S.jt === 'production' ? hbtn('sawing', 'Распил') : '') : '';
}
function go(v, p) {
  if (TABS.includes(v)) { S.tab = v; S.stack = []; } else S.stack.push(S.cur);
  show(v, p);
}
function back() { show(S.stack.pop() || S.tab); }
function show(v, p) {
  S.cur = v;
  const f = FORMS[v], sub = !!f || v === 'profile';
  document.body.classList.toggle('form', !!f);
  document.body.classList.toggle('sub', sub);
  $('#title').textContent = f ? f.t : v === 'home' ? 'Лесопилка' : TT[v] || 'Лесопилка';
  setAct(v);
  $$('.tab').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); });
  try { sub ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
  scrollTo(0, 0);
  if (f) vForm(v, p); else ({home: vHome, stock: vStock, orders: vOrders, journal: vJournal, stats: vStats, profile: vProfile}[v] || (() => {}))();
}
tg.BackButton.onClick(back);
$('#hb').innerHTML = ic('back');

/* ---------- помощники отображения ---------- */
const SPX = ['#d8c7a1', '#9fb3a0', '#c49a76', '#cfd3d8', '#8a7a5e', '#7c8799'], SPN = {'сосна': 0, 'ель': 1, 'лиственница': 2, 'берёза': 3, 'дуб': 4};
const spc = (n, i) => SPX[SPN[String(n).toLowerCase()] ?? i % SPX.length];
const li = (t, s, v, s2, o = {}) => { const tag = o.a ? 'button' : 'div'; return `<${tag} class="li"${o.a ? ` data-a="${o.a}" data-v="${esc(o.d)}"` : ''}><span class="li-m"><span class="li-t">${t}</span><span class="li-s">${s}</span></span><span class="li-e"><span class="li-v">${v}</span><span class="li-s">${s2}</span></span>${o.lines ? `<span class="li-l">${o.lines}</span>` : ''}</${tag}>`; };
const grp = (h, b, rows) => `<section><h2 class="grp"><span>${h}</span>${b ? `<b>${b}</b>` : ''}</h2>${rows}</section>`;
const fail = (m, v) => `<div class="empty"><b>${m}</b><button class="btn ghost" data-a="go" data-v="${v}">Повторить</button></div>`;
const none = (t, s) => `<div class="empty"><b>${t}</b>${s ? `<span>${s}</span>` : ''}</div>`;
const dayKey = s => { if (!s) return ''; const d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T00:00:00') : new Date(s); return isNaN(d) ? '' : ymd(d); };
const dayLabel = k => {
  if (!k) return 'Без даты';
  const n = new Date(), d = new Date(k + 'T00:00:00');
  if (k === ymd(n)) return 'Сегодня';
  if (k === ymd(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1))) return 'Вчера';
  return d.toLocaleDateString('ru-RU', d.getFullYear() === n.getFullYear() ? {day: 'numeric', month: 'long'} : {day: 'numeric', month: 'long', year: 'numeric'});
};
const byDay = (list, kf, rf) => { const g = new Map(); list.forEach(x => { const k = dayKey(kf(x)); if (!g.has(k)) g.set(k, []); g.get(k).push(x); }); return [...g].map(([k, a]) => grp(dayLabel(k), '', a.map(rf).join(''))).join(''); };
const lines = a => a.map(l => `<span>${esc(l)}</span>`).join('');
const isOpen = o => o.status !== 'completed' && o.status !== 'canceled';
const STC = {new: '#d8c7a1', in_progress: '#9db8d8', completed: '#86d4ae', canceled: '#e8a29a'};
const stl = s => `<span class="st" style="--c:${STC[s] || '#a1a1aa'}"><i></i>${esc(ST[s] || s)}</span>`;
const odate = (o, f) => { const d = o.created_at ? new Date(o.created_at) : null; return d && !isNaN(d) ? d.toLocaleDateString('ru-RU', f) : ''; };
const oRow = o => li(`Заказ №${esc(o.id)}`, esc(D.con[o.contractor_id] || 'Клиент №' + o.contractor_id), stl(o.status), esc(odate(o, {day: 'numeric', month: 'short'})), {a: 'order', d: o.id});

/* ---------- главный экран ---------- */
function rng(r) {
  const e = new Date(), s = new Date();
  if (r === 'week') s.setDate(s.getDate() - 6); else if (r === 'month') s.setDate(1); else if (r === 'year') { s.setMonth(0); s.setDate(1); }
  return [ymd(s), ymd(e)];
}
const sQ = (a, b) => `/statistics?start_date=${encodeURIComponent(a)}&end_date=${encodeURIComponent(b)}`;

/* Шкала индикатора: сколько м³ соответствует 100% дуги. null = подбирается автоматически. */
const GAUGE_MAX = null;
const gaugeMax = v => { if (GAUGE_MAX) return GAUGE_MAX; if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); return [1, 1.5, 2, 3, 5, 7.5, 10].map(k => k * p).find(x => x >= v) || 10 * p; };
const QA = {arrival: ['tractor', '#f4a261'], sawing: ['sawing', '#7b82f0'], order: ['cart', '#7fd18b']};

async function vHome() {
  const v = $('#view'), m = S.role === 'manager';
  const qa = [['arrival', 'Приход<br>леса'], ['sawing', 'Распиловка'], canOrd() && ['order', 'Новый<br>заказ']].filter(Boolean);
  v.innerHTML = `<section class="stock"><p class="lbl">Готовая продукция на складе</p>
      <div class="gauge"><svg viewBox="0 0 300 160" aria-hidden="true"><path class="g-t" d="M20 150A130 130 0 0 1 280 150"/><path class="g-f" id="gf" pathLength="100" d="M20 150A130 130 0 0 1 280 150"/></svg>
        <div class="gv"><div class="big" id="gbig"><span>0</span></div><div class="gs" id="gs">&nbsp;</div></div></div>
      <div class="qa" style="--n:${qa.length}">${qa.map(([k, l]) => `<button class="qa-b" style="--c:${QA[k][1]}" data-a="new" data-v="${k}"><i class="dot"></i>${ic(QA[k][0])}<span>${l}</span></button>`).join('')}</div></section>
    <div id="hd" style="margin-top:20px">${sk(3)}</div>`;
  const [, orders, st] = await Promise.all([loadStock(), canOrd() ? safe('/orders') : [], m ? api(sQ(...rng('month'))).catch(e => { toast(e.message, 'err'); return null; }) : null, ensureCon()]);
  if (S.cur !== 'home' || !$('#hd')) return;
  if (orders) D.orders = orders;
  const bv = sum(D.boards, 'volume_m3'), bc = sum(D.boards, 'count'), lv = sum(D.logs, 'volume_m3');
  const open = D.orders.filter(isOpen);
  const by = {}; D.boards.forEach(b => { const k = b.species || '—'; by[k] = (by[k] || 0) + (+b.volume_m3 || 0); });
  const sp = Object.entries(by).sort((a, b) => b[1] - a[1]), rest = sp.slice(5).reduce((n, x) => n + x[1], 0);
  const leg = [...sp.slice(0, 5).map(([n, x]) => [n, x]), ...(rest > 0 ? [['Прочее', rest]] : [])];
  /* индикатор */
  const pct = Math.max(0, Math.min(100, bv / gaugeMax(bv) * 100)), gf = $('#gf'), txt = fmt(bv, 2);
  gf.style.opacity = pct > 0.5 ? 1 : 0; gf.style.strokeDashoffset = 100 - pct;
  const gb = $('#gbig'); gb.style.fontSize = txt.length <= 5 ? '' : txt.length <= 7 ? '60px' : '46px';
  gb.innerHTML = `<span data-n="${bv}" data-d="2">0</span>`;
  $('#gs').textContent = `${txt} м кубических`;
  $('#hd').innerHTML = `${leg.length && bv > 0 ? `<div class="spl">${leg.map(([n, x]) => `<div class="lg"><span>${esc(n)}</span><span class="pc">${fmt(x / bv * 100, 0)}%</span><b>${fmt(x, 2)} м³</b></div>`).join('')}</div>` : ''}
    <div class="meta"><span>${fmt(bc, 0)} шт</span><span>${D.boards.length} позиций</span><span>Сырьё ${fmt(lv, 1)} м³</span></div>
    ${m && st ? `<div class="sh"><h2>За месяц</h2></div>
      <div class="ld"><span>Выручка</span><b data-n="${st.total_sales_amount || 0}" data-u=" ₽">0</b></div>
      <div class="ld"><span>Продано</span><b data-n="${st.total_sales_volume || 0}" data-d="1" data-u=" м³">0</b></div>
      <div class="ld"><span>Распилено</span><b data-n="${st.total_logs_sawed_volume || 0}" data-d="1" data-u=" м³">0</b></div>` : ''}

const KEYS = new WeakMap();

         x.height_mm != null ? `доска ${x.height_mm}×${x.width_mm} ${x.length_mm}` : `бревно ø${x.diameter_mm} ${x.length_mm}`,
         x.arrival_id != null ? 'партия ' + x.arrival_id : ''].filter(Boolean).join(' ').toLowerCase();
    KEYS.set(x, k);
  }
  return k;
};

function stockList() {

      const vol = v.cnt === b.count ? b.volume_m3 : b.volume_m3 / b.count * v.cnt;
      return `<div class="pvr"><span class="hint">Объём заказа</span><b>${fmt(vol, 3)} м³</b></div><div class="pvr"><span class="hint">Сумма</span><b>${fmt(vol * v.price, 0)} ₽</b></div>
        <div class="pvr"><span class="hint">На складе</span><b style="font-size:16px;color:${v.cnt > b.count ? 'var(--err)' : 'inherit'}">${b.count} шт${v.cnt > b.count ? ' · не хватает' : ''}</b></div>`;
    },
    req: v => !Object.keys(D.con).length ? 'Не загружен список клиентов' : !v.con ? 'Выберите клиента' : !v.board ? 'Выберите доску' : v.cnt <= 0 ? 'Укажите количество' : null,
    sum: v => { const b = D.boards.find(x => x.id == v.board); return `${b ? boardTitle(b) + ' · ' + lenM(b.length_mm) + ': ' : ''}${fmt(v.cnt, 0)} шт по ${fmt(v.price, 0)} ₽ за м³, клиент: ${D.con[v.con] || 'не выбран'}`; },
    mem: ['con', 'price'],
    body: v => ({contractor_id: +v.con, status: 'new', delivery_price: 0, extra_price: 0, items: [{board_id: +v.board, count: Math.round(v.cnt), price: v.price}]})
  }
};
let FK = null;
const fe = k => $(`input[data-k="${k}"],select[data-k="${k}"]`);
const fval = (f, x) => (f.m && MEM[f.k] != null) ? MEM[f.k] : (x ?? f.v ?? '');
function fld(f) {
  let c;
  if (f.t === 'sel') c = `<div class="sel"><select data-k="${f.k}">${(f.o || []).map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select></div>`;
  else if (f.t === 'num') c = `<div class="num"><button type="button" class="rip" data-a="st" data-k="${f.k}" data-v="-1">−</button><input data-k="${f.k}" inputmode="decimal" value="${esc(fval(f))}"><button type="button" class="rip" data-a="st" data-k="${f.k}" data-v="1">+</button></div>`;
  else if (f.t === 'txt') c = `<input data-k="${f.k}" value="${esc(fval(f))}" placeholder="${esc(f.ph || '')}" autocomplete="off">`;
  else c = '';
  const ch = f.c ? `<div class="chips">${f.c.map(x => `<button type="button" class="chip rip" data-a="${f.t === 'pre' ? 'size' : 'chip'}" data-k="${f.k}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : '';
  return `${f.h ? `<h3 class="fs">${f.h}</h3>` : ''}<div class="fld${f.half ? ' half' : ''}"><label>${f.l}</label>${c}${ch}</div>`;
}
function vals() {
  const v = {};
  FORMS[FK].f.forEach(f => { const el = fe(f.k); if (el) v[f.k] = f.t === 'num' ? num(el.value) : el.value.trim(); });
  return v;
}
function calcForm(fromAuto) {
  const F = FORMS[FK]; if (!F) return;
  let v = vals();
  if (F.calc && !fromAuto) { const r = F.calc(v); for (const k in r) fe(k).value = (+r[k] || 0).toFixed(3); v = vals(); }
  const pv = $('#pv'); if (pv && F.pv) pv.innerHTML = F.pv(v);
}
async function vForm(kind, p = {}) {
  const F = FORMS[kind]; FK = kind;
  $('#view').innerHTML = `<div class="fgrid">${F.f.map(fld).join('')}</div>${F.pv ? '<section class="pv" id="pv"></section>' : ''}`;
  $('#ok').textContent = F.ok;
  const needs = await Promise.all([F.need.includes('con') ? ensureCon() : true, F.need.some(n => n !== 'con') ? loadStock() : true]);
  if (S.cur !== kind) return;
  if (needs.some(ok => !ok)) { $('#view').innerHTML = `<div class="empty"><b>Не удалось загрузить данные для формы</b><button class="btn ghost" data-a="retryform">Повторить</button></div>`; $('#ok').disabled = true; return; }
  $('#ok').disabled = false;
  F.f.forEach(f => {
    if (f.t !== 'sel' || !f.src) return;
    const el = fe(f.k), o = SRC[f.src]();
    el.innerHTML = o.length ? o.map(x => `<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('') : '<option value="">Нет данных</option>';
    const want = p[f.k] ?? (f.m ? MEM[f.k] : null);
    if (want != null && o.some(x => String(x[0]) === String(want))) el.value = want;
  });
  if (kind === 'sawing') syncLog();
  calcForm();
}
function syncLog() { const l = D.logs.find(x => x.id == fe('log').value); if (l) fe('lvol').value = (+l.volume_m3).toFixed(3); }
async function submitForm() {
  const F = FORMS[FK], v = vals(), e = F.req(v);
  if (e) { notify('error'); toast(e, 'err'); return; }
  if (!await ask(F.e, F.t, F.sum(v), 'Сохранить')) return;
  const b = $('#ok'); b.disabled = true; b.classList.add('busy');
  try {
    await api(F.path, {method: 'POST', body: JSON.stringify(F.body(v))});
    F.mem.forEach(k => mem(k, v[k]));
    notify('success'); toast(F.done); go(F.after);
  } catch (er) { notify('error'); toast(er.message, 'err'); }
  b.disabled = false; b.classList.remove('busy');
}

/* ---------- события ---------- */
const find = (t, id) => (t === 'boards' ? D.boards : D.logs).find(x => x.id == id);
const ACT = {
  go: v => go(v), lite: () => { setLite(!isLite()); vProfile(); }, back, yes: () => settle(true), no: () => settle(false), ok: submitForm, login, retry: tgAuth, retryform: () => vForm(FK),
  logout: () => { localStorage.removeItem('jwt_token'); S.stack = []; buildTabs(); vLogin(); $('#tabs').innerHTML = ''; },
  new: v => { closeSheet(); go(v); },
  order: v => {
    const o = D.orders.find(x => x.id == v); if (!o) return;
    sheet(`<h3>Заказ №${esc(o.id)}</h3>
      <div class="dl"><span class="mut">Клиент</span><b>${esc(D.con[o.contractor_id] || 'Клиент №' + o.contractor_id)}</b></div>
      <div class="dl"><span class="mut">Статус</span>${stl(o.status)}</div>
      <div class="dl"><span class="mut">Создан</span><b>${esc(odate(o, {day: 'numeric', month: 'long', year: 'numeric'}) || '—')}</b></div>
      <div class="stackb">${isOpen(o) ? `<button class="btn" data-a="done" data-v="${esc(o.id)}">Завершить заказ</button>` : ''}<button class="btn ghost" data-a="pdf" data-v="${esc(o.id)}">Накладная PDF</button></div>`);
  },
  jt: v => { S.jt = v; vJournal(); },
  wt: v => { S.wt = v; S.wsp = ''; vStock(false); },
  sp: v => { S.wsp = v; vStock(false); },
  of: v => { S.of = v; vOrders(false); },
  range: v => { S.range = v; vStats(); },
  item: v => {
    const [t, id] = v.split(':'), x = find(t, id); if (!x) return;
    sheet(`<h3>${t === 'boards' ? esc(boardTitle(x)) : `Бревно Ø${esc(x.diameter_mm)}`}</h3>
      <div class="dl"><span class="hint">Порода</span><b>${esc(x.species || 'не указана')}</b></div>
      <div class="dl"><span class="hint">Длина</span><b>${lenM(x.length_mm)}</b></div>
      ${t === 'boards' ? `<div class="dl"><span class="hint">Сорт</span><b>${esc(x.grade || '1')}</b></div>` : `<div class="dl"><span class="hint">Партия прихода</span><b>№${esc(x.arrival_id)}</b></div>`}
      <div class="dl"><span class="hint">Остаток</span><b>${esc(x.count)} шт</b></div>
      <div class="dl"><span class="hint">Объём</span><b>${fmt(x.volume_m3, 3)} м³</b></div>
      ${t === 'boards' && canOrd() ? `<button class="btn rip" style="margin-top:14px" data-a="mk" data-v="order:board:${x.id}">Создать заказ на эту позицию</button>` : ''}
      ${t === 'logs' ? `<button class="btn rip" style="margin-top:14px" data-a="mk" data-v="sawing:log:${x.id}">Записать распиловку из этой партии</button>` : ''}`);
  },
  mk: v => { const [f, k, id] = v.split(':'); closeSheet(); go(f, {[k]: id}); },
  done: (v, el) => ask('ok', 'Завершить заказ №' + v, 'Товары будут списаны со склада и проведены как продажа.', 'Завершить').then(ok => ok && doComplete(v, el)),
  pdf: v => pdfSheet(v), pdfsend: (v, el) => pdfDo('send', v, el), pdfdl: (v, el) => pdfDo('dl', v, el), pdfview: (v, el) => pdfDo('view', v, el),
  chip: (v, el) => { fe(el.dataset.k).value = v; calcForm(); },
  size: v => { const [a, b] = v.split('×'); fe('th').value = a; fe('wd').value = b; calcForm(); },
  st: (v, el) => {
    const f = FORMS[FK].f.find(x => x.k === el.dataset.k), i = fe(f.k);
    i.value = Math.max(0, Math.round((num(i.value) + (+v) * (f.s || 1)) * 1000) / 1000); calcForm(f.k === FORMS[FK].auto);
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = ACT[el.dataset.a]; if (f) { hap(); f(el.dataset.v, el); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.wq = t.value; clearTimeout(DEB); DEB = setTimeout(() => stockList(false), 120); }
  else if (t.id === 'oq') { S.oq = t.value; clearTimeout(DEB); DEB = setTimeout(() => orderList(false), 120); }
  else if (t.id === 'd1' || t.id === 'd2') { S.range = 'custom'; $$('[data-a="range"]').forEach(b => b.classList.remove('on')); loadStats(); }
  else if (t.dataset.k && FK) calcForm(t.dataset.k === FORMS[FK].auto);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.k && FK) { if (FK === 'sawing' && t.dataset.k === 'log') syncLog(); calcForm(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lp') login(); });

/* ---------- старт ---------- */
if (inTg) tgAuth();
else { const j = jwt(); if (j && j.exp * 1000 > Date.now()) finish(token()); else vLogin(); }
</script>
</body>
</html>
