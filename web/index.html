<!DOCTYPE html>
<html lang="ru" data-t="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c0e">
<meta name="color-scheme" content="dark">
<title>Лесопилка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Лесопилка: тёмный «стеклянный» интерфейс. Фон: туман в оливково-серых тонах. Акцент: кремовый. */
:root{--bg:#121412;--ink:#1a1c1a;--s1:rgba(255,255,255,.06);--s2:rgba(255,255,255,.08);--s3:rgba(255,255,255,.14);
--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.22);
--t1:#f5efe6;--t2:rgba(245,239,230,.6);--t3:rgba(245,239,230,.5);--wood:#f3e6d3;--err:#f0a99f;--ease:cubic-bezier(.2,.8,.2,1);
--font:'Onest',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--serif:var(--font);
--blur:blur(22px) saturate(1.3);
--fx:inset 0 1px 0 rgba(255,255,255,.1),0 12px 40px rgba(0,0,0,.28);
--top:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + env(safe-area-inset-top,0px));
--bot:max(var(--tg-safe-area-inset-bottom,0px),env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--t1);font:16px/1.5 var(--font);font-variant-numeric:normal;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;color-scheme:dark}
/* фон: размытый туман без внешних картинок */
body::before,body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
body::before{background:
 radial-gradient(70% 26% at 72% 24%,rgba(96,112,90,.42),transparent 72%),
 radial-gradient(80% 22% at 12% 52%,rgba(74,90,70,.34),transparent 72%),
 radial-gradient(70% 20% at 88% 70%,rgba(84,100,80,.30),transparent 72%),
 radial-gradient(100% 34% at 40% 100%,rgba(62,74,60,.42),transparent 72%),
 radial-gradient(120% 60% at 50% 0%,#1a1d19,transparent 70%),var(--bg)}
body::after{opacity:.5;mix-blend-mode:screen;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.006 .011' numOctaves='4' seed='11'/><feColorMatrix values='0 0 0 0 .34 0 0 0 0 .42 0 0 0 0 .33 0 0 0 1.25 -.5'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") center/cover}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
svg{width:24px;height:24px;flex:none;stroke-width:1.75}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--wood);outline-offset:3px}
.mut,.hint{color:var(--t2)}.sm{font-size:14px}
.rip{position:relative}
/* шапка */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(var(--top) + 16px) 20px 12px;background:linear-gradient(rgba(18,20,18,.92) 55%,rgba(18,20,18,0))}
#title{flex:1;min-width:0;font-size:34px;line-height:48px;font-weight:700;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.sub #title{font-size:24px;line-height:44px;font-weight:500}
#hact{display:flex;align-items:center;gap:12px}
#hb{display:none;margin-left:-8px;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--s1);place-items:center;transition:background .2s,transform .15s}
body.sub #hb{display:grid}#hb:active{background:var(--s3);transform:scale(.95)}
.hbtn,.avatar,.rbtn{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--s1);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--fx);font-weight:500;transition:background .2s,transform .15s}
.hbtn{gap:8px;height:44px;padding:0 18px 0 14px;border-radius:22px;font-size:14px}.hbtn svg{width:20px;height:20px}
.avatar{width:48px;height:48px;border-radius:50%;font-size:20px;font-weight:500;color:var(--t2)}
.rbtn{flex-direction:column;gap:4px;width:68px;height:68px;border-radius:22px;font-size:12px;font-weight:500;color:var(--t2)}.rbtn svg{width:28px;height:28px;color:var(--t1)}
.hbtn:active,.avatar:active,.rbtn:active{background:var(--s3);transform:scale(.96)}
#view{padding:8px 20px calc(var(--bot) + 120px)}
body.form #view{padding-bottom:calc(var(--bot) + 128px)}
/* нижнее меню: плавающая «таблетка» */
.tabs{position:fixed;left:16px;right:16px;bottom:calc(var(--bot) + 12px);z-index:20;display:flex;height:72px;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:var(--s1);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--fx)}
.tab{position:relative;flex:1;min-width:0;display:grid;place-items:center;border:0;background:none;color:var(--t3);transition:color .2s,transform .15s}
.tab svg{width:28px;height:28px;transition:transform .3s var(--ease)}
.tab+.tab::before{content:"";position:absolute;left:0;top:50%;width:1px;height:28px;background:var(--line);transform:translateY(-50%)}
.tab.on{color:var(--t1)}.tab.on svg{transform:scale(1.22);stroke-width:1.9}
.tab:active{transform:scale(.93);color:var(--t1)}
body.form .tabs,body.noauth .tabs,body.noauth .top,body.noauth .act{display:none}
.act{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;padding:40px 20px calc(var(--bot) + 16px);background:linear-gradient(rgba(18,20,18,0),rgba(18,20,18,.94) 50%)}
body.form .act{display:block}
/* главная: карточка склада */
.stock{margin-top:0;padding:24px 20px 20px;border:1px solid var(--line);border-radius:32px;background:var(--s1);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--fx)}
.lbl{color:var(--t2);font-size:13px;line-height:20px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.stock .lbl{padding:0 4px}
.gauge{position:relative;max-width:300px;margin:20px auto 24px}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.g-t,.g-f{fill:none;stroke-width:10;stroke-linecap:round}
.g-t{stroke:rgba(255,255,255,.1)}
.g-f{stroke:var(--wood);stroke-dasharray:100;stroke-dashoffset:100;opacity:0;transition:stroke-dashoffset 1.1s var(--ease),opacity .3s}
.gv{position:absolute;left:0;right:0;bottom:0;text-align:center}
.big{margin:8px 0;font-family:var(--serif);font-variant-numeric:lining-nums;font-feature-settings:"lnum";font-size:56px;line-height:1;font-weight:500;letter-spacing:-.01em;color:var(--wood)}
.gv .big{margin:0;font-size:76px}
.gs{margin-top:6px;color:var(--t2);font-size:15px;line-height:20px}
.meta{display:flex;flex-wrap:wrap;gap:0 16px;color:var(--t2);font-size:14px}
#hd>.meta{justify-content:center;margin-top:20px;font-size:13px}
#ssum{margin:8px 0}
/* быстрые действия внутри карточки */
.qa{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px}
.qa-b{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;padding:26px 4px 12px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);color:var(--t1);font-size:15px;line-height:1.2;font-weight:400;text-align:center;transition:background .2s,border-color .2s,transform .15s}
.qa-b .dot{position:absolute;top:12px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--c);box-shadow:0 0 12px 1px var(--c)}
.qa-b svg{width:28px;height:28px;color:var(--t2)}
.qa-b:active{background:rgba(255,255,255,.14);border-color:var(--line2);transform:scale(.97)}
/* список пород */
.spl{margin:4px 4px 0}
.lg{display:grid;grid-template-columns:1fr auto 104px;align-items:baseline;gap:12px;padding:9px 4px;font-size:20px;line-height:28px;box-shadow:inset 0 -1px 0 var(--line)}
.lg:last-child{box-shadow:none}.lg>span:first-child{color:var(--t1)}
.lg .pc{text-align:right}.lg b{font-weight:400;text-align:right;white-space:nowrap}
.ld b{font-weight:500;text-align:right}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:36px 0 8px}
.sh h2{font-size:20px;line-height:28px;font-weight:500}
.lnk{border:0;background:none;padding:8px 0 8px 16px;color:var(--wood);font-size:14px;font-weight:500}
.ld{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;box-shadow:inset 0 -1px 0 var(--line)}.ld>span:first-child,.ld>div>span:first-child{color:var(--t2)}
/* списки: строки без карточек */
.li{display:grid;grid-template-columns:1fr auto;gap:0 16px;width:calc(100% + 40px);margin:0 -20px;padding:16px 20px;border:0;border-radius:0;background-color:transparent;background-image:linear-gradient(var(--line),var(--line));background-size:calc(100% - 40px) 1px;background-position:center bottom;background-repeat:no-repeat;color:inherit;text-align:left;transition:background-color .2s}
button.li:active{background-color:rgba(255,255,255,.06)}
.li-m,.li-e{display:flex;flex-direction:column;min-width:0}.li-e{text-align:right;align-items:flex-end}
.li-t{font-weight:500}.li-v{font-weight:500}.li-s{color:var(--t2);font-size:14px}
.li-l{grid-column:1/-1;display:grid;gap:4px;margin-top:8px;color:var(--t2);font-size:14px}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 0;font-size:14px;font-weight:500;color:var(--t2)}
.grp b{font-weight:500}#view>section:first-child>.grp,#jl>section:first-child>.grp{margin-top:8px}
.st{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500}.st i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.empty{padding:48px 0;text-align:center;color:var(--t2)}.empty b{display:block;margin-bottom:4px;color:var(--t1);font-weight:500}
.empty .btn{width:auto;margin:24px auto 0;padding:0 32px}
.sk{height:56px;margin-bottom:8px;border-radius:20px;background:var(--s1);animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.5}}
/* управление */
.srch{display:flex;align-items:center;gap:8px;height:52px;padding:0 18px;margin-bottom:16px;border:1px solid var(--line);border-radius:20px;background:var(--s1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);color:var(--t3);transition:border-color .2s}
.srch:focus-within{border-color:var(--line2)}.srch svg{width:20px;height:20px}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--t1)}.srch input::placeholder{color:var(--t3)}
.seg{display:flex;gap:4px;padding:4px;margin-bottom:16px;border:1px solid var(--line);border-radius:20px;background:var(--s1)}
.seg button{flex:1;min-height:42px;border:0;border-radius:16px;background:none;color:var(--t2);font-size:14px;font-weight:500;transition:background .2s,color .2s,transform .15s}
.seg button:active{transform:scale(.97)}
.seg button.on{background:rgba(255,255,255,.14);color:var(--t1);font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 8px;padding:0 20px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 18px;border:1px solid var(--line);border-radius:20px;background:var(--s1);color:var(--t2);font-size:14px;font-weight:500;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--wood);border-color:var(--wood);color:var(--ink);font-weight:500}
.utabs{display:flex;gap:24px;overflow-x:auto;margin:0 -20px 8px;padding:0 20px;box-shadow:inset 0 -1px 0 var(--line);scrollbar-width:none}.utabs::-webkit-scrollbar{display:none}
.utab{position:relative;flex:none;min-height:48px;padding:0;border:0;background:none;color:var(--t2);font-size:15px;font-weight:500;transition:color .2s}
.utab.on{color:var(--t1);font-weight:500}.utab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--wood)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 24px;border:0;border-radius:22px;background:var(--wood);color:var(--ink);font-size:16px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:background .2s,transform .15s,opacity .2s}
.btn:active{background:#e0d2bd;transform:scale(.97)}.btn:disabled{opacity:.5;pointer-events:none}
.btn.ghost{background:var(--s1);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line2)}.btn.ghost:active{background:var(--s3)}
.btn svg{width:20px;height:20px}
.btn.busy::before{content:"";width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.two{display:flex;gap:8px;margin-top:24px}.two .btn{flex:1}.stackb{display:grid;gap:8px;margin-top:24px}
/* формы */
.fgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.fs{grid-column:span 2;margin:32px 0 16px;font-size:20px;font-weight:500}.fgrid>.fs:first-child{margin-top:0}
.fld{grid-column:span 2;margin-bottom:16px;min-width:0}.fld.half{grid-column:span 1}
.fld>label{display:block;margin-bottom:8px;color:var(--t2);font-size:14px;font-weight:500}
.fld input,.fld select{width:100%;height:52px;padding:0 18px;border:1px solid var(--line);border-radius:20px;outline:0;background:var(--s1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);appearance:none;-webkit-appearance:none;transition:border-color .2s,box-shadow .2s}
.fld input::placeholder{color:var(--t3)}
.fld input:focus,.fld select:focus,.num:focus-within{border-color:rgba(243,230,211,.55);box-shadow:0 0 0 3px rgba(243,230,211,.1)}
.fld select option{background:#1d201d;color:var(--t1)}
.sel{position:relative}.sel::after{content:"";position:absolute;right:20px;top:50%;width:8px;height:8px;border:solid var(--t2);border-width:0 2px 2px 0;transform:translateY(-75%) rotate(45deg);pointer-events:none}.sel select{padding-right:48px;text-overflow:ellipsis}
.num{display:flex;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--s1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:border-color .2s,box-shadow .2s}
.num input{flex:1;min-width:0;height:50px;padding:0 8px;border:0;border-radius:0;background:none;text-align:center;font-size:18px;font-weight:500;box-shadow:none!important}
.num button{width:52px;border:0;background:none;color:var(--t1);font-size:20px;transition:background .2s}.num button:active{background:var(--s3)}
@media(max-width:359px){.fld.half{grid-column:span 2}}
.fld .chips{flex-wrap:wrap;margin:12px 0 0;padding:0;overflow:visible}
.pv{display:grid;gap:16px;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.pvr{display:flex;justify-content:space-between;align-items:baseline;gap:16px}.pvr b{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--wood)}
/* шторка, уведомления */
.sheet{position:fixed;inset:0;z-index:60;visibility:hidden;transition:visibility 0s .4s}.sheet.on{visibility:visible;transition-delay:0s}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s}.sheet.on .scrim{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;padding:8px 24px calc(var(--bot) + 32px);border:1px solid var(--line);border-bottom:0;border-radius:32px 32px 0 0;background:rgba(30,34,30,.8);-webkit-backdrop-filter:blur(30px) saturate(1.3);backdrop-filter:blur(30px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 -16px 48px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .4s var(--ease)}
.sheet.on .panel{transform:none}.grab{width:40px;height:4px;margin:8px auto 24px;border-radius:2px;background:var(--t3);opacity:.5}
.panel h3{margin-bottom:8px;font-size:22px;line-height:30px;font-weight:500}
.dl{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}.dl:last-of-type{border-bottom:0}.dl b{font-weight:500}
.srow{display:flex;align-items:center;gap:16px;width:100%;margin-bottom:8px;padding:16px;border:1px solid var(--line);border-radius:22px;background:var(--s1);text-align:left;transition:background .2s,transform .15s}
.srow:active{background:var(--s3);transform:scale(.98)}.srow .e{display:grid;place-items:center;color:var(--wood)}.srow span:nth-child(2){flex:1}.srow b{display:block;font-weight:500}.srow small{color:var(--t2);font-size:14px}.srow>svg{color:var(--t3)}.srow.off,.srow:disabled{opacity:.5;pointer-events:none}
#toast{position:fixed;top:calc(var(--top) + 8px);left:50%;z-index:99;display:flex;gap:12px;width:max-content;max-width:min(92vw,360px);padding:12px 18px;border:1px solid var(--line2);border-radius:22px;background:rgba(30,34,30,.86);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:14px;font-weight:500;transform:translate(-50%,-160%);transition:transform .4s var(--ease)}
#toast.on{transform:translate(-50%,0)}#toast::before{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:700;color:var(--ink)}
#toast.ok::before{content:"✓";background:#7fd18b}#toast.err::before{content:"!";background:var(--err)}
/* отчёты, профиль */
.dates{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.dates .fld{grid-column:auto;margin:0}
.rev{margin-top:32px}.rev .big{margin-bottom:0;font-size:64px}
.vb{margin-top:24px}.vb-h{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--t2)}.vb-h b{color:var(--t1);font-weight:500}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;width:var(--w);height:100%;border-radius:3px;background:var(--wood);transform-origin:0 50%;animation:grow .8s var(--ease)}
@keyframes grow{from{transform:scaleX(0)}}
.who{text-align:center;padding:8px 0 24px}.who .avatar{width:80px;height:80px;margin:0 auto 16px;font-size:32px}.who h2{font-size:22px;font-weight:500}
.sw{flex:none;position:relative;width:52px;height:32px;border:1px solid var(--line2);border-radius:16px;background:var(--s3);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--t2);transition:transform .2s var(--ease),background .2s}
.sw[aria-checked=true]{background:var(--wood)}.sw[aria-checked=true]::after{transform:translateX(20px);background:var(--ink)}
/* вход */
body.noauth{overflow:hidden}body.noauth #view{padding:20px;min-height:100dvh;display:grid;place-items:center}
.login{width:100%;max-width:340px;margin:auto;padding:36px 24px 28px;border:1px solid var(--line);border-radius:32px;background:var(--s1);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--fx);text-align:center}
.login .logo{display:grid;place-items:center;margin-bottom:24px;color:var(--wood)}.login .logo svg{width:48px;height:48px;stroke-width:1.4}
.login h1{font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.02em}.login .sub{margin:8px 0 32px;color:var(--t2);font-size:14px}
.login .fld{text-align:left}.login .btn{margin-top:8px}
/* запасные варианты */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.stock,.tabs,.login,.hbtn,.avatar,.rbtn,.panel,#toast{background:rgba(34,38,34,.94)}}
html.lite *,html.lite *::before,html.lite *::after{animation:none!important;transition:none!important}
html.lite .stock,html.lite .tabs,html.lite .login,html.lite .hbtn,html.lite .avatar,html.lite .rbtn,html.lite .panel,html.lite #toast{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(34,38,34,.92)}
html.lite body::after{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v2: сетка 4/8, шкала радиусов, типографика 12/14/16/20/34, состояния ===== */
:root{--r-card:32px;--r-btn:24px;--r-fld:20px;--r-pill:999px;--sp:20px;--gap:24px;--ok:#86d4ae;--warn:#e8c27a;--bad:#e8a29a;--hair:rgba(255,255,255,.08);
--fx:inset 0 1px 0 rgba(255,255,255,.08),0 8px 32px rgba(0,0,0,.24)}
.lbl{font-size:12px}
.gs,.li-s,.grp,.chip,.seg button,.fld>label,.hbtn,.lnk,.srow small,.utab,.sub{font-size:14px}
.sh h2,.fs,.panel h3,.who h2{font-size:20px;line-height:28px;font-weight:700}
.login h1{font-size:34px;line-height:40px;font-weight:700}
.num input{font-size:16px}.pvr b{font-size:24px}
/* шапка */
.top{padding:calc(var(--top) + 16px) var(--sp) 12px}
#view{padding:8px var(--sp) calc(var(--bot) + 120px)}
.hbtn{height:48px;padding:0 20px 0 16px;border-radius:var(--r-btn)}.hbtn svg,.rbtn svg{width:24px;height:24px}
.avatar,.rbtn,#hb{width:48px;height:48px}
.rbtn{flex-direction:row;gap:0;padding:0;border-radius:50%;color:var(--t1)}.rbtn span{display:none}
/* нижняя навигация */
.tabs{left:var(--sp);right:var(--sp);align-items:center;gap:4px;padding:0 8px}
.tab+.tab::before{display:none}
.tab{height:56px;border-radius:var(--r-pill)}
.tab.on{color:var(--wood);background:var(--s2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.tab.on svg{transform:none;stroke-width:1.75}
/* главная */
.stock{padding:var(--sp);border-radius:var(--r-card)}
.gauge{margin:16px auto 8px}
.gm{margin:0;text-align:center;color:var(--t2);font-size:12px;line-height:16px;text-wrap:balance}
#hdl{display:flex;justify-content:center;margin-top:12px}#hdl:empty{display:none}
.dlt{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px 0 8px;border-radius:var(--r-pill);background:var(--s2);font-size:14px;font-weight:500}
.dlt svg{width:20px;height:20px}.dlt.up{color:var(--ok)}.dlt.dn{color:var(--bad)}
.qa{gap:8px;margin-top:var(--sp)}
.qa-b{min-height:104px;border:0;border-radius:var(--r-btn);background:var(--s2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);font-size:14px}
.qa-b svg{width:24px;height:24px}.qa-b .dot{box-shadow:none;opacity:.9}
#hd{margin-top:var(--gap)}
.spl{margin:0 4px}
.lg{display:block;padding:12px 0;font-size:16px;line-height:24px}
.lg-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lg-n{font-weight:500;overflow-wrap:anywhere}.lg-h b{font-weight:500;white-space:nowrap;text-align:right}
.pb{display:block;height:4px;margin:8px 0;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.pb i{display:block;width:var(--w);height:100%;border-radius:2px;background:var(--c,var(--wood));transform-origin:0 50%;animation:grow .8s var(--ease)}
.lg-f{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;color:var(--t3);font-size:14px;line-height:20px}
.tag{display:inline-flex;align-items:center;justify-self:start;height:24px;padding:0 8px;border-radius:var(--r-pill);background:rgba(232,194,122,.12);color:var(--warn);font-size:12px;font-weight:500}
.sh{margin:var(--gap) 0 8px}.grp{margin:var(--gap) 0 0}
.tiles,.tots{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}.tots{margin:0 0 16px}
.tile,.tt{display:flex;flex-direction:column;gap:4px;min-width:0;border:1px solid var(--hair);border-radius:var(--r-fld);background:var(--s1)}
.tile{padding:16px 12px}.tt{padding:12px}
.tl,.tt-l{font-size:12px;line-height:16px;color:var(--t2)}.ts{font-size:12px;line-height:16px;color:var(--t3)}
.tv{font-family:var(--serif);font-size:28px;line-height:32px;font-weight:500;color:var(--wood);font-variant-numeric:lining-nums}
.tt-v{font-family:var(--serif);font-size:clamp(18px,5.4vw,22px);line-height:28px;font-weight:500;color:var(--wood);font-variant-numeric:lining-nums;white-space:nowrap}
.ra{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;box-shadow:inset 0 -1px 0 var(--line)}.ra:last-child{box-shadow:none}
.ra-i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--s2);color:var(--wood)}.ra-i svg{width:20px;height:20px}
.ra-m{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}.ra-e{display:flex;flex-direction:column;align-items:flex-end;text-align:right;white-space:nowrap}.ra-e b{font-weight:500}
/* списки */
.li-m{overflow-wrap:anywhere}.li-v{white-space:nowrap}.li-e{white-space:nowrap}.cap{margin:-8px 0 8px}
.st{height:28px;gap:8px;padding:0 12px 0 10px;border:1px solid var(--hair);border-radius:var(--r-pill);background:rgba(255,255,255,.06);font-size:12px}
.st i{box-shadow:none}.st svg{width:20px;height:20px;color:var(--c)}
@supports(background:color-mix(in srgb,red 10%,transparent)){.st{background:color-mix(in srgb,var(--c) 14%,transparent);border-color:color-mix(in srgb,var(--c) 30%,transparent)}}
.li svg,.srow>svg{width:20px;height:20px}
/* поля, кнопки, чипы: единые высоты и радиусы */
.btn{min-height:56px;border-radius:var(--r-btn)}.btn svg{width:24px;height:24px}
.srch,.fld input,.fld select,.num{border-radius:var(--r-fld)}
.srch:focus-within{box-shadow:0 0 0 3px rgba(243,230,211,.1)}
.num button svg{width:20px;height:20px}
.chip{min-height:40px;border:0;border-radius:var(--r-pill);background:var(--s2)}
.seg{border-radius:var(--r-fld)}.sw{border-radius:var(--r-pill)}
.srow{padding:16px;border-radius:var(--r-fld)}.panel{padding:8px var(--sp) calc(var(--bot) + 32px)}.login{padding:32px var(--sp) 28px}
#toast{align-items:center;border-radius:var(--r-btn)}#toast::before{display:none}#toast svg{width:20px;height:20px}#toast.ok svg{color:var(--ok)}#toast.err svg{color:var(--err)}
.login .logo svg{stroke-width:1.75}
/* отчёты */
.rv-d{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-top:8px;font-size:14px}
.dc{font-size:14px;font-weight:500;color:var(--t2)}.dc.up{color:var(--ok)}.dc.dn{color:var(--bad)}
.bar.prev{height:4px;margin-top:4px}.bar.prev i{background:rgba(255,255,255,.28)}
.vb-f{display:flex;justify-content:space-between;gap:12px;margin-top:8px;color:var(--t3);font-size:12px}
/* пустые и загрузочные состояния */
.empty{padding:48px 0}.eic{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:var(--s1);color:var(--t2)}
.sk{height:56px;margin-bottom:8px;border:1px solid var(--hair);border-radius:var(--r-fld);background:linear-gradient(100deg,rgba(255,255,255,.03) 30%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.03) 70%) 0 0/200% 100%,var(--s1);animation:shim 1.6s linear infinite}
.sk.tile{height:96px;margin:0}@keyframes shim{to{background-position:-200% 0}}
/* состояния */
.hbtn:active,.avatar:active,.rbtn:active,#hb:active,.chip:active,.tab:active,.seg button:active,.qa-b:active,.srow:active,.btn:active,.num button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
.num button:focus-visible,.seg button:focus-visible{outline-offset:-3px}
@media(hover:hover){.btn:hover{background:#ecdfca}.btn.ghost:hover{background:var(--s3)}.chip:not(.on):hover,.seg button:not(.on):hover,.qa-b:hover,.srow:hover,.hbtn:hover,.avatar:hover,.rbtn:hover,.tab:not(.on):hover{background:var(--s3)}button.li:hover{background-color:rgba(255,255,255,.04)}.tab:not(.on):hover{color:var(--t1)}}
@media(max-width:380px){.tv{font-size:24px}.lg{font-size:16px}}
html.lite .sk{animation:none}
html.lite .tile,html.lite .tt{-webkit-backdrop-filter:none;backdrop-filter:none}

/* Flowstate / Lumber: единые темы и адаптивная компоновка. */
:root,html[data-t="dark"]{--bg:#0b0c0e;--ink:#0b0c0e;--s1:#16181a;--s2:rgba(255,255,255,.06);--s3:rgba(255,255,255,.11);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.2);--hair:var(--line);--t1:#fff;--t2:#a3a7af;--t3:#858a93;--wood:#fff;--ok:#86d4ae;--warn:#e8c27a;--bad:#e8a29a;--err:#e8a29a;--r-card:20px;--r-btn:999px;--r-fld:16px;--sp:16px;--gap:24px;--blur:blur(20px);--glass:rgba(22,24,26,.9);--fx:0 8px 28px rgba(0,0,0,.12);--active:#fff;--active-ink:#0b0c0e;color-scheme:dark}
html[data-t="light"]{--bg:#f3f4f6;--s1:#fff;--s2:#eceef1;--s3:#e0e3e8;--line:rgba(20,25,35,.1);--line2:rgba(20,25,35,.22);--t1:#15181e;--t2:#565d69;--t3:#67707e;--wood:#15181e;--ink:#fff;--glass:rgba(255,255,255,.92);--ok:#167346;--warn:#866012;--bad:#ad3434;--err:#ad3434;--fx:0 8px 28px rgba(20,25,35,.04);color-scheme:light}
body{color-scheme:inherit;background:var(--bg);font-size:15px}
body::before{background:var(--bg)}body::after{display:none}
.top{gap:8px;background:var(--glass);backdrop-filter:var(--blur);border-bottom:1px solid var(--line);padding:calc(var(--top) + 12px) var(--sp) 12px;flex-wrap:wrap}
#title,body.sub #title{font-family:var(--font);font-size:28px;line-height:40px;font-weight:600;letter-spacing:-.04em}
#hact{flex:none;max-width:100%;display:flex;flex-wrap:wrap;gap:6px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--s1)}
#hact:empty{display:none}
#hact .rbtn,#hact .avatar,#hact .hbtn{width:44px;height:44px;min-width:44px;padding:0;border:0;border-radius:50%;background:transparent;box-shadow:none;backdrop-filter:none;color:var(--t2);font-size:16px}

#hb{margin-left:-6px;border:0;background:transparent;box-shadow:none;width:36px;min-width:36px;height:44px}
#view{padding-top:20px}
.stock,.login,.tile,.tt,.li,.srow{border:1px solid var(--line);background:var(--s1);box-shadow:none;border-radius:var(--r-card)}
.stock{padding:20px}.g-t,.bar,.pb{background:var(--s2);stroke:var(--line2)}
.big,.tv,.tt-v,.pvr b{font-family:var(--font);letter-spacing:-.04em;font-weight:600}
.gv .big{font-size:64px}.big{font-size:48px}.rev .big{font-size:48px}
.qa-b{background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:20px 6px 12px;min-height:96px;font-size:12px}
.qa-b .dot{width:5px;height:5px;top:10px;margin-left:-2px}
.tiles,.tots{gap:10px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.tile,.tt{min-height:116px;padding:16px;gap:5px}
.tl,.tt-l{color:var(--t1);font-weight:500}.ts{order:1}.tv{order:2;margin-top:auto;font-size:28px}.tt-v{margin-top:auto;white-space:normal;overflow-wrap:anywhere;font-size:24px}
.li{width:100%;margin:10px 0 0;padding:16px;gap:6px 12px;background-image:none;align-items:start}
.li-t{font-weight:600}.li-v{font-size:20px;font-weight:600;letter-spacing:-.025em}.li-s{font-size:12px;line-height:1.6}
.li-e{max-width:100%;white-space:normal}.li-v{white-space:normal;overflow-wrap:anywhere}
.li-l{gap:0;margin-top:8px;padding-left:7px;font-size:13px}
.li-l>span:not(.tag){position:relative;display:block;border-left:1px solid var(--line2);padding:2px 0 14px 16px}
.li-l>span:not(.tag):last-child{padding-bottom:2px;border-color:transparent}
.li-l>span:not(.tag)::before{content:"";position:absolute;left:-3px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--t2)}
#rcn{margin-top:24px;border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--s1)}
#rcn:empty{display:none}#rcn>.sh{margin-top:0}
.ra{position:relative;grid-template-columns:minmax(0,1fr) auto;margin-left:6px;padding:10px 0 18px 18px;gap:10px;border-left:1px solid var(--line2);box-shadow:none}

.ra:last-child{border-color:transparent;padding-bottom:0}.ra-i{display:none}.ra-e b{font-size:14px}.ra-e{white-space:normal}

.seg button,.utab,.chip{border:0;border-radius:999px;min-height:44px;padding:0 16px;background:transparent;color:var(--t2);font-size:13px;white-space:nowrap}

.utab.on::after{display:none}.utab.on .mut{color:inherit}.chips{width:fit-content;max-width:100%}.fld .chips{border:0;background:none}
.tabs{left:0;right:0;bottom:0;height:calc(76px + var(--bot));padding:6px 12px calc(6px + var(--bot));gap:4px;border:0;border-top:1px solid var(--line);border-radius:0;background:var(--glass);box-shadow:none;backdrop-filter:var(--blur)}
.tab{display:flex;flex-direction:column;justify-content:center;gap:5px;height:60px;min-height:44px;padding:6px;border-radius:14px;color:var(--t3)}
.tab span{font-size:10px;line-height:14px;font-weight:500}.tab svg{width:23px;height:23px}
.tab.on{color:var(--t1);background:transparent;box-shadow:none}
.act{background:linear-gradient(transparent,var(--bg) 35%);padding-top:24px}
.btn{font-weight:600;box-shadow:none}.btn:active{background:var(--wood)}.btn.ghost:active{background:var(--s3)}
.stackb{gap:12px;margin-top:20px}.stackb .btn{min-height:52px}
.panel{background:var(--glass);border-radius:24px 24px 0 0;border-color:var(--line);box-shadow:var(--fx);max-height:88dvh;overscroll-behavior:contain}
#toast{background:var(--glass);border-color:var(--line);box-shadow:var(--fx)}

.fld input:focus,.fld select:focus,.num:focus-within{border-color:var(--line2);box-shadow:0 0 0 3px var(--s2)}
html.lite .stock,html.lite .tabs,html.lite .login,html.lite .hbtn,html.lite .avatar,html.lite .rbtn,html.lite .panel,html.lite #toast{background:var(--s1);backdrop-filter:none}
@supports not (backdrop-filter:blur(1px)){.top,.tabs,.panel,#toast{background:var(--s1)}}
@media(hover:hover){.btn:hover{background:var(--wood);filter:brightness(.9)}.btn.ghost:hover{background:var(--s3);filter:none}button.li:hover{background:var(--s2)}#hact .hbtn:hover{background:var(--active);color:var(--active-ink)}}

const pwBytes = x => new TextEncoder().encode(x || '').length;
const FW_NAMES = {split: 'Колотые', round: 'Чурбаки (пиленые)'};

// ГОСТ 2708-75, таблица 1. Столбцы: 120, 140, …, 520 мм по верхнему торцу.
// https://meganorm.ru/Data2/1/4294852/4294852358.htm
const GOST_LOG_VOLUMES = {
  3000: [.038,.052,.069,.086,.107,.130,.157,.185,.220,.25,.28,.32,.36,.39,.43,.47,.52,.57,.62,.67,.73],
  4000: [.053,.073,.095,.120,.147,.178,.210,.250,.290,.33,.38,.43,.48,.53,.58,.64,.70,.77,.84,.91,.99],
  4500: [.063,.084,.110,.138,.170,.200,.240,.280,.330,.38,.43,.49,.54,.60,.66,.73,.80,.87,.95,1.03,1.12],
  5000: [.073,.097,.124,.156,.190,.230,.270,.320,.370,.42,.48,.54,.60,.67,.74,.81,.89,.98,1.06,1.15,1.25],
  6000: [.093,.123,.155,.194,.23,.28,.33,.39,.45,.52,.59,.66,.74,.82,.90,1,1.09,1.19,1.30,1.41,1.53]
};
const positiveInt = n => Number.isInteger(n) && n > 0 && n <= 2147483647;
const rounded = (n, scale) => Math.round(n * scale) / scale;
function logVolume(length, diameter) {
  const exact = GOST_LOG_VOLUMES[length]?.[(diameter - 120) / 20];
  if (exact != null) return {volume: exact, exact: true};
  if (!positiveInt(length) || !positiveInt(diameter)) return {volume: 0};
  const referenceLength = [3000,4000,4500,5000,6000].reduce((a,b) => Math.abs(b-length) < Math.abs(a-length) ? b : a);
  const index = Math.max(0, Math.min(20, Math.round((diameter - 120) / 20)));
  const referenceVolume = GOST_LOG_VOLUMES[referenceLength][index];
  // Подбираем сбег (мм/м), чтобы формула по срединному сечению совпала с ближайшим табличным объёмом.
  const middleDiameter = 2000 * Math.sqrt(referenceVolume / (Math.PI * (referenceLength / 1000)));
  const taper = Math.max(0, 2 * (middleDiameter - (120 + index * 20)) / (referenceLength / 1000));
  const middle = diameter + taper * (length / 1000) / 2;
  return {volume: Math.PI * (middle / 2000) ** 2 * (length / 1000), exact: false};
}

function orderDraft(v) {
  const boards = new Map(D.boards.map(b => [String(b.id), b]));
  const requested = new Map();
  let volume = 0, total = rounded(v.delivery, 100) + rounded(v.extra, 100), error = '';
  for (const row of v.rows) {
    if (!Number.isFinite(row.price) || row.price < 0) error ||= 'Укажите неотрицательную цену каждой позиции';
    let lineVolume = 0, key, label, available, amount, unit;
    if (row.type === 'board') {
      const board = boards.get(row.board);
      if (!board) { error ||= 'Выберите доску со склада'; continue; }
      if (!positiveInt(row.cnt)) { error ||= 'Укажите целое количество досок больше нуля'; continue; }
      key = 'board:' + row.board;
      label = `№${board.id} · ${boardLabel(board)}`;
      available = board.count;
      amount = row.cnt;
      unit = 'шт';
      lineVolume = available > 0 ? rounded(board.volume_m3 / available * amount, 1000) : 0;
    } else {
      if (!(row.vol >= .001 && row.vol <= 100000) || rounded(row.vol, 1000) !== row.vol) {
        error ||= 'Объём дров: от 0,001 до 100 000 м³, до трёх знаков после запятой';
        continue;
      }
      if (row.price > 100000000) error ||= 'Цена дров не может превышать 100 000 000 ₽ за м³';
      key = row.kind;
      label = FW_NAMES[row.kind];
      available = D.fw[key + '_m3'] || 0;
      amount = row.vol;
      unit = 'м³';
      lineVolume = row.vol;
    }
    const needed = rounded((requested.get(key)?.amount || 0) + amount, 1000);
    requested.set(key, {label, available, unit, amount: needed, short: needed > available + 1e-9});
    volume += lineVolume;
    total += rounded(lineVolume * rounded(row.price, 100), 100);
  }
  const stock = [...requested.values()];
  const shortage = stock.find(s => s.short);
  if (shortage) error ||= `Не хватает на складе: ${shortage.label}`;
  return {volume, total, stock, error};
}

      <div class="stackb"><button class="btn" data-a="csave" data-v="${c.id}">Сохранить</button>
      ${c.id ? `<button class="btn ghost" data-a="cact" data-v="${c.id}">${c.is_active ? 'Скрыть из списков' : 'Вернуть в списки'}</button><button class="btn ghost" data-a="cdel" data-v="${c.id}">Удалить</button>` : ''}</div>
      ${c.id ? '<p class="mut sm" style="margin-top:16px">Скрытый контрагент пропадает из выбора в формах, но остаётся в старых записях. Удалить можно только того, у кого нет приходов, продаж и заказов.</p>' : ''}`);
  },
  ctog: (v, el) => el.classList.toggle('on'),
  csave: async (v, el) => {
    const id = +v, name = $('#cn').value.trim().replace(/\s+/g, ' '), f = {};
    $$('#ct .chip').forEach(b => f[b.dataset.k] = b.classList.contains('on'));
    if (name.length < 2) { notify('error'); toast('Название: от 2 символов', 'err'); return; }
    if (!f.is_supplier && !f.is_carrier && !f.is_client) { notify('error'); toast('Выберите хотя бы один тип', 'err'); return; }
    const old = id ? D.cl.find(x => x.id == id) : null;
    el.disabled = true;
    try {
      await api(id ? `/contractors/${id}` : '/contractors', {method: id ? 'PUT' : 'POST', body: JSON.stringify({name, ...f, is_active: old ? old.is_active : true})});
      notify('success'); closeSheet(); toast(id ? 'Сохранено' : 'Контрагент добавлен'); vCons();
    } catch (e) { notify('error'); toast(e.message, 'err'); el.disabled = false; }
  },
  cact: async (v, el) => {
    const c = D.cl.find(x => x.id == v); if (!c) return;
    el.disabled = true;
    try {
      await api(`/contractors/${v}`, {method: 'PUT', body: JSON.stringify({name: c.name, is_supplier: c.is_supplier, is_carrier: c.is_carrier, is_client: c.is_client, is_active: !c.is_active})});
      notify('success'); closeSheet(); toast(c.is_active ? 'Скрыт из списков' : 'Возвращён в списки'); vCons();
    } catch (e) { notify('error'); toast(e.message, 'err'); el.disabled = false; }
  },
  cdel: v => {
    const c = D.cl.find(x => x.id == v); if (!c) return;
    ask('user', 'Удалить контрагента', c.name, 'Удалить').then(async ok => {
      if (!ok) return;
      try { await api(`/contractors/${v}`, {method: 'DELETE'}); notify('success'); toast('Контрагент удалён'); vCons(); }
      catch (e) { notify('error'); toast(e.message, 'err'); }
    });
  },
  staff: v => {
    const u = (D.staff || []).find(x => x.id == v); if (!u) return;
    const btns = (u.role === 'manager' ? '' : ['master', 'worker'].filter(r => r !== u.role).map(r => `<button class="btn" data-a="srole" data-v="${u.id}:${r}">Назначить: ${esc(ROLE[r])}</button>`).join('')) + (u.kind === 'password' ? `<button class="btn ghost" data-a="spw" data-v="${u.id}">Сменить пароль</button>` : '');
    sheet(`<h3>${esc(staffName(u))}</h3>
      <div class="dl"><span class="mut">Вход</span><b>${u.kind === 'telegram' ? 'Через Telegram' : 'Логин и пароль'}</b></div>
      ${u.kind === 'telegram' ? `<div class="dl"><span class="mut">Telegram</span><b>${esc(u.tg_username ? '@' + u.tg_username : 'ник не задан')} · ID ${esc(tgId(u))}</b></div>` : ''}
      <div class="dl"><span class="mut">Роль</span><b>${esc(ROLE[u.role] || u.role)}</b></div>
      ${btns ? `<div class="stackb">${btns}</div>` : ''}
      <p class="mut sm" style="margin-top:16px">${u.role === 'manager' ? 'Роль руководителя изменить нельзя.' : 'Новая роль заработает, когда человек заново откроет приложение или войдёт.'}</p>`);
  },
  srole: v => {
    const [id, role] = v.split(':'), u = D.staff.find(x => x.id == id); if (!u) return;
    ask('user', 'Изменить роль', `${staffName(u)}: ${ROLE[role]}`, 'Изменить').then(async ok => {
      if (!ok) return;
      try { await api(`/users/${id}/role`, {method: 'PUT', body: JSON.stringify({role})}); notify('success'); toast('Роль изменена'); vStaff(); }
      catch (e) { notify('error'); toast(e.message, 'err'); }
    });
  },
  spw: v => {
    const u = D.staff.find(x => x.id == v); if (!u) return;
    sheet(`<h3>Новый пароль</h3><p class="mut">${esc(staffName(u))}</p>
      <div class="fld" style="margin-top:16px"><label for="np">Пароль (от 8 символов)</label><input id="np" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Придумайте и передайте сотруднику"></div>
      <button class="btn" data-a="spwok" data-v="${u.id}">Сохранить пароль</button>`);
  },
  spwok: async (v, el) => {
    const p = $('#np').value, n = pwBytes(p);
    if (n < 8 || n > 72) { notify('error'); toast('Пароль: от 8 до 72 символов', 'err'); return; }
    el.disabled = true;
    try { await api(`/users/${v}/password`, {method: 'PUT', body: JSON.stringify({password: p})}); notify('success'); closeSheet(); toast('Пароль изменён'); }
    catch (e) { notify('error'); toast(e.message, 'err'); el.disabled = false; }
  },
  jt: v => { S.jt = v; vJournal(); },
  wt: v => { S.wt = v; S.wsp = ''; vStock(false); },
  sp: v => { S.wsp = v; vStock(false); },
  donefilter: v => {S.donefilter=v;orderList();},
  of: v => { S.of = v; vOrders(false); },
  range: v => { S.range = v; vStats(); },
  boardgroup: key => {
    const batches=D.boards.filter(x=>boardGroupKey(x)===key);
    if(!batches.length)return;
    sheet(`<h3>${esc(boardTitle(batches[0]))}</h3><p class="mut">${fmt(sum(batches,'count'),0)} шт · ${fmt(sum(batches,'volume_m3'),3)} м³</p><p class="mut sm">Выберите партию для заказа или корректировки остатка.</p>${batches.map(x=>li('Позиция №'+esc(x.id),esc([lenM(x.length_mm),sdate(x.created_at)].filter(Boolean).join(' · ')),fmt(x.volume_m3,3)+' м³',fmt(x.count,0)+' шт',{a:'item',d:'boards:'+x.id})).join('')}`);
  },
  item: v => {
    const [t, id] = v.split(':'), x = find(t, id); if (!x) return;
    sheet(`<h3>${t === 'boards' ? esc(boardTitle(x)) : `Бревно Ø${esc(x.diameter_mm)}`}</h3>
      <div class="dl"><span class="hint">Позиция склада</span><b>№${esc(x.id)}</b></div><div class="dl"><span class="hint">Порода</span><b>${esc(x.species || 'не указана')}</b></div>
      <div class="dl"><span class="hint">Длина</span><b>${lenM(x.length_mm)}</b></div>
      ${t === 'boards' ? `<div class="dl"><span class="hint">Сорт</span><b>${esc(x.grade || '1')}</b></div>` : `<div class="dl"><span class="hint">Партия прихода</span><b>№${esc(x.arrival_id)}</b></div>`}
      <div class="dl"><span class="hint">Остаток</span><b>${esc(x.count)} шт${t === 'boards' && (+x.count || 0) <= LOW_STOCK_PCS ? ' · мало на складе' : ''}</b></div>
      <div class="dl"><span class="hint">Объём</span><b>${fmt(x.volume_m3, 3)} м³</b></div>
      ${t === 'boards' && canOrd() ? `<button class="btn rip" style="margin-top:14px" data-a="mk" data-v="order:board:${x.id}">Создать заказ на эту позицию</button>` : ''}
      ${t === 'logs' ? `<button class="btn rip" style="margin-top:14px" data-a="mk" data-v="sawing:log:${x.id}">Записать распиловку из этой партии</button>` : ''}
      ${S.role === 'manager' ? `<button class="btn ghost" style="margin-top:10px" data-a="adj" data-v="${t}:${x.id}">Списать или исправить остаток</button>` : ''}`);
  },
  adj: v => {
    const [t, id] = v.split(':'), x = find(t, id); if (!x) return;
    const rs = Object.entries(ADJ).filter(([k]) => t === 'boards' || k !== 'surplus');
    sheet(`<h3>Корректировка остатка</h3><p class="mut">${esc(t === 'boards' ? boardTitle(x) : 'Бревно Ø' + x.diameter_mm + ' · партия №' + x.arrival_id)} · сейчас ${esc(x.count)} шт</p>
      <div class="fld" style="margin-top:16px"><label>Причина</label><div class="chips" id="ar" style="flex-wrap:wrap;overflow:visible;margin:0;padding:0">${rs.map(([k, l]) => `<button type="button" class="chip rip" data-a="adjr" data-v="${k}">${esc(l)}</button>`).join('')}</div></div>
      <div class="fld"><label for="ac">Сколько штук</label><input id="ac" inputmode="numeric" autocomplete="off" placeholder="например, 5"></div>
      <div class="fld"><label for="an">Пояснение</label><input id="an" maxlength="200" autocomplete="off" placeholder="что случилось"></div>
      <button class="btn" data-a="adjok" data-v="${t}:${id}">Записать</button>
      <p class="mut sm" style="margin-top:12px">Операция попадёт в журнал корректировок.</p>`);
  },
  adjr: (v, el) => { $$('#ar .chip').forEach(b => b.classList.toggle('on', b === el)); },
  adjok: v => {
    const [t, id] = v.split(':'), x = find(t, id); if (!x) return;
    const r = ($('#ar .chip.on') || {}).dataset ? $('#ar .chip.on').dataset.v : '', n = Math.round(num($('#ac').value)), note = $('#an').value.trim();
    if (!r) { notify('error'); toast('Выберите причину', 'err'); return; }
    if (!(n > 0)) { notify('error'); toast('Укажите, сколько штук', 'err'); return; }
    if (r !== 'surplus' && n > x.count) { notify('error'); toast(`На складе только ${x.count} шт`, 'err'); return; }
    if (r === 'other' && !note) { notify('error'); toast('Напишите пояснение', 'err'); return; }
    ask('ok', r === 'surplus' ? 'Добавить на склад' : 'Списать со склада', `${n} шт · ${ADJ[r]}`, 'Записать').then(async ok => {
      if (!ok) return;
      try {
        await api('/stock/adjust', {method: 'POST', body: JSON.stringify({kind: t === 'boards' ? 'board' : 'log', item_id: +id, count: n, reason: r, note})});
        notify('success'); toast('Остаток исправлен'); if (S.cur === 'stock') vStock(true);
      } catch (e) { notify('error'); toast(e.message, 'err'); }
    });
  },
  mk: v => { const [f, k, id] = v.split(':'); closeSheet(); go(f, {[k]: id}); },
  done: (v, el) => ask('ok', 'Завершить заказ №' + v, 'Товары будут списаны со склада и проведены как продажа.', 'Завершить').then(ok => ok && doComplete(v, el)),
  pdf: v => pdfSheet(v), pdfsend: (v, el) => pdfDo('send', v, el), pdfdl: (v, el) => pdfDo('dl', v, el), pdfview: (v, el) => pdfDo('view', v, el),
  addrow: type => { const row = addFormRow(type); row?.querySelector('input,select')?.focus(); calcForm(); },
  removerow: (_, el) => { el.closest('[data-form-row]').remove(); $('#form-rows + .form-row-tools button')?.focus(); calcForm(); },
  logauto: (_, el) => {
    const row = el.closest('[data-form-row]');
    delete row.dataset.manual; updateLogRow(row); fe('vol', row).focus(); calcForm();
  },
  chip: (v, el) => {
    const row = el.closest('[data-form-row]');
    fe(el.dataset.k, row || document).value = v; rowFormChanged(el, row);
  },
  size: v => { const [a, b] = v.split('×'); fe('th').value = a; fe('wd').value = b; calcForm(); },
  st: (v, el) => {
    const row = el.closest('[data-form-row]');
    const fields = row ? FORM_ROWS[row.dataset.formRow].fields : FORMS[FK].f;
    const f = fields.find(x => x.k === el.dataset.k), i = fe(f.k, row || document);
    i.value = Math.max(0, rounded(num(i.value) + (+v) * (f.s || 1), 1000)); rowFormChanged(el, row);
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = ACT[el.dataset.a]; if (f) { hap(); f(el.dataset.v, el); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'staffq'){S.staffq=t.value;staffList();}
  else if(t.id === 'jq') { S.jq=t.value; filterJournal(); }
  else if (t.id === 'q') { S.wq = t.value; clearTimeout(DEB); DEB = setTimeout(() => stockList(false), 120); }
  else if (t.id === 'cq') { S.cq = t.value; clearTimeout(DEB); DEB = setTimeout(conList, 120); }
  else if (t.id === 'oq') { S.oq = t.value; clearTimeout(DEB); DEB = setTimeout(() => orderList(false), 120); }
  else if (t.id === 'd1' || t.id === 'd2') { S.range = 'custom'; $$('[data-a="range"]').forEach(b => b.classList.remove('on')); loadStats(); }
  else if (t.dataset.k && FK) rowFormChanged(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.k && FK) { if (FK === 'sawing' && t.dataset.k === 'log') syncLog(); rowFormChanged(t); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && $('#sheet').classList.contains('on')) { settle(false); return; } if (e.key === 'Enter' && e.target.id === 'lp') login(); });

/* ---------- старт ---------- */
if (inTg) tgAuth();
else { const j = jwt(); if (j && j.exp * 1000 > Date.now()) finish(token()); else vLogin(); }
</script>
</body>
</html>
